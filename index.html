    const again = document.getElementById("new-name");
    if (again) again.focus();
  }

  let wakeLock = null;
  function keepAwake() {
    try {
      if (navigator.wakeLock && !wakeLock) navigator.wakeLock.request("screen").then(l => { wakeLock = l; l.addEventListener("release", () => (wakeLock = null)); }).catch(() => {});
    } catch (e) { /* niet ondersteund */ }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.phase !== "setup" && S.phase !== "end") keepAwake(); });

  const pick1 = () => picks("act")[0];

  const H = {
    tab: d => { ui.tab = d.tab; ui.confirmNew = false; render(); window.scrollTo(0, 0); },
    undo: () => undo(),
    pick: d => {
      const ns = d.ns, id = +d.id, max = +d.max;
      let a = picks(ns);
      if (max === 1) a = a[0] === id ? [] : [id];
      else a = a.includes(id) ? a.filter(x => x !== id) : a.length < max ? a.concat(id) : a;
      ui.picks[ns] = a;
      render();
    },

    "toggle-set": d => { ui.openSets[d.set] = !ui.openSets[d.set]; render(); },
    "add-player": () => addPlayer(),
    "remove-player": d => act(() => { S.sample = false; S.players = S.players.filter(p => p.id !== +d.id); }),
    deck: d => act(() => { S.deck[d.role] = Math.max(0, (S.deck[d.role] || 0) + +d.delta); }),
    deal: () => act(() => {
      const cards = shuffle(ORDER.flatMap(r => Array(S.deck[r] || 0).fill(r)));
      S.players.forEach((p, i) => (p.role = cards[i] || null));
      log("De rollen zijn willekeurig verdeeld.");
    }),
    "clear-roles": () => act(() => S.players.forEach(p => (p.role = null))),
    "show-roles": () => { ui.reveal = { i: 0, shown: false }; render(); },
    "reveal-show": () => { ui.reveal.shown = true; render(); },
    "reveal-next": () => { ui.reveal = { i: ui.reveal.i + 1, shown: false }; if (ui.reveal.i >= S.players.length) ui.reveal = null; render(); },
    "reveal-close": () => { ui.reveal = null; render(); },
    start: () => {
      if (setupProblems().length) return;
      act(() => {
        S.sample = false;
        S.phase = "night"; S.round = 1;
        const inPlay = ORDER.filter(r => S.deck[r] > 0).map(r => S.deck[r] + "× " + ROLES[r].name);
        log("Het spel begint met " + S.players.length + " spelers: " + inPlay.join(", ") + ".");
        log("Nacht 1 begint.");
      });
      ui.tab = "spel";
      keepAwake();
      window.scrollTo(0, 0);
    },

    identify: d => {
      const ids = picks("id");
      act(() => {
        ids.forEach(id => (P(id).role = d.role));
        log(list(ids.map(nameOf)) + (ids.length > 1 ? " zijn " : " is ") + ROLES[d.role].name + ".");
      });
    },
    "step-next": d => act(() => done(d.step)),
    sect: () => act(() => {
      const a = picks("act");
      living().forEach(p => (p.group = a.includes(p.id) ? "A" : "B"));
      log("Groep A: " + list(a.map(nameOf)) + ". Groep B: " + list(living().filter(p => p.group === "B").map(p => p.name)) + ".");
      done("sektarier");
    }),
    "dief-swap": () => {
      const r = document.getElementById("dief-role").value;
      act(() => {
        const thief = holders("dief").find(p => p.alive);
        thief.orig = "dief"; thief.role = r;
        S.deck.dief = Math.max(0, S.deck.dief - 1); S.deck[r] = (S.deck[r] || 0) + 1;
        log(thief.name + " (Dief) ruilt en is nu " + ROLES[r].name + ".");
        done("dief");
      });
    },
    cupido: () => act(() => {
      const ids = picks("act");
      ids.forEach(id => (P(id).lover = true));
      log("Cupido maakt " + list(ids.map(nameOf)) + " verliefd.");
      done("cupido");
    }),
    wild: () => act(() => { S.wildModel = pick1(); log("De Kleine wilde kiest " + nameOf(S.wildModel) + " als voorbeeld."); done("wildkind"); }),
    actor: () => {
      const r = document.getElementById("actor-role").value;
      act(() => { S.night.actor = r; S.used.toneel.push(r); log("De Toneelspeler speelt tot de volgende nacht " + ROLES[r].name + "."); });
    },
    protect: () => act(() => { S.night.protect = pick1(); log("De Genezer beschermt " + nameOf(S.night.protect) + "."); done("beschermer"); }),
    see: () => act(() => {
      const p = P(pick1());
      S.night.seen = p.id;
      log("De Ziener bekijkt " + p.name + ": " + (p.role ? ROLES[p.role].name : "rol nog onbekend") + (p.infected ? " (besmet)" : "") + ".");
    }),
    "seer-record": () => {
      const r = document.getElementById("seer-role").value;
      act(() => { const p = P(S.night.seen); p.role = r; log(p.name + " is " + ROLES[r].name + "."); });
    },
    fox: () => act(() => {
      const mid = P(pick1());
      const grp = [neighbour(mid, -1), mid, neighbour(mid, 1)].filter((q, i, a) => q && a.indexOf(q) === i);
      S.night.fox = grp.map(p => p.id);
      const hit = grp.some(isWolf);
      if (!hit) S.used.foxLost = true;
      log("De Vos snuffelt bij " + list(grp.map(p => p.name)) + ": " + (hit ? "minstens één weerwolf." : "geen weerwolf. De Vos verliest zijn gave."));
    }),
    aap: () => act(() => {
      const p = P(pick1());
      S.used.aap = true;
      S.night.aap.push(p.id);
      log("De Aap bekijkt " + p.name + ": " + (p.role ? ROLES[p.role].name : "rol nog onbekend") + ".");
    }),
    dog: d => act(() => {
      const dog = S.players.find(p => p.alive && p.role === "wolfshond");
      dog.orig = "wolfshond"; dog.role = d.choice;
      log(dog.name + " (Wolfshond) kiest ervoor " + (d.choice === "weerwolf" ? "weerwolf" : "burger") + " te worden.");
    }),
    wolves: () => act(() => { S.night.wolfTarget = pick1(); log("De weerwolven kiezen " + nameOf(S.night.wolfTarget) + "."); done("weerwolven"); }),
    infect: () => act(() => { S.night.infect = true; S.used.oerwolf = true; log("De Besmettelijke Oerwolf besmet " + nameOf(S.night.wolfTarget) + "."); done("oerwolf"); }),
    bigwolf: () => act(() => { S.night.bigKill = pick1(); log("De Grote Boze Wolf kiest " + nameOf(S.night.bigKill) + "."); done("grotewolf"); }),
    mother: () => act(() => {
      const p = P(pick1());
      const lost = isSpecialVillager(p.role) && !p.infected ? p.role : null;
      if (lost) { p.orig = p.role; p.role = "burger"; }
      S.night.mother = { id: p.id, lost };
      log("De Machtige Wolvenmoeder wijst " + p.name + " aan" + (lost ? ": verliest de gave van " + ROLES[lost].name + "." : ". Er gebeurt niets."));
    }),
    white: () => act(() => { S.night.whiteKill = pick1(); log("De Witte weerwolf kiest " + nameOf(S.night.whiteKill) + "."); done("wittewolf"); }),
    heal: () => act(() => { S.witch.heal = false; S.night.healed = true; log("De Heks gebruikt haar levenselixer op " + nameOf(S.night.wolfTarget) + "."); }),
    poison: () => act(() => { S.witch.poison = false; S.night.poison = pick1(); log("De Heks geeft haar gif aan " + nameOf(S.night.poison) + "."); }),
    spirit: () => act(() => { S.night.spirit = true; log("De Zigeunerin gebruikt een Spiritisme-kaart."); done("zigeunerin"); }),
    raven: () => act(() => { S.night.raven = pick1(); log("De Raaf markeert " + nameOf(S.night.raven) + "."); done("raaf"); }),
    fire: () => act(() => { S.used.pyromaan = true; log("De Pyromaan steekt het gebouw van " + nameOf(pick1()) + " in brand."); done("pyromaan"); }),
    charm: () => act(() => {
      const ids = picks("act");
      ids.forEach(id => (P(id).charmed = true));
      log("De Fluitspeler betovert " + list(ids.map(nameOf)) + ".");
      done("fluitspeler");
    }),
    dawn: () => { act(() => resolveNight()); window.scrollTo(0, 0); },

    "pend-reveal": () => {
      const r = document.getElementById("pend-role").value;
      act(() => {
        const it = S.pending.shift();
        const p = P(it.id);
        p.role = r;
        finishKill(p, it.cause);
      });
    },
    "pend-shoot": () => act(() => { const it = S.pending.shift(); killPlayer(picks("shoot")[0], it.type === "kolos" ? "kolos" : "jager"); }),
    "pend-mayor": () => act(() => {
      S.pending.shift();
      const p = P(picks("succ")[0]);
      p.mayor = true;
      log(p.name + " is de nieuwe burgemeester.");
    }),
    "pend-voters": () => act(() => {
      S.pending.shift();
      S.nextVoteOnly = picks("voters");
      log("De Zondebok bepaalt dat de volgende dag alleen " + list(S.nextVoteOnly.map(nameOf)) + " mogen stemmen.");
    }),
    "pend-maid": () => act(() => {
      const it = S.pending.shift();
      const p = P(it.id), maid = P(it.maid);
      maid.orig = "dienstmeisje"; maid.role = p.role;
      log(maid.name + " (Toegewijde dienstmeisje) neemt de rol " + ROLES[p.role].name + " over van " + p.name + ".");
    }),
    "pend-skip": () => act(() => {
      const it = S.pending.shift();
      if (it.type === "jager") log("De Jager schiet niemand neer.");
      if (it.type === "kolos") log("De Kolos neemt niemand mee.");
    }),

    elect: () => act(() => { const p = P(picks("elect")[0]); p.mayor = true; S.day.electionDone = true; log(p.name + " is gekozen tot burgemeester."); }),
    "elect-skip": () => act(() => { S.day.electionDone = true; }),
    vote: d => { const id = +d.id; S.day.votes[id] = Math.max(0, (S.day.votes[id] || 0) + +d.delta); persist(); render(); },
    "vote-sel": d => { ui.voteSel = ui.voteSel === +d.id ? null : +d.id; render(); },
    "vote-out": d => {
      act(() => {
        const id = +d.id;
        S.day.voted = true; S.day.out = id;
        killPlayer(id, "stem");
      });
      ui.voteSel = null; render();
    },
    "vote-none": () => act(() => { S.day.voted = true; S.day.out = null; log("Het dorp stemt niemand weg."); }),
    "second-vote": () => act(() => {
      S.used.raadsheer = true;
      S.day.voted = false; S.day.out = null; S.day.votes = {}; S.day.second = true;
      log("De Stotterende raadsheer geeft het teken: er volgt een tweede stemming.");
    }),
    dusk: () => { act(() => startNight()); window.scrollTo(0, 0); },

    "win-end": () => act(() => { const w = winner(); S.endText = w ? w.text : ""; S.phase = "end"; log(w ? w.text : "Het spel is beëindigd."); }),
    "win-continue": () => act(() => { S.dismissed = winner().key; }),

    "p-kill": d => act(() => killPlayer(+d.id, "spelleider")),
    "p-revive": d => act(() => { const p = P(+d.id); p.alive = true; p.diedRound = null; log(p.name + " is door de spelleider weer tot leven gebracht."); }),

    "new-game": () => { ui.confirmNew = true; render(); },
    "new-cancel": () => { ui.confirmNew = false; render(); },
    "new-same": () => act(() => {
      const names = S.players.map(p => p.name), deck = S.deck, opts = S.opts;
      S = newState(names, false); S.deck = deck; S.opts = opts;
      ui.confirmNew = false; ui.tab = "spel"; ui.openSets = null;
    }),
    "new-fresh": () => act(() => { S = newState([], false); S.deck = emptyDeck(); ui.confirmNew = false; ui.tab = "spel"; ui.openSets = null; })
  };

  const CH = {
    rename: (el, d) => {
      // Geen nieuwe weergave: dan blijft een klik op een andere knop gewoon werken.
      const p = P(+d.id);
      if (!p) return;
      hist.push(JSON.stringify(S));
      p.name = el.value.trim() || p.name;
      el.value = p.name;
      S.sample = false;
      persist();
      document.getElementById("undo-btn").disabled = false;
    },
    setrole: (el, d) => act(() => {
      const p = P(+d.id);
      p.role = el.value || null;
      if (S.phase !== "setup") log("Spelleider zet de rol van " + p.name + " op " + (p.role ? ROLES[p.role].name : "onbekend") + ".");
    }),
    opt: (el, d) => act(() => { S.opts[d.key] = el.checked; })
  };

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-action]");
    if (!b || b.disabled) return;
    const fn = H[b.dataset.action];
    if (fn) fn(b.dataset, b);
  });
  document.addEventListener("change", e => {
    const el = e.target.closest("[data-change]");
    if (!el) return;
    const fn = CH[el.dataset.change];
    if (fn) fn(el, el.dataset);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.id === "new-name") { e.preventDefault(); addPlayer(); }
  });

  render();
  if (S.phase === "night" || S.phase === "day") keepAwake();
})();
</script>
</body>
</html>
