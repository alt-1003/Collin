<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wakkerdam Spelleider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: één smalle kolom als het kladblok van de spelleider, vaste tabbalk onderin.
   De fase kleurt de hele pagina: nacht is inktblauw met maanlicht, dag is bleek hooi. */
:root {
  --bg: #0e1322;
  --surface: #161d30;
  --raised: #1f2842;
  --line: #2c3654;
  --fg: #e9e4d6;
  --muted: #929bb1;
  --accent: #e2bb5f;
  --accent-ink: #1b1505;
  --wolf: #e0676b;
  --good: #79c497;
  --warn: #e9a653;
  --f-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
:root[data-phase="day"] {
  --bg: #e6e9e0;
  --surface: #f5f6f1;
  --raised: #ffffff;
  --line: #cbd1c3;
  --fg: #1b211e;
  --muted: #5a645d;
  --accent: #94600f;
  --accent-ink: #fffaf0;
  --wolf: #b2353b;
  --good: #2c7a4d;
  --warn: #9d5e0c;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  transition: background-color .6s ease;
}
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 120px; }

/* Kop */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  transition: background-color .6s ease;
}
.top-in { max-width: 640px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.emblem { flex: none; width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 10px -5px 0 0 var(--accent); transform: rotate(-20deg); }
:root[data-phase="day"] .emblem { background: var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); transform: none; }
.top-title { min-width: 0; flex: 1; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; line-height: 1.1; }
.top p { margin: 0; color: var(--muted); font-size: .9rem; }

/* Tabbalk */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs button { background: none; border: 0; padding: 14px 8px; color: var(--muted); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: .8rem; cursor: pointer; border-top: 3px solid transparent; }
.tabs button[aria-current="page"] { color: var(--fg); border-top-color: var(--accent); }

/* Typografie */
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.55rem; line-height: 1.15; margin: 0; text-wrap: balance; }
h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; font-weight: 700; }
.eyebrow { margin: 0; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
p { margin: 0; }

.stack { display: flex; flex-direction: column; gap: 14px; }
section.block { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card.alert { border-color: var(--accent); }
.card.win { border-color: var(--good); }

/* Knoppen */
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { min-height: 46px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { border-color: var(--wolf); color: var(--wolf); background: transparent; }
.btn.quiet { background: transparent; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .9rem; }

/* Voorleestekst */
.script { background: var(--raised); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.script .label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.script p { font-style: italic; font-size: 1.1rem; }

/* Volgorde van de nacht */
.order { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.order li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
.order li span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--raised); font-variant-numeric: tabular-nums; font-size: .75rem; }
.order li.done { opacity: .55; }
.order li.done span { background: transparent; }
.order li.done span::before { content: "✓"; }
.order li.done span b { display: none; }
.order li.now { border-color: var(--accent); color: var(--fg); }
.order li.now span { background: var(--accent); color: var(--accent-ink); }
.order li.dead { text-decoration: line-through; }

/* Spelerskeuze */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.pick { min-height: 52px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; overflow-wrap: anywhere; }
.pick small { color: var(--muted); font-size: .75rem; }
.pick.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pick.on small { color: inherit; opacity: .8; }

/* Labels / chips */
.tags { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: .72rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; letter-spacing: .02em; }
.tag.wolf { border-color: var(--wolf); color: var(--wolf); }
.tag.solo { border-color: var(--warn); color: var(--warn); }
.tag.acc { border-color: var(--accent); color: var(--accent); }
.tag.good { border-color: var(--good); color: var(--good); }

.note { font-size: .92rem; color: var(--muted); }
.note.warn { color: var(--warn); }
.note.bad { color: var(--wolf); }
.big-reveal { font-family: var(--f-display); font-size: 2rem; line-height: 1.1; }

/* Lijsten */
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.rows > li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rows > li:first-child { border-top: 0; }
.rows .grow { flex: 1; min-width: 0; }
.rows .num { width: 1.6em; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.rows .dead .pname, .rows li.dead .pname { text-decoration: line-through; color: var(--muted); }
.pname { font-weight: 700; overflow-wrap: anywhere; }
input[type="text"], select { min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); padding: 6px 10px; max-width: 100%; }
input[type="text"] { width: 100%; }
.setup-row input[type="text"] { flex: 1 1 140px; width: auto; min-width: 0; }
.setup-row select { flex: 0 1 170px; min-width: 0; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; }

.stepper { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-size: 1.2rem; line-height: 1; }
.stepper output { min-width: 1.8em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
.role-desc { font-size: .85rem; color: var(--muted); }

.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); min-width: 0; }
.fact h3 { margin-bottom: 2px; }
.fact p { overflow-wrap: anywhere; }

.log-round { display: flex; flex-direction: column; gap: 6px; }
.log-round ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
.log-round li::marker { color: var(--muted); }

.vote .ctr { display: inline-flex; align-items: center; gap: 4px; }
.vote .vname { background: none; border: 0; padding: 4px 0; text-align: left; cursor: pointer; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.vote li.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }

/* Rolkaart doorgeven */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.overlay .card { width: 100%; max-width: 420px; text-align: center; align-items: center; }
.setgroup { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.sethead { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; background: none; border: 0; cursor: pointer; text-align: left; }
.sethead .pname { font-size: 1.05rem; }
.sethead .chev { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.setgroup .rows { border: 0; border-radius: 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="emblem" aria-hidden="true"></div>
    <div class="top-title">
      <h1 id="phase-title">Voorbereiding</h1>
      <p id="phase-sub"></p>
    </div>
    <button type="button" class="btn sm quiet" id="undo-btn" data-action="undo">Ongedaan maken</button>
  </div>
</header>
<main class="wrap" id="main"></main>
<nav class="tabs" aria-label="Onderdelen">
  <div class="tabs-in">
    <button type="button" data-action="tab" data-tab="spel">Spel</button>
    <button type="button" data-action="tab" data-tab="spelers">Spelers</button>
    <button type="button" data-action="tab" data-tab="log">Logboek</button>
  </div>
</nav>
<div id="overlay" class="overlay" hidden></div>
<noscript><p style="padding:16px">Deze app heeft JavaScript nodig.</p></noscript>

<script>
(function () {
  "use strict";

  const KEY = "wakkerdam-spelleider-v1";

  const SETS = {
    basis: "Basisspel",
    vollemaan: "Volle Maan",
    karakters: "Karakters",
    dorp: "Het Dorp",
    jubileum: "Jubileumeditie (25 jaar)"
  };

  const ROLES = {
    // Basisspel
    weerwolf:     { set: "basis", name: "Weerwolf", team: "wolf", desc: "Kiest elke nacht samen met de andere weerwolven een slachtoffer." },
    burger:       { set: "basis", name: "Burger", team: "dorp", desc: "Geen speciale gave. Stemt overdag mee." },
    ziener:       { set: "basis", name: "Ziener", team: "dorp", desc: "Bekijkt elke nacht de kaart van één speler." },
    meisje:       { set: "basis", name: "Onschuldig meisje", team: "dorp", desc: "Mag gluren als de weerwolven wakker zijn. Wordt ze betrapt, dan sterft zij in plaats van het slachtoffer." },
    jager:        { set: "basis", name: "Jager", team: "dorp", desc: "Schiet bij zijn dood direct iemand neer." },
    cupido:       { set: "basis", name: "Cupido", team: "dorp", desc: "Maakt in de eerste nacht twee spelers verliefd. Sterft de een, dan sterft de ander ook." },
    heks:         { set: "basis", name: "Heks", team: "dorp", desc: "Heeft één levenselixer en één gif voor het hele spel. Mag ze in dezelfde nacht gebruiken." },
    dief:         { set: "basis", name: "Dief", team: "dorp", desc: "Mag in de eerste nacht zijn kaart ruilen met een van de twee overgebleven kaarten." },
    // Volle Maan
    dorpsgek:     { set: "vollemaan", name: "Dorpsgek", team: "dorp", desc: "Wordt hij weggestemd, dan blijft hij leven maar verliest hij zijn stemrecht." },
    oudste:       { set: "vollemaan", name: "Dorpsoudste", team: "dorp", desc: "Overleeft de eerste aanval van de weerwolven. Doodt het dorp hem, dan verliezen alle burgers hun gaven." },
    zondebok:     { set: "vollemaan", name: "Zondebok", team: "dorp", desc: "Sterft bij een gelijke stand en bepaalt dan wie er de volgende dag mag stemmen." },
    beschermer:   { set: "vollemaan", name: "Genezer", team: "dorp", desc: "Beschermt elke nacht één speler tegen de weerwolven, nooit twee nachten achter elkaar dezelfde." },
    fluitspeler:  { set: "vollemaan", name: "Fluitspeler", team: "solo", desc: "Betovert elke nacht twee spelers. Wint als iedereen die nog leeft betoverd is." },
    // Karakters
    dorpeling:    { set: "karakters", name: "Dorpse dorpeling", team: "dorp", desc: "Een gewone burger, en iedereen weet het: zijn kaart is aan beide kanten gelijk." },
    zus:          { set: "karakters", name: "Gezuster", team: "dorp", desc: "De twee gezusters kennen elkaar en mogen af en toe 's nachts in stilte overleggen." },
    broer:        { set: "karakters", name: "Gebroeder", team: "dorp", desc: "De drie gebroeders kennen elkaar en mogen af en toe 's nachts in stilte overleggen." },
    engel:        { set: "karakters", name: "Engel", team: "solo", desc: "Wint meteen als hij in de eerste ronde sterft. Anders speelt hij als burger." },
    raadsheer:    { set: "karakters", name: "Stotterende raadsheer", team: "dorp", desc: "Mag één keer per spel met een geheim teken een tweede stemming afdwingen." },
    ridder:       { set: "karakters", name: "Ridder met het roestige zwaard", team: "dorp", desc: "Doden de weerwolven hem, dan sterft de eerste weerwolf links van hem de volgende nacht." },
    toneelspeler: { set: "karakters", name: "Toneelspeler", team: "dorp", desc: "Kiest elke nacht een van de klaargelegde rollen en speelt die tot de volgende nacht. Elke rol maar één keer." },
    dienstmeisje: { set: "karakters", name: "Toegewijde dienstmeisje", team: "dorp", desc: "Mag de rol overnemen van iemand die net is weggestemd, voordat zijn kaart wordt omgedraaid." },
    vos:          { set: "karakters", name: "Vos", team: "dorp", desc: "Wijst elke nacht het midden van een groepje van drie aan. Zit er geen weerwolf bij, dan verliest hij zijn gave." },
    titus:        { set: "karakters", name: "Titus en zijn dansende beer", team: "dorp", desc: "De beer gromt 's ochtends als er een weerwolf direct naast Titus zit." },
    sektarier:    { set: "karakters", name: "Verschrikkelijke Sektariër", team: "solo", desc: "Het dorp wordt in twee groepen verdeeld. Hij wint als de andere groep helemaal dood is." },
    wildkind:     { set: "karakters", name: "Kleine wilde", team: "dorp", desc: "Kiest in de eerste nacht een voorbeeld. Sterft dat voorbeeld, dan wordt hij een weerwolf. In de Best Of heet hij Wolvenkind." },
    wolfshond:    { set: "karakters", name: "Wolfshond", team: "dorp", desc: "Kiest in de eerste nacht of hij weerwolf of burger wordt." },
    wittewolf:    { set: "karakters", name: "Witte weerwolf", team: "solo", desc: "Wordt wakker met de weerwolven, maar mag om de nacht een weerwolf doden. Wint alleen." },
    grotewolf:    { set: "karakters", name: "Grote Boze Wolf", team: "wolf", desc: "Doodt elke nacht nog een extra slachtoffer, zolang er geen weerwolf, Kleine wilde of Wolfshond is gestorven." },
    oerwolf:      { set: "karakters", name: "Besmettelijke Oerwolf", team: "wolf", desc: "Mag één keer per spel het slachtoffer besmetten. Die wordt dan weerwolf en houdt zijn eigen gave." },
    zigeunerin:   { set: "karakters", name: "Zigeunerin", team: "dorp", desc: "Mag 's nachts een Spiritisme-kaart laten gebruiken. De eerste dode van die nacht beantwoordt de vraag met ja of nee." },
    // Het Dorp
    raaf:         { set: "dorp", name: "Raaf", team: "dorp", desc: "Geeft elke nacht één speler twee extra stemmen tegen zich." },
    pyromaan:     { set: "dorp", name: "Pyromaan", team: "dorp", desc: "Mag één keer per spel 's nachts een gebouw in brand steken. Dat gebouw verliest zijn eigenschap." },
    // Jubileumeditie
    aap:          { set: "jubileum", name: "Aap", team: "dorp", desc: "Mag één keer per spel 's nachts kaarten bekijken. Zolang hij burgers ziet, mag hij doorgaan." },
    poppenspeler: { set: "jubileum", name: "Poppenspeler", team: "dorp", desc: "Kiezen de weerwolven hem, dan neemt zijn pop de klap. Dat werkt één keer." },
    kolos:        { set: "jubileum", name: "Kolos", team: "dorp", desc: "Doden de weerwolven hem, dan mag hij aan het eind van de nacht een weerwolf doden." },
    wolvenmoeder: { set: "jubileum", name: "Machtige Wolvenmoeder", team: "wolf", desc: "Wordt de eerste twee nachten nog eens alleen wakker. Wijst ze een burger met een gave aan, dan wordt die een gewone burger." }
  };
  const ORDER = Object.keys(ROLES);
  const WOLF_ROLES = ["weerwolf", "grotewolf", "oerwolf", "wolvenmoeder", "wittewolf"];
  const PLAIN = ["burger", "dorpeling"];
  const TEAM = { dorp: "Dorp", wolf: "Weerwolf", solo: "Solo" };
  const CAUSE = {
    weerwolven: "gedood door de weerwolven",
    grotewolf: "gedood door de Grote Boze Wolf",
    wittewolf: "gedood door de Witte weerwolf",
    gif: "vergiftigd door de Heks",
    stem: "weggestemd door het dorp",
    jager: "neergeschoten door de Jager",
    kolos: "verpletterd door de Kolos",
    roest: "gestorven aan de wond van het roestige zwaard",
    liefde: "gestorven van liefdesverdriet",
    spelleider: "door de spelleider op dood gezet"
  };
  const SAMPLE = ["Anouk", "Bram", "Daan", "Eva", "Fleur", "Jesse", "Lotte", "Milan"];

  /* ---------- staat ---------- */

  function mkPlayer(id, name) {
    return { id, name, role: null, orig: null, alive: true, lover: false, charmed: false, mayor: false, canVote: true,
      elderHit: false, revealed: false, infected: false, puppetUsed: false, diedRound: null, group: null };
  }
  function emptyDeck() { const d = {}; ORDER.forEach(r => (d[r] = 0)); return d; }
  function defaultDeck(n) {
    const d = emptyDeck();
    d.weerwolf = Math.max(1, Math.round(n / 4));
    let left = n - d.weerwolf;
    for (const r of ["ziener", "heks", "jager", "cupido", "meisje"]) {
      if (left <= 1) break;
      d[r] = 1; left--;
    }
    d.burger = Math.max(0, left);
    return d;
  }
  function freshNight() {
    return { done: [], wolfTarget: null, protect: null, healed: false, poison: null, whiteKill: null, bigKill: null,
      infect: false, raven: null, seen: null, actor: null, fox: null, aap: [], aapStop: false, mother: null, spirit: false };
  }
  function freshDay() { return { votes: {}, voted: false, out: null, electionDone: false, raven: null, voteOnly: null, spirit: false, second: false }; }
  function newState(names, sample) {
    const players = names.map((n, i) => mkPlayer(i + 1, n));
    return normalize({
      v: 1, phase: "setup", round: 1, nextId: players.length + 1, players, sample: !!sample,
      deck: defaultDeck(players.length), opts: { callDead: true, mayor: true }
    });
  }
  // Vult ontbrekende velden aan, ook voor spellen die met een oudere versie zijn opgeslagen.
  function normalize(o) {
    const base = {
      witch: { heal: true, poison: true }, lastProtected: null, wildModel: null, night: freshNight(), day: freshDay(),
      pending: [], recent: [], log: [], dismissed: null, used: { toneel: [] }, wolfLost: false, rusty: null,
      powersLost: false, nextVoteOnly: null
    };
    for (const k in base) if (o[k] === undefined) o[k] = base[k];
    o.night = Object.assign(freshNight(), o.night);
    o.day = Object.assign(freshDay(), o.day);
    o.used = Object.assign({ toneel: [] }, o.used);
    o.deck = Object.assign(emptyDeck(), o.deck);
    o.players = o.players.map(p => Object.assign(mkPlayer(p.id, p.name), p));
    return o;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return normalize(o); }
    } catch (e) { /* geen opslag beschikbaar */ }
    return null;
  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* negeren */ } }

  let S = load() || newState(SAMPLE, true);
  let hist = [];
  let ui = { tab: "spel", picks: {}, pickKey: null, voteSel: null, reveal: null, confirmNew: false, openSets: null };

  function act(fn) {
    hist.push(JSON.stringify(S));
    if (hist.length > 80) hist.shift();
    fn();
    ui.picks = {};
    persist();
    render();
  }
  function undo() {
    if (!hist.length) return;
    S = JSON.parse(hist.pop());
    ui.picks = {}; ui.voteSel = null;
    persist();
    render();
  }

  /* ---------- hulpjes ---------- */

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const P = id => S.players.find(p => p.id === id);
  const nameOf = id => { const p = P(id); return p ? p.name : "?"; };
  const living = () => S.players.filter(p => p.alive);
  const holders = r => S.players.filter(p => p.role === r);
  const missing = r => Math.max(0, (S.deck[r] || 0) - holders(r).length);
  const unknownAlive = () => living().filter(p => !p.role);
  const isWolf = p => WOLF_ROLES.includes(p.role) || p.infected;
  const isSpecialVillager = r => r && ROLES[r].team === "dorp" && !PLAIN.includes(r);
  const roleLabel = p => p.role ? ROLES[p.role].name + (p.orig ? " (was " + ROLES[p.orig].name + ")" : "") + (p.infected ? ", besmet" : "") : "Onbekend";
  const list = names => names.length <= 1 ? names.join("") : names.slice(0, -1).join(", ") + " en " + names[names.length - 1];
  const picks = ns => ui.picks[ns] || [];
  const deckTotal = () => ORDER.reduce((a, r) => a + (S.deck[r] || 0), 0);

  function roleStatus(r) {
    const h = holders(r);
    const actor = S.phase === "night" && S.night.actor === r && holders("toneelspeler").some(p => p.alive);
    if (!(S.deck[r] > 0) && !h.length && !actor) return "none";
    if (S.powersLost && ROLES[r].team === "dorp") return "dead";
    if (actor || h.some(p => p.alive)) return "alive";
    if (missing(r) > 0 && unknownAlive().length) return "alive";
    return "dead";
  }
  function wolfStatus() {
    const st = WOLF_ROLES.map(roleStatus);
    if (st.includes("alive") || living().some(p => p.infected)) return "alive";
    if (st.every(x => x === "none")) return "none";
    return "dead";
  }
  function log(t) { S.log.push({ r: S.round, ph: S.phase, t }); }

  // Zoekt vanaf speler p de eerstvolgende levende speler in een richting rond de tafel.
  function neighbour(p, dir, test) {
    const n = S.players.length;
    let i = S.players.indexOf(p);
    for (let k = 1; k < n; k++) {
      const q = S.players[(i + dir * k + n * k) % n];
      if (q.alive && q !== p && (!test || test(q))) return q;
    }
    return null;
  }
  function bearGrowls() {
    const t = holders("titus").find(p => p.alive);
    if (!t || S.powersLost) return null;
    const a = neighbour(t, -1), b = neighbour(t, 1);
    return { titus: t, growl: t.infected || [a, b].some(q => q && isWolf(q)) };
  }

  /* ---------- sterven ---------- */

  function killPlayer(id, cause) {
    const p = P(id);
    if (!p || !p.alive) return;
    if (!p.role) { S.pending.push({ type: "reveal", id, cause }); return; }
    finishKill(p, cause);
  }
  function finishKill(p, cause) {
    const byWolves = cause === "weerwolven" || cause === "grotewolf";
    if (byWolves && p.role === "oudste" && !p.elderHit && !S.powersLost) {
      p.elderHit = true;
      log(p.name + " (Dorpsoudste) is aangevallen door de weerwolven en heeft het overleefd.");
      return;
    }
    if (byWolves && p.role === "poppenspeler" && !p.puppetUsed) {
      p.puppetUsed = true;
      log(p.name + " (Poppenspeler) is aangevallen door de weerwolven, maar de pop neemt de klap. Hij blijft in leven.");
      return;
    }
    if (cause === "stem" && p.role === "dorpsgek" && !p.revealed) {
      p.revealed = true; p.canVote = false;
      log(p.name + " is weggestemd maar blijkt de Dorpsgek. Blijft leven, mag niet meer stemmen.");
      S.recent.push({ id: p.id, cause: "dorpsgek" });
      return;
    }
    const powers = !S.powersLost;
    if (isWolf(p) || ["wildkind", "wolfshond"].includes(p.role) || ["wildkind", "wolfshond"].includes(p.orig)) S.wolfLost = true;
    p.alive = false;
    p.diedRound = S.round;
    S.recent.push({ id: p.id, cause });
    log(p.name + " (" + roleLabel(p) + ") is " + CAUSE[cause] + ".");

    if (cause === "stem" && powers) {
      const maid = S.players.find(q => q.alive && q.role === "dienstmeisje");
      if (maid && p.role !== "dienstmeisje") S.pending.push({ type: "dienst", id: p.id, maid: maid.id });
    }
    if (p.mayor) {
      p.mayor = false;
      if (living().length) S.pending.push({ type: "burgemeester", id: p.id });
    }
    if (p.role === "jager" && powers) S.pending.push({ type: "jager", id: p.id });
    if (p.role === "kolos" && byWolves && powers) S.pending.push({ type: "kolos", id: p.id });
    if (p.role === "zondebok" && cause === "stem") S.pending.push({ type: "zondebok", id: p.id });
    if (p.role === "ridder" && byWolves && powers) {
      const w = neighbour(p, -1, isWolf);
      if (w) { S.rusty = w.id; log(w.name + " is gewond door het roestige zwaard en sterft de volgende nacht."); }
    }
    if (p.role === "oudste" && ["stem", "jager", "gif"].includes(cause) && !S.powersLost) {
      S.powersLost = true;
      log("De Dorpsoudste is door het dorp gedood. Alle burgers verliezen hun bijzondere gaven.");
    }
    if (p.lover) {
      const other = S.players.find(q => q.lover && q.id !== p.id && q.alive);
      if (other) killPlayer(other.id, "liefde");
    }
    if (S.wildModel === p.id) {
      const kid = S.players.find(q => q.alive && q.role === "wildkind");
      if (kid) {
        kid.orig = "wildkind"; kid.role = "weerwolf";
        log(kid.name + " (Kleine wilde) verliest zijn voorbeeld en is nu een weerwolf. Hij wordt voortaan met de weerwolven wakker.");
      }
    }
  }

  /* ---------- winnaar ---------- */

  function winner() {
    if (S.phase !== "night" && S.phase !== "day") return null;
    if (S.pending.length) return null;
    const L = living();
    const angel = S.players.find(p => p.role === "engel" && !p.alive && p.diedRound === 1);
    if (angel) return { key: "engel", text: "De Engel (" + angel.name + ") is in de eerste ronde gestorven en wint!" };
    if (!L.length) return { key: "niemand", text: "Iedereen is dood. Niemand wint." };
    if (L.length === 2 && L.every(p => p.lover)) return { key: "geliefden", text: "Alleen de geliefden " + list(L.map(p => p.name)) + " zijn over. Zij winnen samen." };
    const piper = L.find(p => p.role === "fluitspeler");
    if (piper && L.every(p => p === piper || p.charmed)) return { key: "fluitspeler", text: "Iedereen is betoverd. De Fluitspeler (" + piper.name + ") wint." };
    const sect = L.find(p => p.role === "sektarier");
    if (sect && sect.group && L.every(p => p.group === sect.group)) return { key: "sektarier", text: "De andere groep is uitgeroeid. De Verschrikkelijke Sektariër (" + sect.name + ") wint." };
    const hidden = unknownAlive().length > 0 && WOLF_ROLES.some(r => missing(r) > 0);
    if (hidden) return null;
    const wolves = L.filter(isWolf);
    const white = L.find(p => p.role === "wittewolf");
    if (L.length === 1 && white) return { key: "wittewolf", text: "De Witte weerwolf (" + white.name + ") is als enige over en wint." };
    if (!wolves.length && !piper) return { key: "dorp", text: "Alle weerwolven zijn dood. Het dorp wint!" };
    if (wolves.length === L.length && !white) return { key: "wolven", text: "Er leven alleen nog weerwolven. De weerwolven winnen!" };
    return null;
  }

  /* ---------- de nacht ---------- */

  // Volgorde volgens de spelregels: eerst de opening (alleen nacht 1), dan de vaste nachtvolgorde.
  const STEPS = [
    { id: "sektarier", role: "sektarier", first: true, title: "De Verschrikkelijke Sektariër",
      script: "Het dorp is verdeeld in twee groepen. Ik noem wie er in welke groep zit." },
    { id: "dief", role: "dief", first: true, title: "De Dief",
      script: "Dief, word wakker. Je mag je kaart ruilen met een van de twee kaarten in het midden. Sluit je ogen weer." },
    { id: "cupido", role: "cupido", first: true, title: "Cupido",
      script: "Cupido, word wakker. Wijs twee spelers aan die verliefd op elkaar worden. Sluit je ogen weer." },
    { id: "geliefden", first: true, title: "De geliefden", cond: () => S.players.filter(p => p.lover).length === 2,
      script: "Ik tik de geliefden aan. Geliefden, word wakker en kijk elkaar aan. Sluit je ogen weer." },
    { id: "raadsheer", role: "raadsheer", first: true, title: "De Stotterende raadsheer",
      script: "Stotterende raadsheer, word wakker en laat mij je geheime teken zien. Sluit je ogen weer." },
    { id: "zussen", role: "zus", first: true, title: "De twee gezusters", cond: () => (S.deck.zus || 0) >= 2 || holders("zus").length >= 2,
      script: "Gezusters, word wakker en kijk elkaar aan. Sluit je ogen weer." },
    { id: "broers", role: "broer", first: true, title: "De drie gebroeders", cond: () => (S.deck.broer || 0) >= 2 || holders("broer").length >= 2,
      script: "Gebroeders, word wakker en kijk elkaar aan. Sluit je ogen weer." },
    { id: "wildkind", role: "wildkind", first: true, title: "De Kleine wilde",
      script: "Kleine wilde, word wakker. Wijs je grote voorbeeld aan. Sluit je ogen weer." },
    { id: "titus", role: "titus", first: true, title: "Titus en zijn dansende beer",
      script: "Titus, word wakker, zodat ik weet wie je bent. Sluit je ogen weer." },
    { id: "toneelspeler", role: "toneelspeler", title: "De Toneelspeler",
      script: "Toneelspeler, word wakker. Kies een van deze kaarten. Die rol speel je tot de volgende nacht. Sluit je ogen weer." },
    { id: "ziener", role: "ziener", title: "De Ziener",
      script: "Ziener, word wakker. Wijs iemand aan van wie je de kaart wilt zien. Sluit je ogen weer." },
    { id: "vos", role: "vos", title: "De Vos", spent: () => !!S.used.foxLost, spentText: "De Vos heeft zijn gave verloren.",
      script: "Vos, word wakker. Wijs de middelste aan van drie spelers naast elkaar, of schud nee. Sluit je ogen weer." },
    { id: "aap", role: "aap", title: "De Aap", spent: () => !!S.used.aap && !S.night.aap.length, spentText: "De Aap heeft zijn gave al gebruikt.",
      script: "Aap, word wakker. Wil je vannacht je gave gebruiken? Wijs dan iemand aan. Sluit je ogen weer." },
    { id: "beschermer", role: "beschermer", title: "De Genezer",
      script: "Genezer, word wakker. Wie wil je vannacht beschermen? Sluit je ogen weer." },
    { id: "weerwolven", role: "*wolf", title: "De Weerwolven",
      script: "Weerwolven, word wakker. Kies samen een slachtoffer. Sluit je ogen weer." },
    { id: "oerwolf", role: "oerwolf", title: "De Besmettelijke Oerwolf",
      spent: () => !!S.used.oerwolf || !S.night.wolfTarget, spentText: "De Oerwolf kan nu niet besmetten.",
      script: "Besmettelijke Oerwolf, wil je het slachtoffer besmetten in plaats van doden? Steek dan je poot op." },
    { id: "grotewolf", role: "grotewolf", title: "De Grote Boze Wolf",
      spent: () => S.wolfLost, spentText: "Er is al een weerwolf, Kleine wilde of Wolfshond gestorven. De Grote Boze Wolf mag niet meer extra doden.",
      script: "Grote Boze Wolf, word nog een keer wakker. Kies een tweede slachtoffer. Sluit je ogen weer." },
    { id: "wolvenmoeder", role: "wolvenmoeder", only: [1, 2], title: "De Machtige Wolvenmoeder",
      script: "Machtige Wolvenmoeder, word nog een keer wakker. Wijs een speler aan. Sluit je ogen weer." },
    { id: "wittewolf", role: "wittewolf", even: true, title: "De Witte weerwolf",
      script: "Witte weerwolf, word nog een keer wakker. Wil je een weerwolf doden? Sluit je ogen weer." },
    { id: "heks", role: "heks", title: "De Heks",
      script: "Heks, word wakker. Dit is het slachtoffer van vannacht. Wil je je levenselixer gebruiken? En je gif? Sluit je ogen weer." },
    { id: "zigeunerin", role: "zigeunerin", title: "De Zigeunerin",
      script: "Zigeunerin, word wakker. Wil je een Spiritisme-kaart gebruiken? Welke vraag kies je, en wie moet hem stellen? Sluit je ogen weer." },
    { id: "raaf", role: "raaf", title: "De Raaf",
      script: "Raaf, word wakker. Wie krijgt morgen twee extra stemmen tegen zich? Sluit je ogen weer." },
    { id: "pyromaan", role: "pyromaan", title: "De Pyromaan", spent: () => !!S.used.pyromaan, spentText: "De Pyromaan heeft zijn gave al gebruikt.",
      script: "Pyromaan, word wakker. Wil je vannacht een gebouw in brand steken? Sluit je ogen weer." },
    { id: "fluitspeler", role: "fluitspeler", title: "De Fluitspeler",
      script: "Fluitspeler, word wakker. Wijs twee spelers aan die je wilt betoveren. Sluit je ogen weer." },
    { id: "betoverden", title: "De betoverden", cond: () => roleStatus("fluitspeler") !== "none" && living().some(p => p.charmed),
      script: "Ik tik de betoverde spelers aan. Betoverden, word wakker en kijk wie er allemaal betoverd zijn. Sluit je ogen weer." },
    { id: "zussen-overleg", role: "zus", from: 2, title: "De twee gezusters", cond: () => holders("zus").filter(p => p.alive).length >= 2 || (S.deck.zus || 0) >= 2,
      script: "Gezusters, word wakker. Jullie mogen even in stilte overleggen. Sluit je ogen weer." },
    { id: "broers-overleg", role: "broer", from: 2, title: "De drie gebroeders", cond: () => holders("broer").filter(p => p.alive).length >= 2 || (S.deck.broer || 0) >= 2,
      script: "Gebroeders, word wakker. Jullie mogen even in stilte overleggen. Sluit je ogen weer." },
    { id: "dageraad", title: "De dageraad", script: "" }
  ];

  function stepList() {
    const out = [];
    for (const s of STEPS) {
      if (s.first && S.round !== 1) continue;
      if (s.from && S.round < s.from) continue;
      if (s.only && !s.only.includes(S.round)) continue;
      if (s.even && S.round % 2 !== 0) continue;
      if (s.cond && !s.cond()) continue;
      let dead = false, deadText = "";
      if (s.role) {
        const st = s.role === "*wolf" ? wolfStatus() : roleStatus(s.role);
        if (st === "none") continue;
        if (st === "dead") { dead = true; deadText = S.powersLost && s.role !== "*wolf" && ROLES[s.role].team === "dorp" && holders(s.role).some(p => p.alive) ? "De burgers hebben hun gaven verloren." : "Deze rol is dood."; }
      }
      if (!dead && s.spent && s.spent()) { dead = true; deadText = s.spentText; }
      if (dead && !S.opts.callDead) continue;
      out.push(Object.assign({}, s, { dead, deadText }));
    }
    return out;
  }
  function done(id) { if (!S.night.done.includes(id)) S.night.done.push(id); }

  function resolveNight() {
    const n = S.night;
    S.recent = [];
    S.lastProtected = n.protect;
    const shielded = id => id === n.protect && P(id).role !== "meisje";
    if (S.rusty) { const r = S.rusty; S.rusty = null; killPlayer(r, "roest"); }
    if (n.wolfTarget) {
      const t = P(n.wolfTarget);
      if (shielded(t.id)) log(t.name + " is aangevallen door de weerwolven maar was beschermd door de Genezer.");
      else if (n.healed) log(t.name + " is aangevallen door de weerwolven maar gered door de Heks.");
      else if (n.infect && t.alive) { t.infected = true; log(t.name + " is besmet door de Besmettelijke Oerwolf. Hoort nu bij de weerwolven en houdt zijn eigen gave."); }
      else killPlayer(t.id, "weerwolven");
    }
    if (n.bigKill) {
      if (shielded(n.bigKill)) log(nameOf(n.bigKill) + " is aangevallen door de Grote Boze Wolf maar was beschermd door de Genezer.");
      else killPlayer(n.bigKill, "grotewolf");
    }
    if (n.whiteKill) killPlayer(n.whiteKill, "wittewolf");
    if (n.poison) killPlayer(n.poison, "gif");
    S.phase = "day";
    S.day = freshDay();
    S.day.spirit = n.spirit;
    S.day.voteOnly = S.nextVoteOnly;
    S.nextVoteOnly = null;
    if (n.raven) {
      const p = P(n.raven);
      if (p && p.alive) { S.day.votes[p.id] = 2; S.day.raven = p.id; }
    }
    log("Het wordt dag " + S.round + ".");
  }

  function startNight() {
    S.round += 1;
    S.phase = "night";
    S.night = freshNight();
    S.recent = [];
    log("Nacht " + S.round + " begint.");
  }

  /* ---------- weergave ---------- */

  function render() {
    document.documentElement.dataset.phase = S.phase === "day" ? "day" : "night";
    const L = living();
    const title = { setup: "Voorbereiding", night: "Nacht " + S.round, day: "Dag " + S.round, end: "Einde van het spel" }[S.phase];
    document.getElementById("phase-title").textContent = title;
    document.getElementById("phase-sub").textContent = S.phase === "setup"
      ? S.players.length + " spelers aan tafel"
      : L.length + " van de " + S.players.length + " spelers leven nog";
    document.getElementById("undo-btn").disabled = !hist.length;
    document.querySelectorAll(".tabs button").forEach(b => {
      if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    let h = "";
    if (ui.tab === "spel") {
      if (S.phase === "setup") h = renderSetup();
      else if (S.phase === "night") h = renderNight();
      else if (S.phase === "day") h = renderDay();
      else h = renderEnd();
    } else if (ui.tab === "spelers") h = renderPlayers();
    else h = renderLog();
    document.getElementById("main").innerHTML = h;
    renderOverlay();
  }

  function picker(ns, max, cands) {
    const sel = picks(ns);
    if (!cands.length) return '<p class="note">Er is niemand om te kiezen.</p>';
    return '<div class="picker">' + cands.map(p =>
      '<button type="button" class="pick' + (sel.includes(p.id) ? " on" : "") + '" aria-pressed="' + sel.includes(p.id) + '" data-action="pick" data-ns="' + ns + '" data-max="' + max + '" data-id="' + p.id + '">' +
      esc(p.name) + "<small>" + esc(p.role ? ROLES[p.role].name : "rol onbekend") + (p.infected ? " · besmet" : "") + (p.lover ? " · geliefde" : "") + (p.charmed ? " · betoverd" : "") + "</small></button>"
    ).join("") + "</div>";
  }
  function teamTag(r) {
    const t = ROLES[r].team;
    return '<span class="tag ' + (t === "wolf" ? "wolf" : t === "solo" ? "solo" : "") + '">' + TEAM[t] + "</span>";
  }
  function playerTags(p) {
    const t = [];
    if (p.mayor) t.push('<span class="tag acc">Burgemeester</span>');
    if (p.lover) t.push('<span class="tag wolf">Geliefde</span>');
    if (p.infected) t.push('<span class="tag wolf">Besmet</span>');
    if (p.charmed) t.push('<span class="tag solo">Betoverd</span>');
    if (p.group) t.push('<span class="tag">Groep ' + p.group + "</span>");
    if (!p.canVote) t.push('<span class="tag">Geen stemrecht</span>');
    if (p.elderHit) t.push('<span class="tag">Aanval overleefd</span>');
    if (p.puppetUsed) t.push('<span class="tag">Pop gebruikt</span>');
    if (S.wildModel === p.id) t.push('<span class="tag">Voorbeeld Kleine wilde</span>');
    if (S.rusty === p.id) t.push('<span class="tag wolf">Sterft volgende nacht</span>');
    if (!p.alive) t.push('<span class="tag">Dood</span>');
    return t.length ? '<span class="tags">' + t.join("") + "</span>" : "";
  }
  function roleOptions(sel, withUnknown, exclude) {
    let h = withUnknown ? '<option value=""' + (sel ? "" : " selected") + ">? Nog onbekend</option>" : "";
    for (const set in SETS) {
      const rs = ORDER.filter(r => ROLES[r].set === set && !(exclude || []).includes(r));
      if (!rs.length) continue;
      h += '<optgroup label="' + SETS[set] + '">' + rs.map(r => '<option value="' + r + '"' + (sel === r ? " selected" : "") + ">" + ROLES[r].name + "</option>").join("") + "</optgroup>";
    }
    return h;
  }
  function roleSelect(id, label, opts) {
    return '<select id="' + id + '" aria-label="' + esc(label) + '">' + opts + "</select>";
  }

  /* --- voorbereiding --- */

  function setupProblems() {
    const errs = [];
    const n = S.players.length;
    const total = deckTotal();
    if (n < 4) errs.push("Je hebt minstens 4 spelers nodig.");
    if (S.players.some(p => !p.name.trim())) errs.push("Niet iedere speler heeft een naam.");
    if (total !== n) errs.push("Er zijn " + total + " kaarten voor " + n + " spelers. Dat moet gelijk zijn.");
    if (!WOLF_ROLES.some(r => S.deck[r] > 0)) errs.push("Er moet minstens één weerwolf meedoen.");
    for (const r of ORDER) {
      const c = holders(r).length;
      if (c > (S.deck[r] || 0)) errs.push(c + "× " + ROLES[r].name + " toegewezen, maar er " + ((S.deck[r] || 0) === 1 ? "is" : "zijn") + " maar " + (S.deck[r] || 0) + " in het spel.");
    }
    return errs;
  }

  function renderSetup() {
    const n = S.players.length;
    const total = deckTotal();
    const errs = setupProblems();
    const allKnown = S.players.every(p => p.role);
    if (!ui.openSets) {
      ui.openSets = {};
      for (const set in SETS) ui.openSets[set] = set === "basis" || ORDER.some(r => ROLES[r].set === set && S.deck[r] > 0);
    }
    let h = '<section class="block"><div><h2>Spelers</h2><p class="note">In de volgorde waarin ze aan tafel zitten. Die volgorde gebruikt de app voor de Vos, Titus en de Ridder.</p></div>';
    if (S.sample) h += '<p class="note warn">Dit zijn voorbeeldnamen. Pas ze aan of verwijder ze.</p>';
    h += '<ol class="rows">' + S.players.map((p, i) =>
      '<li class="setup-row"><span class="num">' + (i + 1) + "</span>" +
      '<input type="text" id="name-' + p.id + '" aria-label="Naam speler ' + (i + 1) + '" value="' + esc(p.name) + '" data-change="rename" data-id="' + p.id + '">' +
      '<select id="role-' + p.id + '" aria-label="Rol van ' + esc(p.name) + '" data-change="setrole" data-id="' + p.id + '">' + roleOptions(p.role, true) + "</select>" +
      '<button type="button" class="btn sm quiet" data-action="remove-player" data-id="' + p.id + '" aria-label="Verwijder ' + esc(p.name) + '">Verwijder</button></li>'
    ).join("") + "</ol>";
    h += '<div class="addrow"><input type="text" id="new-name" placeholder="Naam van een nieuwe speler" aria-label="Naam van een nieuwe speler"><button type="button" class="btn" data-action="add-player">Toevoegen</button></div></section>';

    h += '<section class="block"><div class="status"><h2>Kaarten in het spel</h2><span class="tag ' + (total === n ? "good" : "wolf") + '">' + total + " kaarten · " + n + " spelers</span></div>";
    h += '<p class="note">Speel je met de Dief? Leg twee extra kaarten apart. Die tel je hier niet mee. <em>Het Pact</em> bevat het basisspel, Volle Maan, Karakters en Het Dorp.</p>';
    for (const set in SETS) {
      const rs = ORDER.filter(r => ROLES[r].set === set);
      const cnt = rs.reduce((a, r) => a + (S.deck[r] || 0), 0);
      const open = ui.openSets[set];
      h += '<div class="setgroup"><button type="button" class="sethead" data-action="toggle-set" data-set="' + set + '" aria-expanded="' + open + '">' +
        '<span class="pname">' + SETS[set] + '</span><span class="chev">' + (cnt ? cnt + " in het spel · " : "") + rs.length + " rollen " + (open ? "▴" : "▾") + "</span></button>";
      if (open) {
        h += '<ul class="rows">' + rs.map(r =>
          '<li><div class="grow"><div class="status"><span class="pname">' + ROLES[r].name + "</span>" + teamTag(r) + '</div><p class="role-desc">' + ROLES[r].desc + "</p></div>" +
          '<div class="stepper"><button type="button" data-action="deck" data-role="' + r + '" data-delta="-1" aria-label="Eén ' + ROLES[r].name + ' minder">−</button><output>' + (S.deck[r] || 0) + '</output><button type="button" data-action="deck" data-role="' + r + '" data-delta="1" aria-label="Eén ' + ROLES[r].name + ' meer">+</button></div></li>'
        ).join("") + "</ul>";
      }
      h += "</div>";
    }
    h += "</section>";

    h += '<section class="block"><h2>Instellingen</h2>' +
      '<label class="check"><input type="checkbox" id="opt-callDead" data-change="opt" data-key="callDead"' + (S.opts.callDead ? " checked" : "") + '><span>Dode rollen toch afroepen<br><span class="note">Zo verraad je niet welke rollen al dood zijn of hun gave al gebruikt hebben.</span></span></label>' +
      '<label class="check"><input type="checkbox" id="opt-mayor" data-change="opt" data-key="mayor"' + (S.opts.mayor ? " checked" : "") + '><span>Met burgemeester<br><span class="note">Op de eerste dag wordt een burgemeester gekozen. Zijn stem telt dubbel bij een gelijke stand.</span></span></label></section>';

    h += '<section class="block"><h2>Rollen verdelen</h2>' +
      '<p class="note">Deel je echte kaarten uit? Laat de rollen dan op “onbekend” staan. In de eerste nacht vraagt de app wie er wakker wordt. Rollen die niet wakker worden vul je in zodra die speler sterft.</p>' +
      '<div class="btns"><button type="button" class="btn" data-action="deal"' + (total === n ? "" : " disabled") + ">Willekeurig delen</button>" +
      '<button type="button" class="btn" data-action="show-roles"' + (allKnown ? "" : " disabled") + ">Rollen laten zien</button>" +
      '<button type="button" class="btn quiet" data-action="clear-roles">Rollen wissen</button></div>' +
      (allKnown ? "" : '<p class="note">“Rollen laten zien” werkt als iedere speler een rol heeft. Daarmee geef je de telefoon rond.</p>') + "</section>";

    h += '<section class="block">' + errs.map(e => '<p class="note bad">' + esc(e) + "</p>").join("") +
      '<button type="button" class="btn primary full" data-action="start"' + (errs.length ? " disabled" : "") + ">Laat de eerste nacht vallen</button></section>";
    return h;
  }

  /* --- openstaande zaken --- */

  function pendingHtml() {
    const it = S.pending[0];
    if (!it) return "";
    const p = P(it.id);
    const btns = (main, mainLabel, skipLabel, ok) => '<div class="btns"><button type="button" class="btn primary" data-action="' + main + '"' + (ok ? "" : " disabled") + ">" + mainLabel + "</button>" +
      (skipLabel ? '<button type="button" class="btn quiet" data-action="pend-skip">' + skipLabel + "</button>" : "") + "</div>";
    let h = '<article class="card alert"><p class="eyebrow">Eerst afhandelen</p>';
    if (it.type === "reveal") {
      const opts = ORDER.filter(r => missing(r) > 0);
      h += "<h2>Welke kaart had " + esc(p.name) + "?</h2><p>" + esc(p.name) + " is " + CAUSE[it.cause] + ". Draai de kaart om en leg de rol vast.</p>" +
        roleSelect("pend-role", "Rol van " + p.name, opts.length ? opts.map(r => '<option value="' + r + '">' + ROLES[r].name + "</option>").join("") : roleOptions("", false)) +
        btns("pend-reveal", "Vastleggen", "", true);
    } else if (it.type === "jager") {
      h += "<h2>De Jager schiet</h2><p>" + esc(p.name) + " was de Jager en schiet direct iemand neer.</p>" + picker("shoot", 1, living()) +
        btns("pend-shoot", "Schieten", "Schiet niemand", picks("shoot").length);
    } else if (it.type === "kolos") {
      h += "<h2>De Kolos slaat terug</h2><p>" + esc(p.name) + " was de Kolos. Roep hem: hij kiest welke weerwolf hij meeneemt.</p>" + picker("shoot", 1, living()) +
        btns("pend-shoot", "Meenemen", "Niemand", picks("shoot").length);
    } else if (it.type === "burgemeester") {
      h += "<h2>Nieuwe burgemeester</h2><p>" + esc(p.name) + " was burgemeester en wijst een opvolger aan.</p>" + picker("succ", 1, living().filter(q => q.canVote)) +
        btns("pend-mayor", "Benoemen", "Geen opvolger", picks("succ").length);
    } else if (it.type === "zondebok") {
      h += "<h2>De Zondebok kiest</h2><p>" + esc(p.name) + " was de Zondebok en bepaalt wie er de volgende dag mag stemmen.</p>" + picker("voters", 99, living()) +
        btns("pend-voters", "Alleen zij mogen stemmen", "Iedereen mag stemmen", picks("voters").length);
    } else if (it.type === "dienst") {
      const maid = P(it.maid);
      h += "<h2>Het Toegewijde dienstmeisje</h2><p>Wil " + esc(maid.name) + " de rol van " + esc(p.name) + " (" + esc(roleLabel(p)) + ") overnemen? Dat moet vóór de kaart wordt omgedraaid.</p>" +
        btns("pend-maid", "Ja, neemt de rol over", "Nee", true);
    }
    return h + "</article>";
  }

  function winHtml() {
    const w = winner();
    if (!w || S.dismissed === w.key) return "";
    return '<article class="card win"><p class="eyebrow">Het spel is beslist</p><h2>' + esc(w.text) + "</h2>" +
      '<div class="btns"><button type="button" class="btn primary" data-action="win-end">Spel beëindigen</button>' +
      '<button type="button" class="btn quiet" data-action="win-continue">Toch doorspelen</button></div></article>';
  }

  /* --- nacht --- */

  function stepRoles(s) {
    if (s.role === "*wolf") return S.round === 1 ? WOLF_ROLES.concat("wolfshond") : WOLF_ROLES;
    return s.role ? [s.role] : [];
  }

  function whoLine(s) {
    if (!s.role) return "";
    const roles = stepRoles(s);
    const al = S.players.filter(p => p.alive && (roles.includes(p.role) || (s.role === "*wolf" && p.infected))).map(p => p.name);
    const actor = s.role !== "*wolf" && S.night.actor === s.role ? holders("toneelspeler").find(p => p.alive) : null;
    if (actor) al.push(actor.name + " (Toneelspeler)");
    const miss = roles.reduce((a, r) => a + missing(r), 0);
    let t = al.length ? "Wie: " + list(al) : "";
    if (miss > 0 && !s.dead) t += (t ? " · " : "") + miss + " nog niet vastgelegd";
    return t ? '<p class="muted small">' + esc(t) + "</p>" : "";
  }

  function identifyHtml(s) {
    if (!s.role || s.dead) return "";
    const r = stepRoles(s).find(x => missing(x) > 0);
    const cands = unknownAlive();
    if (!r || !cands.length) return "";
    const need = Math.min(missing(r), cands.length);
    const sel = picks("id");
    return '<div class="stack"><h3>Wie ' + (need > 1 ? "worden" : "wordt") + " er wakker als " + ROLES[r].name + (need > 1 ? " (" + need + ")" : "") + "?</h3>" +
      (r === "wolfshond" ? '<p class="note">Alleen als de Wolfshond kiest om weerwolf te worden, doet hij nu zijn ogen open.</p>' : "") +
      picker("id", need, cands) +
      '<div class="btns"><button type="button" class="btn" data-action="identify" data-role="' + r + '"' + (sel.length ? "" : " disabled") + ">Vastleggen als " + ROLES[r].name + "</button></div></div>";
  }

  function stepBody(s) {
    const n = S.night;
    const next = (label, cls) => '<button type="button" class="btn ' + (cls || "quiet") + '" data-action="step-next" data-step="' + s.id + '">' + (label || "Overslaan") + "</button>";
    const go = (action, label, ok, cls) => '<button type="button" class="btn ' + (cls || "primary") + '" data-action="' + action + '"' + (ok ? "" : " disabled") + ">" + label + "</button>";
    if (s.dead) {
      return '<p class="note warn">' + esc(s.deadText) + " Roep toch af en wacht een paar tellen, zodat niemand iets merkt.</p><div class=\"btns\">" + next("Volgende", "primary") + "</div>";
    }
    const L = living();
    const sel = picks("act");
    const self = r => holders(r).map(p => p.id);
    switch (s.id) {
      case "sektarier":
        return '<p class="note">Kies de spelers van groep A. De rest is groep B. Verdeel bijvoorbeeld op haarlengte of op wie er links en rechts van een denkbeeldige lijn zit.</p>' +
          picker("act", 99, L) + '<div class="btns">' + go("sect", "Groepen vastleggen", sel.length && sel.length < L.length) + "</div>";
      case "dief": {
        const thief = holders("dief").find(p => p.alive);
        if (!thief) return '<div class="btns">' + next() + "</div>";
        return '<label class="stack"><span class="small">Nieuwe rol van ' + esc(thief.name) + "</span>" + roleSelect("dief-role", "Nieuwe rol", roleOptions("", false, ["dief"])) + "</label>" +
          '<p class="note">Liggen er twee weerwolven in het midden, dan moet de Dief ruilen.</p>' +
          '<div class="btns">' + go("dief-swap", "Ruilen", true) + next("Niet ruilen") + "</div>";
      }
      case "cupido":
        return '<p class="note">Cupido mag zichzelf ook aanwijzen.</p>' + picker("act", 2, L) + '<div class="btns">' + go("cupido", "Maak ze geliefden", sel.length === 2) + next() + "</div>";
      case "geliefden":
        return "<p>Tik " + esc(list(S.players.filter(p => p.lover).map(p => p.name))) + " aan.</p><div class=\"btns\">" + next("Volgende", "primary") + "</div>";
      case "raadsheer":
        return '<p class="note">Onthoud het teken. Geeft hij het overdag, dan volgt er na de stemming een tweede stemming.</p><div class="btns">' + next("Volgende", "primary") + "</div>";
      case "zussen": case "broers": case "zussen-overleg": case "broers-overleg": {
        const z = holders(s.role).filter(p => p.alive).map(p => p.name);
        return (z.length ? "<p>" + esc(list(z)) + ".</p>" : "") + '<div class="btns">' + next("Volgende", "primary") + "</div>";
      }
      case "wildkind":
        return picker("act", 1, L.filter(p => !self("wildkind").includes(p.id))) + '<div class="btns">' + go("wild", "Voorbeeld vastleggen", sel.length) + next() + "</div>";
      case "titus":
        return '<p class="note">Elke ochtend laat de app zien of de beer gromt.</p><div class="btns">' + next("Volgende", "primary") + "</div>";
      case "toneelspeler": {
        if (n.actor) return "<p>De Toneelspeler speelt tot de volgende nacht: <strong>" + esc(ROLES[n.actor].name) + "</strong>. Roep hem ook bij die rol.</p><div class=\"btns\">" + next("Volgende", "primary") + "</div>";
        const opts = ORDER.filter(r => isSpecialVillager(r) && r !== "toneelspeler" && !S.used.toneel.includes(r));
        return '<p class="note">Laat drie kaarten met een gave zien. Al gekozen: ' + esc(S.used.toneel.length ? list(S.used.toneel.map(r => ROLES[r].name)) : "nog niets") + ".</p>" +
          '<div class="addrow">' + roleSelect("actor-role", "Gekozen rol", opts.map(r => '<option value="' + r + '">' + ROLES[r].name + "</option>").join("")) + go("actor", "Kiezen", opts.length, "") + "</div>" +
          '<div class="btns">' + next("Geen rol") + "</div>";
      }
      case "ziener": {
        if (n.seen) return revealHtml(P(n.seen), "seer-record") + '<div class="btns">' + next("Volgende", "primary") + "</div>";
        return picker("act", 1, L.filter(p => !self("ziener").includes(p.id))) + '<div class="btns">' + go("see", "Kaart bekijken", sel.length) + next() + "</div>";
      }
      case "vos": {
        if (n.fox) {
          const grp = n.fox.map(P);
          const hit = grp.some(isWolf);
          return "<p>Groepje: " + esc(list(grp.map(p => p.name))) + '.</p><p class="big-reveal">' + (hit ? "Duim omhoog" : "Duim omlaag") + "</p>" +
            (hit ? '<p class="note">Er zit minstens één weerwolf bij.</p>' : '<p class="note warn">Geen weerwolf. De Vos verliest zijn gave.</p>') +
            '<div class="btns">' + next("Volgende", "primary") + "</div>";
        }
        return '<p class="note">Wijs de middelste speler aan. De app neemt de levende buren links en rechts mee.</p>' +
          picker("act", 1, L) + '<div class="btns">' + go("fox", "Groepje bekijken", sel.length) + next("Vos past") + "</div>";
      }
      case "aap": {
        const seen = n.aap.map(P);
        let h = seen.map(p => "<p><strong>" + esc(p.name) + "</strong>: " + esc(p.role ? ROLES[p.role].name : "rol onbekend") + "</p>").join("");
        const last = seen[seen.length - 1];
        const canGo = !last || (last.role && ROLES[last.role].team === "dorp" && !last.infected);
        if (seen.length && !canGo) h += '<p class="note warn">Geen burger. De Aap moet stoppen.</p>';
        if (canGo) h += (seen.length ? '<p class="note">Een burger. De Aap mag doorgaan of stoppen.</p>' : '<p class="note">Dit kan maar één keer per spel.</p>') +
          picker("act", 1, L.filter(p => !self("aap").includes(p.id) && !n.aap.includes(p.id))) +
          '<div class="btns">' + go("aap", seen.length ? "Nog een kaart" : "Kaart bekijken", sel.length) + "</div>";
        return h + '<div class="btns">' + next(seen.length ? "Klaar" : "Vannacht niet", seen.length ? "primary" : "quiet") + "</div>";
      }
      case "beschermer": {
        const last = S.lastProtected && P(S.lastProtected);
        return (last ? '<p class="note">Vorige nacht beschermd: ' + esc(last.name) + ". Die mag nu niet.</p>" : "") +
          (roleStatus("meisje") === "alive" ? '<p class="note">Het Onschuldige meisje kan niet beschermd worden.</p>' : "") +
          picker("act", 1, L.filter(p => p.id !== S.lastProtected)) +
          '<div class="btns">' + go("protect", "Beschermen", sel.length) + next("Niemand beschermen") + "</div>";
      }
      case "weerwolven": {
        let h = "";
        if (S.round === 1) h += '<p class="note">Eerste nacht: laat de weerwolven elkaar eerst herkennen.</p>';
        const dog = S.players.find(p => p.alive && p.role === "wolfshond");
        if (S.round === 1 && dog) h += '<div class="stack"><h3>Wolfshond (' + esc(dog.name) + ")</h3><div class=\"btns\">" +
          '<button type="button" class="btn" data-action="dog" data-choice="weerwolf">Wordt weerwolf</button><button type="button" class="btn" data-action="dog" data-choice="burger">Blijft burger</button></div></div>';
        if (roleStatus("meisje") === "alive") h += '<p class="note">Het Onschuldige meisje mag nu gluren. Betrappen de weerwolven haar, kies haar dan als slachtoffer.</p>';
        if (S.players.some(p => p.alive && (p.orig === "wildkind" || p.orig === "wolfshond") && p.role === "weerwolf")) h += '<p class="note">Vergeet de Kleine wilde of Wolfshond niet: die is nu ook weerwolf.</p>';
        if (S.players.some(p => p.alive && p.infected)) h += '<p class="note">Besmette spelers worden ook met de weerwolven wakker.</p>';
        return h + picker("act", 1, L.filter(p => !isWolf(p))) +
          '<div class="btns">' + go("wolves", "Slachtoffer vastleggen", sel.length) + next("Geen slachtoffer") + "</div>";
      }
      case "oerwolf":
        return "<p>Slachtoffer: <strong>" + esc(nameOf(n.wolfTarget)) + "</strong>. Dit kan maar één keer per spel.</p>" +
          '<div class="btns">' + go("infect", "Besmetten", true, "danger") + next("Niet besmetten", "primary") + "</div>";
      case "grotewolf":
        return picker("act", 1, L.filter(p => !isWolf(p) && p.id !== n.wolfTarget)) +
          '<div class="btns">' + go("bigwolf", "Tweede slachtoffer vastleggen", sel.length) + next("Geen tweede slachtoffer") + "</div>";
      case "wolvenmoeder": {
        if (n.mother) {
          const m = n.mother;
          return "<p><strong>" + esc(nameOf(m.id)) + "</strong>: " + (m.lost ? "verliest de gave van " + esc(ROLES[m.lost].name) + " en is nu een gewone burger." : "geen burger met een gave. Er gebeurt niets.") + "</p>" +
            '<div class="btns">' + next("Volgende", "primary") + "</div>";
        }
        return '<p class="note">Alleen in de eerste twee nachten.</p>' + picker("act", 1, L.filter(p => p.role !== "wolvenmoeder")) +
          '<div class="btns">' + go("mother", "Aanwijzen", sel.length) + next("Niemand") + "</div>";
      }
      case "wittewolf":
        return '<p class="note">Alleen op even nachten.</p>' + picker("act", 1, L.filter(p => isWolf(p) && p.role !== "wittewolf")) +
          '<div class="btns">' + go("white", "Doden", sel.length) + next("Niemand doden") + "</div>";
      case "heks": {
        const t = n.wolfTarget && P(n.wolfTarget);
        let h = "<p>" + (t ? "Slachtoffer van de weerwolven: <strong>" + esc(t.name) + "</strong>" + (n.protect === t.id && t.role !== "meisje" ? ' <span class="tag good">beschermd</span>' : "") + (n.infect ? ' <span class="tag wolf">wordt besmet</span>' : "") : "De weerwolven hebben niemand gekozen.") + "</p>";
        h += '<div class="facts"><div class="fact"><h3>Levenselixer</h3><p>' + (n.healed ? "Gebruikt op " + esc(t.name) : S.witch.heal ? "Nog beschikbaar" : "Op") + '</p></div><div class="fact"><h3>Gif</h3><p>' + (n.poison ? "Gegeven aan " + esc(nameOf(n.poison)) : S.witch.poison ? "Nog beschikbaar" : "Op") + "</p></div></div>";
        if (S.witch.heal && t && !n.healed) h += '<div class="btns"><button type="button" class="btn" data-action="heal">Levenselixer op ' + esc(t.name) + "</button></div>";
        if (S.witch.poison && !n.poison) {
          h += '<div class="stack"><h3>Gif geven aan</h3>' + picker("act", 1, L.filter(p => !n.healed || p.id !== n.wolfTarget)) +
            '<div class="btns">' + go("poison", "Vergiftigen", sel.length, "danger") + "</div></div>";
        }
        return h + '<div class="btns">' + next("Klaar met de Heks", "primary") + "</div>";
      }
      case "zigeunerin":
        return '<p class="note">Lees de vragen van je vijf Spiritisme-kaarten voor. Morgen beantwoordt de eerste dode van vannacht de vraag met ja of nee.</p>' +
          '<div class="btns">' + go("spirit", "Ze gebruikt een kaart", true) + next("Niet vannacht") + "</div>";
      case "raaf":
        return picker("act", 1, L) + '<div class="btns">' + go("raven", "Markeren", sel.length) + next("Niemand") + "</div>";
      case "pyromaan":
        return '<p class="note">Dit kan maar één keer per spel. Kies de speler wiens gebouw afbrandt.</p>' + picker("act", 1, L) +
          '<div class="btns">' + go("fire", "In brand steken", sel.length, "danger") + next("Niet vannacht") + "</div>";
      case "fluitspeler": {
        const cands = L.filter(p => !p.charmed && p.role !== "fluitspeler");
        const need = Math.min(2, cands.length);
        return picker("act", 2, cands) + '<div class="btns">' + go("charm", "Betoveren", need && sel.length === need) + next() + "</div>";
      }
      case "betoverden":
        return "<p>Tik aan: " + esc(list(living().filter(p => p.charmed).map(p => p.name))) + ".</p><div class=\"btns\">" + next("Volgende", "primary") + "</div>";
      case "dageraad": {
        const items = [];
        if (S.rusty) items.push(nameOf(S.rusty) + " sterft aan het roestige zwaard");
        if (n.actor) items.push("Toneelspeler speelt " + ROLES[n.actor].name);
        if (n.protect) items.push("Beschermd: " + nameOf(n.protect));
        items.push("Weerwolven kozen: " + (n.wolfTarget ? nameOf(n.wolfTarget) : "niemand"));
        if (n.infect) items.push("Oerwolf besmet " + nameOf(n.wolfTarget));
        if (n.bigKill) items.push("Grote Boze Wolf kiest " + nameOf(n.bigKill));
        if (n.healed) items.push("Heks redt " + nameOf(n.wolfTarget));
        if (n.whiteKill) items.push("Witte weerwolf kiest " + nameOf(n.whiteKill));
        if (n.poison) items.push("Heks vergiftigt " + nameOf(n.poison));
        if (n.spirit) items.push("Zigeunerin gebruikt een Spiritisme-kaart");
        if (n.raven) items.push("Raaf markeert " + nameOf(n.raven));
        return '<div class="stack"><h3>Wat er vannacht gebeurde</h3><ul>' + items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul></div>" +
          '<button type="button" class="btn primary full" data-action="dawn">Laat het dorp ontwaken</button>';
      }
    }
    return '<div class="btns">' + next("Volgende", "primary") + "</div>";
  }

  function revealHtml(p, recordAction) {
    let h = '<div class="stack"><h3>' + esc(p.name) + ' is</h3><p class="big-reveal">' + esc(p.role ? ROLES[p.role].name : "Nog onbekend") + "</p>";
    if (p.infected) h += '<p class="note">Let op: deze speler is besmet en hoort bij de weerwolven.</p>';
    if (!p.role) h += '<p class="note">Kijk mee naar de kaart en leg de rol vast.</p><div class="addrow">' + roleSelect("seer-role", "Rol van " + p.name, roleOptions("", false)) + '<button type="button" class="btn" data-action="' + recordAction + '">Vastleggen</button></div>';
    return h + "</div>";
  }

  function renderNight() {
    const pend = pendingHtml();
    if (pend) return '<div class="stack" style="margin-top:16px">' + pend + "</div>";
    const steps = stepList();
    const cur = steps.find(s => !S.night.done.includes(s.id)) || steps[steps.length - 1];
    const key = S.round + ":" + cur.id;
    if (ui.pickKey !== key) { ui.pickKey = key; ui.picks = {}; }
    const idx = steps.indexOf(cur);
    let h = '<ol class="order" aria-label="Volgorde van deze nacht">' + steps.map((s, i) =>
      '<li class="' + (S.night.done.includes(s.id) ? "done" : s === cur ? "now" : "") + (s.dead ? " dead" : "") + '"' + (s === cur ? ' aria-current="step"' : "") + "><span><b>" + (i + 1) + "</b></span>" + esc(s.title.replace(/^(De|Het) /, "")) + "</li>"
    ).join("") + "</ol>";
    let script = cur.script;
    if (cur.id === "weerwolven" && S.round === 1) script = "Weerwolven, word wakker en kijk wie de andere weerwolven zijn. Kies samen een slachtoffer. Sluit je ogen weer.";
    if (cur.id === "dageraad") script = "Iedereen gaat slapen… De nacht is voorbij. De zon komt op en het dorp wordt wakker.";
    h += '<div class="stack" style="margin-top:16px">' + winHtml() +
      '<article class="card"><div><p class="eyebrow">Stap ' + (idx + 1) + " van " + steps.length + "</p><h2>" + esc(cur.title) + "</h2>" + whoLine(cur) + "</div>" +
      '<div class="script"><span class="label">Voorlezen</span><p>' + esc(script) + "</p></div>" +
      identifyHtml(cur) + stepBody(cur) + "</article></div>";
    if (S.round === 1 && idx === 0) h += '<p class="note" style="margin-top:12px">Begin met: “Het wordt nacht in Wakkerdam. Iedereen sluit de ogen.”</p>';
    return h;
  }

  /* --- dag --- */

  function renderDay() {
    const d = S.day;
    let h = '<div class="stack" style="margin-top:16px">';
    const deaths = S.recent;
    const dead = deaths.filter(x => x.cause !== "dorpsgek").length;
    h += '<article class="card"><p class="eyebrow">Sinds het ochtendgloren</p>';
    if (!deaths.length) h += '<h2>Niemand is gestorven</h2><div class="script"><span class="label">Voorlezen</span><p>Het dorp wordt wakker. Vannacht is er niemand gestorven.</p></div>';
    else {
      const nightDeaths = deaths.filter(x => ["weerwolven", "grotewolf", "wittewolf", "gif", "liefde", "roest", "kolos"].includes(x.cause));
      h += "<h2>" + (dead === 0 ? "Niemand is gestorven" : dead === 1 ? "Eén dode" : dead + " doden") + "</h2>";
      if (nightDeaths.length) h += '<div class="script"><span class="label">Voorlezen</span><p>Het dorp wordt wakker, behalve ' + esc(list(nightDeaths.map(x => nameOf(x.id)))) + ".</p></div>";
      h += '<ul class="rows">' + deaths.map(x => {
        const p = P(x.id);
        return '<li class="' + (p.alive ? "" : "dead") + '"><div class="grow"><span class="pname">' + esc(p.name) + '</span><p class="note">' + esc(roleLabel(p)) + " · " + esc(x.cause === "dorpsgek" ? "weggestemd, maar blijft leven als Dorpsgek" : CAUSE[x.cause]) + "</p></div></li>";
      }).join("") + "</ul>";
    }
    const bear = bearGrowls();
    if (bear) h += '<p class="note"><strong>Titus:</strong> ' + (bear.growl ? "de beer gromt! Grom hardop." : "de beer blijft stil.") + "</p>";
    if (d.spirit) {
      const first = deaths.find(x => x.cause !== "dorpsgek");
      h += '<p class="note"><strong>Zigeunerin:</strong> ' + (first ? esc(nameOf(first.id)) + " beantwoordt de Spiritisme-vraag met ja of nee." : "er is niemand gestorven, dus de vraag vervalt.") + "</p>";
    }
    h += "</article>";
    const pend = pendingHtml();
    if (pend) return h + pend + "</div>";
    h += winHtml();

    const L = living();
    if (S.opts.mayor && !d.voted && !d.electionDone && !S.players.some(p => p.mayor)) {
      h += '<article class="card"><p class="eyebrow">Verkiezing</p><h2>Kies een burgemeester</h2><p class="note">De stem van de burgemeester telt dubbel bij een gelijke stand.</p>' + picker("elect", 1, L.filter(p => p.canVote)) +
        '<div class="btns"><button type="button" class="btn primary" data-action="elect"' + (picks("elect").length ? "" : " disabled") + '>Benoemen</button><button type="button" class="btn quiet" data-action="elect-skip">Overslaan</button></div></article>';
    }

    if (!d.voted) {
      const max = Math.max(0, ...L.map(p => d.votes[p.id] || 0));
      const top = L.filter(p => max > 0 && (d.votes[p.id] || 0) === max);
      h += '<article class="card vote"><p class="eyebrow">' + (d.second ? "Tweede stemming" : "Stemming") + "</p><h2>Wie wordt er weggestemd?</h2>";
      if (d.raven && P(d.raven).alive && !d.second) h += '<p class="note">De Raaf heeft ' + esc(nameOf(d.raven)) + " gemarkeerd: al 2 stemmen tegen.</p>";
      if (d.voteOnly) h += '<p class="note warn">Op last van de Zondebok mogen vandaag alleen ' + esc(list(d.voteOnly.map(nameOf))) + " stemmen.</p>";
      h += '<p class="note">Tel de stemmen met + en −, of tik direct op een naam.</p>';
      h += '<ul class="rows">' + L.map(p => {
        const banned = d.voteOnly && !d.voteOnly.includes(p.id);
        return '<li class="' + (ui.voteSel === p.id ? "on" : "") + '"><button type="button" class="vname" data-action="vote-sel" data-id="' + p.id + '"><span class="pname">' + esc(p.name) + "</span>" + playerTags(p) +
          (banned ? '<span class="tags"><span class="tag">Mag vandaag niet stemmen</span></span>' : "") + "</button>" +
          '<div class="ctr stepper"><button type="button" data-action="vote" data-id="' + p.id + '" data-delta="-1" aria-label="Stem minder voor ' + esc(p.name) + '">−</button><output>' + (d.votes[p.id] || 0) + '</output><button type="button" data-action="vote" data-id="' + p.id + '" data-delta="1" aria-label="Stem meer voor ' + esc(p.name) + '">+</button></div></li>';
      }).join("") + "</ul>";
      const goat = L.find(p => p.role === "zondebok");
      if (top.length > 1) {
        h += '<p class="note warn">Gelijke stand tussen ' + esc(list(top.map(p => p.name))) + ".";
        if (goat) h += " De Zondebok sterft in plaats van hen.";
        else if (roleStatus("zondebok") === "alive") h += " Doet de Zondebok mee? Dan sterft hij.";
        else if (L.some(p => p.mayor)) h += " De stem van de burgemeester beslist.";
        h += "</p>";
      }
      const pick = ui.voteSel ? P(ui.voteSel) : top.length === 1 ? top[0] : null;
      h += '<div class="btns">' + (pick ? '<button type="button" class="btn danger" data-action="vote-out" data-id="' + pick.id + '">' + esc(pick.name) + " wegstemmen</button>" : "") +
        (top.length > 1 && goat ? '<button type="button" class="btn danger" data-action="vote-out" data-id="' + goat.id + '">Zondebok sterft</button>' : "") +
        '<button type="button" class="btn quiet" data-action="vote-none">Niemand wegstemmen</button></div></article>';
    } else {
      const judge = !S.powersLost && !S.used.raadsheer && L.find(p => p.role === "raadsheer");
      h += '<article class="card"><p class="eyebrow">' + (d.second ? "Tweede stemming" : "Stemming") + "</p><h2>" + (d.out ? esc(nameOf(d.out)) + " is weggestemd" : "Niemand is weggestemd") + "</h2>" +
        (judge ? '<button type="button" class="btn" data-action="second-vote">De raadsheer gaf het teken: tweede stemming</button>' : "") +
        '<button type="button" class="btn primary full" data-action="dusk">Laat de nacht vallen</button></article>';
    }
    return h + "</div>";
  }

  function renderEnd() {
    const w = winner();
    return '<div class="stack" style="margin-top:16px"><article class="card"><p class="eyebrow">Afgelopen na ' + S.round + " rondes</p><h2>" + esc(S.endText || (w ? w.text : "Het spel is beëindigd.")) + "</h2>" +
      '<p class="note">Bekijk het logboek voor het hele verloop.</p>' + newGameHtml() + "</article>" + playersTable(true) + "</div>";
  }

  function newGameHtml() {
    if (!ui.confirmNew) return '<div class="btns"><button type="button" class="btn" data-action="new-game">Nieuw spel</button></div>';
    return '<div class="stack"><p>Het huidige spel wordt gewist. Hoe wil je beginnen?</p><div class="btns">' +
      '<button type="button" class="btn primary" data-action="new-same">Zelfde spelers</button>' +
      '<button type="button" class="btn danger" data-action="new-fresh">Helemaal opnieuw</button>' +
      '<button type="button" class="btn quiet" data-action="new-cancel">Annuleren</button></div></div>';
  }

  /* --- spelers --- */

  function playersTable(readonly) {
    const ro = readonly || S.phase === "setup";
    return '<ol class="rows">' + S.players.map((p, i) =>
      '<li class="' + (p.alive ? "" : "dead") + '"><span class="num">' + (i + 1) + '</span><div class="grow"><span class="pname">' + esc(p.name) + "</span> " +
      (ro ? '<span class="muted small">' + esc(roleLabel(p)) + "</span>" : "") + "<div>" + playerTags(p) + "</div></div>" +
      (ro ? "" :
        '<select id="prole-' + p.id + '" aria-label="Rol van ' + esc(p.name) + '" data-change="setrole" data-id="' + p.id + '">' + roleOptions(p.role, true) + "</select>" +
        (p.alive
          ? '<button type="button" class="btn sm danger" data-action="p-kill" data-id="' + p.id + '">Dood</button>'
          : '<button type="button" class="btn sm" data-action="p-revive" data-id="' + p.id + '">Leeft weer</button>')) +
      "</li>"
    ).join("") + "</ol>";
  }

  function renderPlayers() {
    const L = living();
    const lovers = S.players.filter(p => p.lover);
    const charmed = L.filter(p => p.charmed);
    const once = (r, used, label) => { if (roleStatus(r) !== "none") facts.push([ROLES[r].name, used ? label + " al gebruikt" : label + " nog over"]); };
    const facts = [];
    if (S.phase !== "setup") {
      const wolves = L.filter(isWolf).length;
      facts.push(["In leven", L.length + " spelers · " + wolves + " weerwolf" + (wolves === 1 ? "" : "ven") + (unknownAlive().length ? " · " + unknownAlive().length + " onbekend" : "")]);
      if (S.powersLost) facts.push(["Dorpsoudste", "Door het dorp gedood: burgers hebben geen gaven meer"]);
      if (roleStatus("heks") !== "none") facts.push(["Heks", "Levenselixer " + (S.witch.heal ? "nog over" : "op") + " · gif " + (S.witch.poison ? "nog over" : "op")]);
      if (roleStatus("beschermer") !== "none") facts.push(["Genezer", S.lastProtected ? "Mag vannacht niet: " + nameOf(S.lastProtected) : "Nog niemand beschermd"]);
      if (lovers.length) facts.push(["Geliefden", list(lovers.map(p => p.name))]);
      if (S.wildModel) facts.push(["Voorbeeld Kleine wilde", nameOf(S.wildModel)]);
      if (charmed.length) facts.push(["Betoverd", list(charmed.map(p => p.name))]);
      const inf = L.filter(p => p.infected);
      if (inf.length) facts.push(["Besmet", list(inf.map(p => p.name))]);
      once("oerwolf", S.used.oerwolf, "Besmetting");
      once("aap", S.used.aap, "Gave");
      once("pyromaan", S.used.pyromaan, "Brand");
      once("raadsheer", S.used.raadsheer, "Tweede stemming");
      if (roleStatus("vos") !== "none") facts.push(["Vos", S.used.foxLost ? "Gave verloren" : "Heeft zijn gave nog"]);
      if (roleStatus("grotewolf") !== "none") facts.push(["Grote Boze Wolf", S.wolfLost ? "Mag niet meer extra doden" : "Mag nog extra doden"]);
      if (roleStatus("toneelspeler") !== "none") facts.push(["Toneelspeler", S.used.toneel.length ? "Al gespeeld: " + list(S.used.toneel.map(r => ROLES[r].name)) : "Nog niets gespeeld"]);
      if (S.rusty) facts.push(["Roestige zwaard", nameOf(S.rusty) + " sterft volgende nacht"]);
      const sect = S.players.find(p => p.role === "sektarier");
      if (sect && sect.group) facts.push(["Sektariër", sect.name + " zit in groep " + sect.group]);
      const bear = bearGrowls();
      if (bear) facts.push(["Titus", bear.growl ? "De beer zou nu grommen" : "De beer zou nu stil blijven"]);
      const mayor = L.find(p => p.mayor);
      if (mayor) facts.push(["Burgemeester", mayor.name]);
    }
    let h = '<section class="block"><h2>Wat je moet onthouden</h2>';
    h += facts.length ? '<div class="facts">' + facts.map(f => '<div class="fact"><h3>' + esc(f[0]) + "</h3><p>" + esc(f[1]) + "</p></div>").join("") + "</div>"
      : '<p class="note">Zodra het spel begint, zie je hier de drankjes van de Heks, de geliefden, de betoverden en welke eenmalige gaven al gebruikt zijn.</p>';
    h += "</section>";
    h += '<section class="block"><div><h2>Spelers</h2><p class="note">' + (S.phase === "setup" ? "Namen en rollen pas je aan onder Spel." : "Vergissing gemaakt? Pas hier een rol aan of zet iemand op dood.") + "</p></div>" + playersTable(S.phase === "end") + "</section>";
    h += '<section class="block"><h2>Spel</h2>' + newGameHtml() + "</section>";
    return h;
  }

  /* --- logboek --- */

  function renderLog() {
    if (!S.log.length) return '<section class="block"><h2>Logboek</h2><p class="note">Hier komt alles te staan wat er in het spel gebeurt, per ronde.</p></section>';
    const groups = [];
    for (const e of S.log) {
      const label = e.ph === "setup" ? "Voorbereiding" : (e.ph === "day" ? "Dag " : "Nacht ") + e.r;
      let g = groups[groups.length - 1];
      if (!g || g.label !== label) { g = { label, items: [] }; groups.push(g); }
      g.items.push(e.t);
    }
    return '<section class="block"><h2>Logboek</h2>' + groups.reverse().map(g =>
      '<div class="log-round"><h3>' + esc(g.label) + "</h3><ul>" + g.items.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul></div>"
    ).join("") + "</section>";
  }

  /* --- rolkaarten doorgeven --- */

  function renderOverlay() {
    const o = document.getElementById("overlay");
    if (!ui.reveal) { o.hidden = true; o.innerHTML = ""; return; }
    const p = S.players[ui.reveal.i];
    if (!p) { ui.reveal = null; o.hidden = true; return; }
    o.hidden = false;
    let h = '<div class="card"><p class="eyebrow">Speler ' + (ui.reveal.i + 1) + " van " + S.players.length + "</p>";
    if (!ui.reveal.shown) {
      h += "<h2>Geef de telefoon aan " + esc(p.name) + '</h2><p class="note">Alleen ' + esc(p.name) + " mag kijken.</p>" +
        '<button type="button" class="btn primary full" data-action="reveal-show">Toon mijn rol</button>';
    } else {
      h += "<p>" + esc(p.name) + ', jij bent</p><p class="big-reveal">' + esc(ROLES[p.role].name) + '</p><p class="note">' + esc(ROLES[p.role].desc) + "</p>" +
        '<button type="button" class="btn primary full" data-action="reveal-next">Verbergen en doorgeven</button>';
    }
    h += '<button type="button" class="btn quiet sm" data-action="reveal-close">Stoppen</button></div>';
    o.innerHTML = h;
  }

  /* ---------- acties ---------- */

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function addPlayer() {
    const inp = document.getElementById("new-name");
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    act(() => {
      S.sample = false;
      S.players.push(mkPlayer(S.nextId++, name));
    });
