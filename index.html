      '<p class="note">Wordt de Engel bij deze stemming of in de eerste nacht uitgeschakeld, dan wint hij.</p></article>';
    const deaths = S.recent;
    const nightDeaths = deaths.filter(x => ["weerwolven", "grotewolf", "wittewolf", "gif", "liefde", "roest", "kolos", "jager"].includes(x.cause));
    let h = '<article class="card"><p class="eyebrow">Ochtendgloren</p>';
    if (!nightDeaths.length) h += "<h2>Niemand is gestorven</h2>" + scriptBox("Het is ochtend. Iedereen in het dorp wordt wakker en opent zijn ogen. Vannacht is er niemand gestorven.");
    else {
      h += "<h2>" + (nightDeaths.length === 1 ? "Er is iemand gestorven" : nightDeaths.length + " spelers zijn gestorven") + "</h2>" +
        scriptBox("Het is ochtend. Iedereen wordt wakker en opent zijn ogen… behalve " + list(nightDeaths.map(x => nameOf(x.id))) + ".") +
        '<ul class="rows">' + nightDeaths.map(x => { const p = P(x.id); return '<li class="dead"><div class="grow"><span class="pname">' + esc(p.name) + '</span><p class="note">' + esc(roleLabel(p)) + " · " + esc(CAUSE[x.cause]) + "</p></div></li>"; }).join("") + "</ul>" +
        '<p class="note">Draai hun tegels om. Wie is uitgeschakeld, praat niet meer mee.</p>';
    }
    const bear = bearGrowls();
    if (bear) h += '<p class="chosen' + (bear.growl ? " bad" : "") + '"><strong>Titus:</strong> ' + (bear.growl ? "de beer gromt! Grom even hardop." : "de beer blijft stil.") + "</p>";
    if (d.spirit) {
      const first = nightDeaths[0];
      h += '<p class="note"><strong>Zigeunerin:</strong> ' + (first ? esc(nameOf(first.id)) + " beantwoordt de Spiritisme-vraag met ja of nee." : "er is niemand gestorven, dus de vraag vervalt.") + "</p>";
    }
    return h + "</article>";
  }

  function renderDay() {
    const d = S.day;
    const L = living();
    const stage = d.voted ? "uitslag" : d.stage;

    if (stage === "ochtend") {
      const h = morningCard();
      if (S.pending.length) { const ps = pendingScreen(); return { html: h + ps.html, pri: ps.pri, sec: ps.sec }; }
      return { html: h + '<p class="note">Hierna: ' + (electionNeeded() ? "burgemeester kiezen, dan " : "") + "discussie en stemming.</p>", pri: B("Verder →", "day-next") };
    }
    if (S.pending.length && stage !== "uitslag") return pendingScreen();

    if (stage === "verkiezing") {
      return {
        html: '<article class="card"><p class="eyebrow">Verkiezing</p><h2>Kies een burgemeester</h2>' + scriptBox("Het dorp kiest een burgemeester. Wie wordt het?") +
          '<p class="note">Zijn stem telt dubbel en beslist bij een gelijkspel. Hij mag niet weigeren.</p>' + picker("elect", 1, L.filter(p => p.canVote), chosenLine("{} wordt burgemeester.")) + "</article>",
        pri: B("Benoemen →", "elect", {}, picks("elect").length), sec: B("Overslaan", "elect-skip")
      };
    }

    if (stage === "stemming") {
      const cands = d.runoff ? L.filter(p => d.runoff.includes(p.id)) : L;
      const max = Math.max(0, ...cands.map(p => d.votes[p.id] || 0));
      const top = cands.filter(p => max > 0 && (d.votes[p.id] || 0) === max);
      const mayor = L.find(p => p.mayor);
      let h = '<article class="card vote"><p class="eyebrow">' + (d.runoff ? "Tweede stemronde" : d.second ? "Tweede stemming" : "Discussie en stemming") + "</p><h2>" + (d.runoff ? "Alleen tussen " + esc(list(cands.map(p => p.name))) : "Wie wordt er uitgeschakeld?") + "</h2>";
      if (!d.runoff) h += scriptBox("Bespreek wie jullie verdenken. Op mijn teken wijst iedereen tegelijk iemand aan. Drie, twee, één… wijs!");
      const rules = [];
      if (d.raven && P(d.raven).alive && !d.second && !d.runoff) rules.push("De Raaf heeft " + nameOf(d.raven) + " gemarkeerd: die heeft al 2 stemmen tegen.");
      if (d.voteOnly) rules.push("Op last van de Zondebok mogen vandaag alleen " + list(d.voteOnly.map(nameOf)) + " stemmen.");
      if (mayor) rules.push("De stem van burgemeester " + mayor.name + " telt als twee stemmen.");
      if (L.filter(p => p.lover).length === 2) rules.push("Geliefden mogen niet tegen elkaar stemmen.");
      h += rules.map(r => '<p class="note">' + esc(r) + "</p>").join("");
      h += '<p class="note">Tel de stemmen met + en −, of tik direct op een naam.</p><ul class="rows">' + cands.map(p => {
        const banned = d.voteOnly && !d.voteOnly.includes(p.id);
        return '<li class="' + (ui.voteSel === p.id ? "on" : "") + '"><button type="button" class="vname" data-action="vote-sel" data-id="' + p.id + '"><span class="pname">' + esc(p.name) + "</span>" + playerTags(p) +
          (banned ? '<span class="tags"><span class="tag">Mag vandaag niet stemmen</span></span>' : "") + "</button>" +
          '<div class="stepper"><button type="button" data-action="vote" data-id="' + p.id + '" data-delta="-1" aria-label="Stem minder voor ' + esc(p.name) + '">−</button><output>' + (d.votes[p.id] || 0) + '</output><button type="button" data-action="vote" data-id="' + p.id + '" data-delta="1" aria-label="Stem meer voor ' + esc(p.name) + '">+</button></div></li>';
      }).join("") + "</ul>";
      const goat = L.find(p => p.role === "zondebok");
      const goatMaybe = !goat && roleStatus("zondebok") === "alive";
      if (top.length > 1) {
        let t = "Gelijke stand tussen " + list(top.map(p => p.name)) + ". ";
        if (goat) t += "De Zondebok wordt uitgeschakeld in plaats van hen.";
        else if (goatMaybe) t += "Doet de Zondebok mee? Dan wordt hij uitgeschakeld in plaats van hen.";
        else if (mayor && !d.runoff) t += "Stemde burgemeester " + mayor.name + " op een van hen? Tik dan die naam aan. Anders volgt een tweede stemronde.";
        else if (!d.runoff) t += "Er volgt een tweede stemronde over alleen deze spelers.";
        else t += "Het blijft gelijk: er wordt niemand uitgeschakeld.";
        h += '<p class="chosen">' + esc(t) + '</p><div class="btns">' +
          (goat ? '<button type="button" class="btn danger" data-action="vote-out" data-id="' + goat.id + '">Zondebok uitschakelen</button>' : "") +
          (!d.runoff && !goat ? '<button type="button" class="btn" data-action="runoff">Tweede stemronde</button>' : "") + "</div>";
      }
      h += "</article>";
      const pick = ui.voteSel ? P(ui.voteSel) : top.length === 1 ? top[0] : null;
      return { html: h, pri: pick ? B(pick.name + " uitschakelen →", "vote-out", { id: pick.id }) : B("Kies wie eruit gaat", "vote-out", {}, false), sec: B("Niemand", "vote-none") };
    }

    // uitslag
    let h = resultCard();
    if (S.pending.length) { const ps = pendingScreen(); return { html: h + ps.html, pri: ps.pri, sec: ps.sec }; }
    return { html: h, pri: B("Laat de nacht vallen →", "dusk") };
  }

  function resultCard() {
    const d = S.day;
    const L = living();
    const out = d.out && P(d.out);
    let h = '<article class="card"><p class="eyebrow">Uitslag</p>';
    if (!out) h += "<h2>Niemand is uitgeschakeld</h2>";
    else if (out.alive) h += "<h2>" + esc(out.name) + " blijft leven</h2><p>" + esc(out.name) + " blijkt de Dorpsgek. Hij speelt verder, maar mag niet meer stemmen.</p>";
    else h += "<h2>" + esc(out.name) + " is uitgeschakeld</h2><p>Draai de tegel om: <strong>" + esc(roleLabel(out)) + "</strong>.</p>";
    const extra = S.recent.filter(x => x.id !== d.out && ["liefde", "jager"].includes(x.cause) && !P(x.id).alive);
    if (extra.length) h += '<p class="note">Ook uitgeschakeld: ' + esc(list(extra.map(x => nameOf(x.id) + " (" + CAUSE[x.cause] + ")"))) + ".</p>";
    const judge = !S.powersLost && !S.used.raadsheer && L.find(p => p.role === "raadsheer");
    if (judge && !S.pending.length && !winner()) h += '<button type="button" class="btn" data-action="second-vote">De raadsheer gaf het teken: tweede stemming</button>';
    return h + "</article>";
  }

  function renderEnd() {
    const w = winner();
    return {
      html: '<article class="card win"><p class="eyebrow">Afgelopen na ' + S.round + " rondes</p><h2>" + esc(S.endText || (w ? w.text : "Het spel is beëindigd.")) + "</h2></article>" +
        "<section class=\"stack\"><h3>Wie was wat</h3>" + playersTable(true) + "</section>",
      sec: B("Logboek", "menu", { tab: "log" }), pri: B("Nieuw spel →", "menu", { tab: "nieuw" })
    };
  }

  /* --- menu: overzicht, logboek, nieuw spel --- */

  function playersTable(readonly) {
    const ro = readonly || S.phase === "setup";
    return '<ol class="rows">' + S.players.map((p, i) =>
      '<li class="' + (p.alive ? "" : "dead") + '"><span class="num">' + (i + 1) + '</span><div class="grow"><span class="pname">' + esc(p.name) + "</span> " +
      (ro ? '<span class="muted small">' + esc(roleLabel(p)) + "</span>" : "") + "<div>" + playerTags(p) + "</div></div>" +
      (ro ? "" :
        '<select id="prole-' + p.id + '" aria-label="Rol van ' + esc(p.name) + '" data-change="setrole" data-id="' + p.id + '">' + roleOptions(p.role, true) + "</select>" +
        (p.alive
          ? '<button type="button" class="btn sm danger" data-action="p-kill" data-id="' + p.id + '">Dood</button>'
          : '<button type="button" class="btn sm" data-action="p-revive" data-id="' + p.id + '">Leeft weer</button>')) +
      "</li>"
    ).join("") + "</ol>";
  }

  function factsHtml() {
    const L = living();
    const facts = [];
    const once = (r, used, label) => { if (roleStatus(r) !== "none") facts.push([ROLES[r].name, used ? label + " al gebruikt" : label + " nog over"]); };
    if (S.phase === "setup") return '<p class="note">Zodra het spel begint, zie je hier de drankjes van de Heks, de geliefden, de betoverden en welke eenmalige gaven al gebruikt zijn.</p>';
    const wolves = L.filter(isWolf).length;
    facts.push(["In leven", L.length + " spelers · " + wolves + " weerwolf" + (wolves === 1 ? "" : "ven") + (unknownAlive().length ? " · " + unknownAlive().length + " onbekend" : "")]);
    if (S.powersLost) facts.push(["Dorpsoudste", "Door het dorp gedood: burgers hebben geen gaven meer"]);
    if (roleStatus("heks") !== "none") facts.push(["Heks", "Levenselixer " + (S.witch.heal ? "nog over" : "op") + " · gif " + (S.witch.poison ? "nog over" : "op")]);
    if (roleStatus("beschermer") !== "none") facts.push(["Genezer", S.lastProtected ? "Mag vannacht niet: " + nameOf(S.lastProtected) : "Nog niemand beschermd"]);
    const lovers = S.players.filter(p => p.lover);
    if (lovers.length) facts.push(["Geliefden", list(lovers.map(p => p.name))]);
    if (S.wildModel) facts.push(["Rolmodel Wolvenkind", nameOf(S.wildModel)]);
    const charmed = L.filter(p => p.charmed);
    if (charmed.length) facts.push(["Betoverd", list(charmed.map(p => p.name))]);
    const inf = L.filter(p => p.infected);
    if (inf.length) facts.push(["Besmet", list(inf.map(p => p.name))]);
    once("oerwolf", S.used.oerwolf, "Besmetting");
    once("aap", S.used.aap, "Gave");
    once("pyromaan", S.used.pyromaan, "Brand");
    once("raadsheer", S.used.raadsheer, "Tweede stemming");
    if (roleStatus("vos") !== "none") facts.push(["Vos", S.used.foxLost ? "Gave verloren" : "Heeft zijn gave nog"]);
    if (roleStatus("grotewolf") !== "none") facts.push(["Grote Boze Wolf", S.wolfLost ? "Geen tweede slachtoffer meer" : "Maakt nog een tweede slachtoffer"]);
    if (roleStatus("toneelspeler") !== "none") facts.push(["Toneelspeler", S.used.toneel.length ? "Al gespeeld: " + list(S.used.toneel.map(r => ROLES[r].name)) : "Nog niets gespeeld"]);
    if (S.rusty) facts.push(["Roestige zwaard", nameOf(S.rusty) + " sterft volgende nacht"]);
    const sect = S.players.find(p => p.role === "sektarier");
    if (sect && sect.group) facts.push(["Sektariër", sect.name + " zit in groep " + sect.group]);
    const mayor = L.find(p => p.mayor);
    if (mayor) facts.push(["Burgemeester", mayor.name]);
    return '<div class="facts">' + facts.map(f => '<div class="fact"><h3>' + esc(f[0]) + "</h3><p>" + esc(f[1]) + "</p></div>").join("") + "</div>";
  }

  function logHtml() {
    if (!S.log.length) return '<p class="note">Hier komt alles te staan wat er in het spel gebeurt, per ronde.</p>';
    const groups = [];
    for (const e of S.log) {
      const label = e.ph === "setup" ? "Voorbereiding" : e.ph === "day" && e.r === 0 ? "Eerste stemming" : (e.ph === "day" ? "Dag " : "Nacht ") + e.r;
      let g = groups[groups.length - 1];
      if (!g || g.label !== label) { g = { label, items: [] }; groups.push(g); }
      g.items.push(e.t);
    }
    return groups.reverse().map(g => '<div class="log-round"><h3>' + esc(g.label) + "</h3><ul>" + g.items.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul></div>").join("");
  }

  function renderMenu() {
    const tab = ui.menu;
    const tabBtn = (t, l) => '<button type="button" data-action="menu" data-tab="' + t + '" aria-pressed="' + (tab === t) + '">' + l + "</button>";
    let h = '<div class="seg" role="group" aria-label="Menu">' + tabBtn("overzicht", "Overzicht") + tabBtn("log", "Logboek") + tabBtn("nieuw", "Nieuw spel") + "</div>";
    if (tab === "overzicht") {
      h += '<section class="stack"><h2>Wat je moet onthouden</h2>' + factsHtml() + "</section>" +
        '<section class="stack"><h2>Spelers</h2><p class="note">' + (S.phase === "setup" || S.phase === "end" ? "Zo zitten ze aan tafel." : "Vergissing gemaakt? Pas hier een rol aan of zet iemand op dood.") + "</p>" + playersTable(S.phase === "end") + "</section>";
    } else if (tab === "log") {
      h += '<section class="stack"><h2>Logboek</h2>' + logHtml() + "</section>";
    } else {
      h += '<section class="card"><h2>Nieuw spel</h2><p>Het huidige spel wordt gewist. Met ↶ bovenin kun je dat nog terugdraaien.</p><div class="btns">' +
        '<button type="button" class="btn primary" data-action="new-same">Met dezelfde spelers</button>' +
        '<button type="button" class="btn danger" data-action="new-fresh">Helemaal opnieuw</button></div></section>';
    }
    return { html: h, pri: B("Terug naar het spel", "menu-close") };
  }

  /* --- rolkaarten doorgeven --- */

  function renderOverlay() {
    const o = document.getElementById("overlay");
    if (!ui.reveal) { o.hidden = true; o.innerHTML = ""; return; }
    const p = S.players[ui.reveal.i];
    if (!p) { ui.reveal = null; o.hidden = true; return; }
    o.hidden = false;
    let h = '<div class="card"><p class="eyebrow">Speler ' + (ui.reveal.i + 1) + " van " + S.players.length + "</p>";
    if (!ui.reveal.shown) {
      h += "<h2>Geef de telefoon aan " + esc(p.name) + '</h2><p class="note">Alleen ' + esc(p.name) + " mag kijken.</p>" +
        '<button type="button" class="btn primary full" data-action="reveal-show">Toon mijn rol</button>';
    } else {
      h += "<p>" + esc(p.name) + ', jij bent</p><p class="big-reveal">' + esc(ROLES[p.role].name) + '</p><p class="note">' + esc(ROLES[p.role].desc) + "</p>" +
        '<button type="button" class="btn primary full" data-action="reveal-next">Verbergen en doorgeven</button>';
    }
    h += '<button type="button" class="btn quiet sm" data-action="reveal-close">Stoppen</button></div>';
    o.innerHTML = h;
  }

  /* ---------- acties ---------- */

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function dealRoles() {
    syncBurgers();
    const cards = shuffle(ORDER.flatMap(r => Array(S.deck[r] || 0).fill(r)));
    S.players.forEach((p, i) => (p.role = cards[i] || "burger"));
  }
  // Na een wijziging in spelers of rollen klopt een eerdere verdeling niet meer.
  function rolesChanged() {
    syncBurgers();
    if (S.opts.dealMode === "app") { S.opts.dealMode = null; S.players.forEach(p => (p.role = null)); }
  }

  function addPlayer() {
    const inp = document.getElementById("new-name");
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    act(() => { S.sample = false; S.players.push(mkPlayer(S.nextId++, name)); rolesChanged(); });
    const again = document.getElementById("new-name");
    if (again) again.focus();
  }

  let wakeLock = null;
  function keepAwake() {
    try {
      if (navigator.wakeLock && !wakeLock) navigator.wakeLock.request("screen").then(l => { wakeLock = l; l.addEventListener("release", () => (wakeLock = null)); }).catch(() => {});
    } catch (e) { /* niet ondersteund */ }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (S.phase === "night" || S.phase === "day")) keepAwake(); });

  const pick1 = () => picks("act")[0];
  const toTop = () => window.scrollTo(0, 0);

  const H = {
    undo: () => undo(),
    menu: d => { ui.menu = d.tab || "overzicht"; render(); toTop(); },
    "menu-close": () => { ui.menu = null; render(); toTop(); },
    pick: d => {
      const ns = d.ns, id = +d.id, max = +d.max;
      let a = picks(ns);
      if (max === 1) a = a[0] === id ? [] : [id];
      else a = a.includes(id) ? a.filter(x => x !== id) : a.length < max ? a.concat(id) : a;
      ui.picks[ns] = a;
      render();
    },

    // voorbereiding
    goto: d => { S.setupStep = d.step; syncBurgers(); persist(); render(); toTop(); },
    "add-player": () => addPlayer(),
    "remove-player": d => act(() => { S.sample = false; S.players = S.players.filter(p => p.id !== +d.id); rolesChanged(); }),
    "move-up": d => act(() => { const i = S.players.findIndex(p => p.id === +d.id); if (i > 0) [S.players[i - 1], S.players[i]] = [S.players[i], S.players[i - 1]]; }),
    "set-box": d => act(() => {
      S.opts.box = d.box;
      if (d.box === "bestof") ORDER.forEach(r => (S.deck[r] = Math.min(S.deck[r] || 0, BESTOF_MAX[r] || 0)));
      if (!WOLF_ROLES.some(r => S.deck[r] > 0)) S.deck.weerwolf = 1;
      rolesChanged();
    }),
    "toggle-set": d => { ui.openSets[d.set] = !ui.openSets[d.set]; render(); },
    "toggle-role": d => act(() => { const r = d.role; S.deck[r] = S.deck[r] ? 0 : r === "zus" ? 2 : r === "broer" ? 3 : 1; rolesChanged(); }),
    deck: d => act(() => { S.deck[d.role] = Math.max(0, (S.deck[d.role] || 0) + +d.delta); rolesChanged(); }),
    "deal-mode": d => act(() => {
      S.opts.dealMode = d.mode;
      if (d.mode === "app") { dealRoles(); log("De app heeft de rollen willekeurig verdeeld."); }
      else S.players.forEach(p => (p.role = null));
    }),
    deal: () => act(() => { dealRoles(); log("De app heeft de rollen opnieuw verdeeld."); }),
    "show-roles": () => { ui.reveal = { i: 0, shown: false }; render(); },
    "reveal-show": () => { ui.reveal.shown = true; render(); },
    "reveal-next": () => { ui.reveal = { i: ui.reveal.i + 1, shown: false }; if (ui.reveal.i >= S.players.length) ui.reveal = null; render(); },
    "reveal-close": () => { ui.reveal = null; render(); },
    start: () => {
      if (setupProblems().length) return;
      act(() => {
        S.sample = false;
        syncBurgers();
        const inPlay = ORDER.filter(r => S.deck[r] > 0).map(r => S.deck[r] + "× " + ROLES[r].name);
        log("Het spel begint met " + S.players.length + " spelers: " + inPlay.join(", ") + ".");
        if (S.deck.engel > 0) {
          S.phase = "day"; S.round = 0; S.day = freshDay(); S.recent = [];
          log("De Engel speelt mee: het spel begint met een discussie en een stemming.");
        } else {
          S.phase = "night"; S.round = 1;
          log("Nacht 1 begint.");
        }
      });
      keepAwake(); toTop();
    },

    // nacht
    identify: d => {
      const ids = picks("id");
      act(() => { ids.forEach(id => (P(id).role = d.role)); log(list(ids.map(nameOf)) + (ids.length > 1 ? " zijn " : " is ") + ROLES[d.role].name + "."); });
    },
    "id-skip": d => { ui.idSkip[S.round + ":" + d.step] = true; render(); },
    "step-next": d => { act(() => done(d.step)); toTop(); },
    sect: () => act(() => {
      const a = picks("act");
      living().forEach(p => (p.group = a.includes(p.id) ? "A" : "B"));
      log("Groep A: " + list(a.map(nameOf)) + ". Groep B: " + list(living().filter(p => p.group === "B").map(p => p.name)) + ".");
      done("sektarier");
    }),
    "dief-swap": () => {
      const r = document.getElementById("dief-role").value;
      act(() => {
        const thief = holders("dief").find(p => p.alive);
        thief.orig = "dief"; thief.role = r;
        S.deck.dief = Math.max(0, S.deck.dief - 1); S.deck[r] = (S.deck[r] || 0) + 1;
        log(thief.name + " (Dief) ruilt en is nu " + ROLES[r].name + ".");
        done("dief");
      });
    },
    cupido: () => act(() => { const ids = picks("act"); ids.forEach(id => (P(id).lover = true)); log("Cupido maakt " + list(ids.map(nameOf)) + " verliefd."); done("cupido"); }),
    wild: () => act(() => { S.wildModel = pick1(); log("Het Wolvenkind kiest " + nameOf(S.wildModel) + " als rolmodel."); done("wildkind"); }),
    actor: () => { const r = document.getElementById("actor-role").value; act(() => { S.night.actor = r; S.used.toneel.push(r); log("De Toneelspeler speelt tot de volgende nacht " + ROLES[r].name + "."); }); },
    protect: () => act(() => { S.night.protect = pick1(); log("De Genezer beschermt " + nameOf(S.night.protect) + "."); done("beschermer"); }),
    see: () => act(() => { const p = P(pick1()); S.night.seen = p.id; log("De Ziener bekijkt " + p.name + ": " + (p.role ? ROLES[p.role].name : "rol nog onbekend") + (p.infected ? " (besmet)" : "") + "."); }),
    "seer-record": () => { const r = document.getElementById("seer-role").value; act(() => { const p = P(S.night.seen); p.role = r; log(p.name + " is " + ROLES[r].name + "."); }); },
    fox: () => act(() => {
      const mid = P(pick1());
      const grp = [neighbour(mid, -1), mid, neighbour(mid, 1)].filter((q, i, a) => q && a.indexOf(q) === i);
      S.night.fox = grp.map(p => p.id);
      const hit = grp.some(isWolf);
      if (!hit) S.used.foxLost = true;
      log("De Vos kiest " + list(grp.map(p => p.name)) + ": " + (hit ? "minstens één weerwolf." : "geen weerwolf. De Vos verliest zijn gave."));
    }),
    aap: () => act(() => { const p = P(pick1()); S.used.aap = true; S.night.aap.push(p.id); log("De Aap bekijkt " + p.name + ": " + (p.role ? ROLES[p.role].name : "rol nog onbekend") + "."); }),
    dog: d => act(() => {
      const dog = S.players.find(p => p.alive && p.role === "wolfshond");
      dog.orig = "wolfshond"; dog.role = d.choice;
      log(dog.name + " (Wolfshond) kiest ervoor " + (d.choice === "weerwolf" ? "weerwolf" : "burger") + " te worden.");
    }),
    wolves: () => act(() => { S.night.wolfTarget = pick1(); log("De weerwolven kiezen " + nameOf(S.night.wolfTarget) + "."); done("weerwolven"); }),
    infect: () => act(() => { S.night.infect = true; S.used.oerwolf = true; log("De Besmettelijke Oerwolf besmet " + nameOf(S.night.wolfTarget) + "."); done("oerwolf"); }),
    bigwolf: () => act(() => { S.night.bigKill = pick1(); log("De Grote Boze Wolf kiest " + nameOf(S.night.bigKill) + "."); done("grotewolf"); }),
    mother: () => act(() => {
      const p = P(pick1());
      const lost = isSpecialVillager(p.role) && !p.infected ? p.role : null;
      if (lost) { p.orig = p.role; p.role = "burger"; }
      S.night.mother = { id: p.id, lost };
      log("De Machtige Wolvenmoeder wijst " + p.name + " aan" + (lost ? ": verliest de gave van " + ROLES[lost].name + "." : ". Er gebeurt niets."));
    }),
    white: () => act(() => { S.night.whiteKill = pick1(); log("De Witte weerwolf kiest " + nameOf(S.night.whiteKill) + "."); done("wittewolf"); }),
    heal: d => act(() => { S.witch.heal = false; S.night.healId = +d.id; log("De Heks gebruikt haar levenselixer op " + nameOf(+d.id) + "."); }),
    poison: () => act(() => { S.witch.poison = false; S.night.poison = pick1(); log("De Heks geeft haar gif aan " + nameOf(S.night.poison) + "."); }),
    spirit: () => act(() => { S.night.spirit = true; log("De Zigeunerin gebruikt een Spiritisme-kaart."); done("zigeunerin"); }),
    raven: () => act(() => { S.night.raven = pick1(); log("De Raaf markeert " + nameOf(S.night.raven) + "."); done("raaf"); }),
    fire: () => act(() => { S.used.pyromaan = true; log("De Pyromaan steekt het gebouw van " + nameOf(pick1()) + " in brand."); done("pyromaan"); }),
    charm: () => act(() => { const ids = picks("act"); ids.forEach(id => (P(id).charmed = true)); log("De Fluitspeler betovert " + list(ids.map(nameOf)) + "."); done("fluitspeler"); }),
    dawn: () => { act(() => resolveNight()); toTop(); },

    // openstaande zaken
    "pend-reveal": () => {
      const r = document.getElementById("pend-role").value;
      act(() => { const it = S.pending.shift(); const p = P(it.id); p.role = r; finishKill(p, it.cause); });
    },
    "pend-shoot": () => act(() => { const it = S.pending.shift(); killPlayer(picks("shoot")[0], it.type === "kolos" ? "kolos" : "jager"); }),
    "pend-mayor": () => act(() => { S.pending.shift(); const p = P(picks("succ")[0]); p.mayor = true; log(p.name + " is de nieuwe burgemeester."); }),
    "pend-voters": () => act(() => { S.pending.shift(); S.nextVoteOnly = picks("voters"); log("De Zondebok bepaalt dat de volgende dag alleen " + list(S.nextVoteOnly.map(nameOf)) + " mogen stemmen."); }),
    "pend-maid": () => act(() => {
      const it = S.pending.shift();
      const p = P(it.id), maid = P(it.maid);
      maid.orig = "dienstmeisje"; maid.role = p.role;
      log(maid.name + " (Toegewijde dienstmeisje) neemt de rol " + ROLES[p.role].name + " over van " + p.name + ".");
    }),
    "pend-skip": () => act(() => {
      const it = S.pending.shift();
      if (it.type === "jager") log("De Jager schiet niemand neer.");
      if (it.type === "kolos") log("De Kolos neemt niemand mee.");
    }),

    // dag
    "day-next": () => { act(() => { S.day.stage = electionNeeded() ? "verkiezing" : "stemming"; }); toTop(); },
    elect: () => act(() => { const p = P(picks("elect")[0]); p.mayor = true; S.day.electionDone = true; S.day.stage = "stemming"; log(p.name + " is gekozen tot burgemeester."); }),
    "elect-skip": () => act(() => { S.day.electionDone = true; S.day.stage = "stemming"; }),
    vote: d => { const id = +d.id; S.day.votes[id] = Math.max(0, (S.day.votes[id] || 0) + +d.delta); persist(); render(); },
    "vote-sel": d => { ui.voteSel = ui.voteSel === +d.id ? null : +d.id; render(); },
    "vote-out": d => {
      act(() => { const id = +d.id; S.day.voted = true; S.day.out = id; killPlayer(id, "stem"); });
      ui.voteSel = null; render(); toTop();
    },
    "vote-none": () => { act(() => { S.day.voted = true; S.day.out = null; log("Het dorp schakelt niemand uit."); }); toTop(); },
    runoff: () => act(() => {
      const L = living();
      const max = Math.max(0, ...L.map(p => S.day.votes[p.id] || 0));
      S.day.runoff = L.filter(p => (S.day.votes[p.id] || 0) === max).map(p => p.id);
      S.day.votes = {};
      ui.voteSel = null;
      log("Gelijke stand. Tweede stemronde tussen " + list(S.day.runoff.map(nameOf)) + ".");
    }),
    "second-vote": () => act(() => {
      S.used.raadsheer = true;
      S.day.voted = false; S.day.out = null; S.day.votes = {}; S.day.second = true; S.day.runoff = null; S.day.stage = "stemming";
      log("De Stotterende raadsheer geeft het teken: er volgt een tweede stemming.");
    }),
    dusk: () => { act(() => startNight()); toTop(); },

    "win-end": () => act(() => { const w = winner(); S.endText = w ? w.text : ""; S.phase = "end"; log(w ? w.text : "Het spel is beëindigd."); }),
    "win-continue": () => act(() => { S.dismissed = winner().key; }),

    // menu
    "p-kill": d => act(() => killPlayer(+d.id, "spelleider")),
    "p-revive": d => act(() => { const p = P(+d.id); p.alive = true; p.diedRound = null; log(p.name + " is door de spelleider weer tot leven gebracht."); }),
    "new-same": () => act(() => {
      const names = S.players.map(p => p.name), deck = S.deck, opts = S.opts;
      S = newState(names, false); S.deck = deck; S.opts = Object.assign({}, opts, { dealMode: null }); S.setupStep = "rollen";
      ui.menu = null; ui.openSets = null; ui.idSkip = {};
    }),
    "new-fresh": () => act(() => { S = newState([], false); ui.menu = null; ui.openSets = null; ui.idSkip = {}; })
  };

  const CH = {
    rename: (el, d) => {
      // Geen nieuwe weergave: dan blijft een klik op een andere knop gewoon werken.
      const p = P(+d.id);
      if (!p) return;
      hist.push(JSON.stringify(S));
      p.name = el.value.trim() || p.name;
      el.value = p.name;
      S.sample = false;
      persist();
      document.getElementById("undo-btn").disabled = false;
    },
    setrole: (el, d) => act(() => {
      const p = P(+d.id);
      p.role = el.value || null;
      if (S.phase !== "setup") log("Spelleider zet de rol van " + p.name + " op " + (p.role ? ROLES[p.role].name : "onbekend") + ".");
    }),
    opt: (el, d) => act(() => { S.opts[d.key] = el.checked; })
  };

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-action]");
    if (!b || b.disabled) return;
    const fn = H[b.dataset.action];
    if (fn) fn(b.dataset, b);
  });
  document.addEventListener("change", e => {
    const el = e.target.closest("[data-change]");
    if (!el) return;
    const fn = CH[el.dataset.change];
    if (fn) fn(el, el.dataset);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.id === "new-name") { e.preventDefault(); addPlayer(); }
  });

  render();
  if (S.phase === "night" || S.phase === "day") keepAwake();
})();
</script>
</body>
</html>
