<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wakkerdam Spelleider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: één scherm per stap, als een kaart op tafel. Bovenin waar je bent, onderin altijd
   één duidelijke knop om verder te gaan. Nacht is inktblauw met maanlicht, dag is bleek hooi. */
:root {
  --bg: #0e1322;
  --surface: #161d30;
  --raised: #1f2842;
  --line: #2c3654;
  --fg: #e9e4d6;
  --muted: #929bb1;
  --accent: #e2bb5f;
  --accent-ink: #1b1505;
  --wolf: #e0676b;
  --good: #79c497;
  --warn: #e9a653;
  --f-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
:root[data-phase="day"] {
  --bg: #e6e9e0;
  --surface: #f5f6f1;
  --raised: #ffffff;
  --line: #cbd1c3;
  --fg: #1b211e;
  --muted: #5a645d;
  --accent: #94600f;
  --accent-ink: #fffaf0;
  --wolf: #b2353b;
  --good: #2c7a4d;
  --warn: #9d5e0c;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  transition: background-color .6s ease;
}
@media (prefers-reduced-motion: reduce) { body, .top { transition: none; } }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(124px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* Kop */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); transition: background-color .6s ease; }
.top-in { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.emblem { flex: none; width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 10px -5px 0 0 var(--accent); transform: rotate(-20deg); }
.emblem.big { width: 72px; height: 72px; box-shadow: inset 22px -10px 0 0 var(--accent); }
:root[data-phase="day"] .emblem { background: var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); transform: none; }
.top-title { min-width: 0; flex: 1; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; }
.top p { margin: 0; color: var(--muted); font-size: .88rem; }
.iconbtn { min-height: 40px; min-width: 40px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; }
.iconbtn:disabled { opacity: .35; cursor: not-allowed; }

/* Vaste balk onderin */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar .btn.primary { flex: 1; min-height: 56px; font-size: 1.08rem; }
.bar .btn.quiet { flex: none; min-height: 56px; }

/* Typografie */
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; line-height: 1.12; margin: 0; text-wrap: balance; }
h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; font-weight: 700; }
.display { font-size: 2.3rem; }
.eyebrow { margin: 0 0 4px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.lead { font-size: 1.1rem; }
p { margin: 0; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.card.alert { border-color: var(--accent); }
.card.win { border-color: var(--good); }

/* Knoppen */
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { min-height: 46px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { border-color: var(--wolf); color: var(--wolf); background: transparent; }
.btn.quiet { background: transparent; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .9rem; }

/* Voorleestekst */
.script { background: var(--raised); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.script .label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.script p { font-style: italic; font-size: 1.15rem; }

/* Volgorde van de nacht */
.order { position: relative; list-style: none; margin: 0; padding: 0 0 4px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; }
.order li { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; color: var(--muted); white-space: nowrap; }
.order li span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--raised); font-variant-numeric: tabular-nums; font-size: .75rem; }
.order li.done { opacity: .55; }
.order li.done span { background: transparent; }
.order li.done span::before { content: "✓"; }
.order li.done span b { display: none; }
.order li.now { border-color: var(--accent); color: var(--fg); }
.order li.now span { background: var(--accent); color: var(--accent-ink); }
.order li.dead { text-decoration: line-through; }
.plainlist { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
.plainlist .dead { color: var(--muted); }

/* Spelerskeuze */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.pick { min-height: 56px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.pick small { color: var(--muted); font-size: .75rem; font-weight: 400; }
.pick.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pick.on small { color: inherit; opacity: .8; }
.chosen { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 500; }
.chosen.bad { border-color: var(--wolf); background: color-mix(in srgb, var(--wolf) 12%, transparent); }

/* Labels */
.tags { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: .72rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; letter-spacing: .02em; font-weight: 500; }
.tag.wolf { border-color: var(--wolf); color: var(--wolf); }
.tag.solo { border-color: var(--warn); color: var(--warn); }
.tag.acc { border-color: var(--accent); color: var(--accent); }
.tag.good { border-color: var(--good); color: var(--good); }

.note { font-size: .95rem; color: var(--muted); }
.note.warn { color: var(--warn); }
.note.bad { color: var(--wolf); }
.big-reveal { font-family: var(--f-display); font-size: 2.1rem; line-height: 1.1; }

/* Lijsten */
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.rows > li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rows > li:first-child { border-top: 0; }
.rows .grow { flex: 1; min-width: 0; }
.rows .num { width: 1.6em; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.rows li.dead .pname { text-decoration: line-through; color: var(--muted); }
.pname { font-weight: 700; overflow-wrap: anywhere; }
input[type="text"], select { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); padding: 6px 12px; max-width: 100%; }
input[type="text"] { width: 100%; }
.setup-row input[type="text"] { flex: 1 1 120px; width: auto; min-width: 0; }
.addrow { display: flex; gap: 8px; }
.addrow input, .addrow select { flex: 1; min-width: 0; }

.stepper { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-size: 1.25rem; line-height: 1; }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper output { min-width: 1.8em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.2rem; }
.role-desc { font-size: .88rem; color: var(--muted); }

.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

/* Rolkaarten en keuzes */
.rolelist { display: flex; flex-direction: column; gap: 8px; }
.rolecard, .choice { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.rc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rc-name { font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rc-check { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.rolecard[aria-pressed="true"], .choice[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.rolecard[aria-pressed="true"] .rc-check, .choice[aria-pressed="true"] .rc-check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.choice[aria-pressed="true"] .rc-check::before { content: "✓"; }
.choice .rc-check { border-radius: 50%; }
.group-title { font-family: var(--f-display); font-size: 1.3rem; margin: 6px 0 0; font-weight: 400; }
.setgroup { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
.sethead { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px; background: var(--surface); border: 0; cursor: pointer; text-align: left; }
.sethead .chev { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.setgroup .rolelist { padding: 10px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 10px 8px; border-radius: 9px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.summary span { padding: 6px 12px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); font-weight: 500; font-variant-numeric: tabular-nums; }

.hero { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding-block: 24px 8px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; width: 100%; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.steps li::before { content: counter(s); flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); min-width: 0; }
.fact h3 { margin-bottom: 2px; }
.fact p { overflow-wrap: anywhere; }

.log-round { display: flex; flex-direction: column; gap: 6px; }
.log-round ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }

.vote .vname { background: none; border: 0; padding: 4px 0; text-align: left; cursor: pointer; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.vote li.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }

/* Rolkaart doorgeven */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.overlay .card { width: 100%; max-width: 420px; text-align: center; align-items: center; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="emblem" aria-hidden="true"></div>
    <div class="top-title">
      <h1 id="phase-title">Wakkerdam</h1>
      <p id="phase-sub"></p>
    </div>
    <button type="button" class="iconbtn" id="undo-btn" data-action="undo" aria-label="Ongedaan maken" title="Ongedaan maken">↶</button>
    <button type="button" class="iconbtn" id="menu-btn" data-action="menu" data-tab="overzicht">Menu</button>
  </div>
</header>
<main class="wrap" id="main"></main>
<nav class="bar" aria-label="Volgende stap"><div class="bar-in" id="bar"></div></nav>
<div id="overlay" class="overlay" hidden></div>
<noscript><p style="padding:16px">Deze app heeft JavaScript nodig.</p></noscript>

<script>
(function () {
  "use strict";

  const KEY = "wakkerdam-spelleider-v1";

  const SETS = {
    basis: "Basisspel",
    vollemaan: "Volle Maan",
    karakters: "Karakters",
    dorp: "Het Dorp",
    jubileum: "Jubileumeditie (25 jaar)"
  };

  const ROLES = {
    // Basisspel
    weerwolf:     { set: "basis", name: "Weerwolf", team: "wolf", desc: "Kiest elke nacht samen met de andere weerwolven een slachtoffer." },
    burger:       { set: "basis", name: "Gewone burger", team: "dorp", desc: "Geen speciale gave. Stemt overdag mee." },
    ziener:       { set: "basis", name: "Ziener", team: "dorp", desc: "Bekijkt elke nacht de kaart van één speler." },
    meisje:       { set: "basis", name: "Onschuldig meisje", team: "dorp", desc: "Mag gluren als de weerwolven wakker zijn. Wordt ze betrapt, dan sterft zij in plaats van het slachtoffer." },
    jager:        { set: "basis", name: "Jager", team: "dorp", desc: "Schiet bij zijn dood direct iemand neer." },
    cupido:       { set: "basis", name: "Cupido", team: "dorp", desc: "Maakt in de eerste nacht twee spelers verliefd. Sterft de een, dan sterft de ander ook." },
    heks:         { set: "basis", name: "Heks", team: "dorp", desc: "Heeft één levenselixer en één gif voor het hele spel. Mag ze in dezelfde nacht gebruiken." },
    dief:         { set: "basis", name: "Dief", team: "dorp", desc: "Mag in de eerste nacht zijn kaart ruilen met een van de twee overgebleven kaarten." },
    // Volle Maan
    dorpsgek:     { set: "vollemaan", name: "Dorpsgek", team: "dorp", desc: "Wordt hij weggestemd, dan blijft hij leven maar verliest hij zijn stemrecht." },
    oudste:       { set: "vollemaan", name: "Dorpsoudste", team: "dorp", desc: "Overleeft de eerste aanval van de weerwolven. Doodt het dorp hem, dan verliezen alle burgers hun gaven." },
    zondebok:     { set: "vollemaan", name: "Zondebok", team: "dorp", desc: "Sterft bij een gelijke stand en bepaalt dan wie er de volgende dag mag stemmen." },
    beschermer:   { set: "vollemaan", name: "Genezer", team: "dorp", desc: "Beschermt elke nacht één speler tegen de weerwolven, nooit twee nachten achter elkaar dezelfde." },
    fluitspeler:  { set: "vollemaan", name: "Fluitspeler", team: "solo", desc: "Betovert elke nacht twee spelers. Wint als iedereen die nog leeft betoverd is." },
    // Karakters
    dorpeling:    { set: "karakters", name: "Dorpse dorpeling", team: "dorp", desc: "Een gewone burger, en iedereen weet het: zijn kaart is aan beide kanten gelijk." },
    zus:          { set: "karakters", name: "Gezuster", team: "dorp", desc: "De twee gezusters kennen elkaar en mogen af en toe 's nachts in stilte overleggen." },
    broer:        { set: "karakters", name: "Gebroeder", team: "dorp", desc: "De drie gebroeders kennen elkaar en mogen af en toe 's nachts in stilte overleggen." },
    engel:        { set: "karakters", name: "Engel", team: "solo", desc: "Het spel begint met een stemming. Sterft hij bij die stemming of in de eerste nacht, dan wint hij. Daarna is hij een gewone burger." },
    raadsheer:    { set: "karakters", name: "Stotterende raadsheer", team: "dorp", desc: "Mag één keer per spel met een geheim teken een tweede stemming afdwingen." },
    ridder:       { set: "karakters", name: "Ridder met het roestige zwaard", team: "dorp", desc: "Doden de weerwolven hem, dan sterft de eerste weerwolf links van hem de volgende nacht." },
    toneelspeler: { set: "karakters", name: "Toneelspeler", team: "dorp", desc: "Kiest elke nacht een van de klaargelegde rollen en speelt die tot de volgende nacht. Elke rol maar één keer." },
    dienstmeisje: { set: "karakters", name: "Toegewijde dienstmeisje", team: "dorp", desc: "Mag de rol overnemen van iemand die net is weggestemd, voordat zijn kaart wordt omgedraaid." },
    vos:          { set: "karakters", name: "Vos", team: "dorp", desc: "Wijst elke nacht het midden van een groepje van drie aan. Zit er geen weerwolf bij, dan verliest hij zijn gave." },
    titus:        { set: "karakters", name: "Titus en zijn dansende beer", team: "dorp", desc: "De beer gromt 's ochtends als er een weerwolf direct naast Titus zit." },
    sektarier:    { set: "karakters", name: "Verschrikkelijke Sektariër", team: "solo", desc: "Het dorp wordt in twee groepen verdeeld. Hij wint als de andere groep helemaal dood is." },
    wildkind:     { set: "karakters", name: "Wolvenkind", team: "dorp", desc: "Kiest in de eerste nacht een rolmodel. Wordt dat rolmodel uitgeschakeld, dan wordt hij een weerwolf. In de uitbreiding Karakters heet hij de Kleine wilde." },
    wolfshond:    { set: "karakters", name: "Wolfshond", team: "dorp", desc: "Kiest in de eerste nacht of hij weerwolf of burger wordt." },
    wittewolf:    { set: "karakters", name: "Witte weerwolf", team: "solo", desc: "Eet mee met de weerwolven, maar mag elke tweede nacht een weerwolf doden. Wint alleen als hij als enige overblijft." },
    grotewolf:    { set: "karakters", name: "Grote Boze Wolf", team: "wolf", desc: "Verslindt elke nacht een tweede slachtoffer, zolang er geen weerwolf, Wolvenkind of Wolfshond is uitgeschakeld." },
    oerwolf:      { set: "karakters", name: "Besmettelijke Oerwolf", team: "wolf", desc: "Mag één keer per spel het slachtoffer besmetten. Die wordt dan weerwolf en houdt zijn eigen gave." },
    zigeunerin:   { set: "karakters", name: "Zigeunerin", team: "dorp", desc: "Mag 's nachts een Spiritisme-kaart laten gebruiken. De eerste dode van die nacht beantwoordt de vraag met ja of nee." },
    // Het Dorp
    raaf:         { set: "dorp", name: "Raaf", team: "dorp", desc: "Geeft elke nacht één speler twee extra stemmen tegen zich." },
    pyromaan:     { set: "dorp", name: "Pyromaan", team: "dorp", desc: "Mag één keer per spel 's nachts een gebouw in brand steken. Dat gebouw verliest zijn eigenschap." },
    // Jubileumeditie
    aap:          { set: "jubileum", name: "Aap", team: "dorp", desc: "Mag één keer per spel 's nachts kaarten bekijken. Zolang hij burgers ziet, mag hij doorgaan." },
    poppenspeler: { set: "jubileum", name: "Poppenspeler", team: "dorp", desc: "Kiezen de weerwolven hem, dan neemt zijn pop de klap. Dat werkt één keer." },
    kolos:        { set: "jubileum", name: "Kolos", team: "dorp", desc: "Doden de weerwolven hem, dan mag hij aan het eind van de nacht een weerwolf doden." },
    wolvenmoeder: { set: "jubileum", name: "Machtige Wolvenmoeder", team: "wolf", desc: "Wordt de eerste twee nachten nog eens alleen wakker. Wijst ze een burger met een gave aan, dan wordt die een gewone burger." }
  };
  const ORDER = Object.keys(ROLES);
  // Inhoud van de doos "Het Beste van De Weerwolven van Wakkerdam" (2023): 28 tegels, ingedeeld zoals in de spelregels.
  const BESTOF = {
    "De Weerwolven": { weerwolf: 3, oerwolf: 1, grotewolf: 1 },
    "De Burgers": { burger: 7, cupido: 1, ziener: 1, zus: 2, meisje: 1, vos: 1, ridder: 1, oudste: 1, heks: 1, titus: 1, jager: 1 },
    "De Dubieuzen": { wildkind: 1, wolfshond: 1 },
    "De Eenlingen": { wittewolf: 1, fluitspeler: 1, engel: 1 }
  };
  const BESTOF_MAX = Object.assign({}, ...Object.values(BESTOF));
  const WOLF_ROLES = ["weerwolf", "grotewolf", "oerwolf", "wolvenmoeder", "wittewolf"];
  const PLAIN = ["burger", "dorpeling"];
  const TEAM = { dorp: "Dorp", wolf: "Weerwolf", solo: "Solo" };
  const CAUSE = {
    weerwolven: "gedood door de weerwolven",
    grotewolf: "gedood door de Grote Boze Wolf",
    wittewolf: "gedood door de Witte weerwolf",
    gif: "vergiftigd door de Heks",
    stem: "weggestemd door het dorp",
    jager: "neergeschoten door de Jager",
    kolos: "verpletterd door de Kolos",
    roest: "gestorven aan de wond van het roestige zwaard",
    liefde: "gestorven van liefdesverdriet",
    spelleider: "door de spelleider op dood gezet"
  };
  const SAMPLE = ["Anouk", "Bram", "Daan", "Eva", "Fleur", "Jesse", "Lotte", "Milan"];

  /* ---------- staat ---------- */

  function mkPlayer(id, name) {
    return { id, name, role: null, orig: null, alive: true, lover: false, charmed: false, mayor: false, canVote: true,
      elderHit: false, revealed: false, infected: false, puppetUsed: false, diedRound: null, diedNight: false, group: null };
  }
  function emptyDeck() { const d = {}; ORDER.forEach(r => (d[r] = 0)); return d; }
  // Voorbeeld uit de spelregels: bij 8 spelers 2 Weerwolven, Cupido, Ziener, Jager en 3 Gewone burgers.
  function defaultDeck(n) {
    const d = emptyDeck();
    d.weerwolf = Math.max(1, Math.floor(n / 4));
    let left = n - d.weerwolf;
    for (const r of ["cupido", "ziener", "jager"]) {
      if (left <= 1) break;
      d[r] = 1; left--;
    }
    d.burger = Math.max(0, left);
    return d;
  }
  // Alle plekken zonder gekozen rol worden Gewone burgers.
  function syncBurgers() {
    const others = ORDER.reduce((a, r) => a + (r === "burger" ? 0 : S.deck[r] || 0), 0);
    S.deck.burger = Math.max(0, S.players.length - others);
  }
  function freshNight() {
    return { done: [], wolfTarget: null, protect: null, healed: false, healId: null, poison: null, whiteKill: null, bigKill: null,
      infect: false, raven: null, seen: null, actor: null, fox: null, aap: [], aapStop: false, mother: null, spirit: false };
  }
  function freshDay() { return { stage: "ochtend", votes: {}, voted: false, out: null, electionDone: false, raven: null, voteOnly: null, spirit: false, second: false, runoff: null }; }
  function newState(names, sample) {
    const players = names.map((n, i) => mkPlayer(i + 1, n));
    return normalize({
      v: 1, phase: "setup", setupStep: "start", round: 1, nextId: players.length + 1, players, sample: !!sample,
      deck: defaultDeck(players.length), opts: { callDead: true, mayor: true, box: "bestof", dealMode: null }
    });
  }
  // Vult ontbrekende velden aan, ook voor spellen die met een oudere versie zijn opgeslagen.
  function normalize(o) {
    const base = {
      witch: { heal: true, poison: true }, lastProtected: null, wildModel: null, night: freshNight(), day: freshDay(),
      pending: [], recent: [], log: [], dismissed: null, used: { toneel: [] }, wolfLost: false, rusty: null,
      powersLost: false, nextVoteOnly: null, setupStep: "spelers"
    };
    for (const k in base) if (o[k] === undefined) o[k] = base[k];
    o.night = Object.assign(freshNight(), o.night);
    o.day = Object.assign(freshDay(), o.day);
    o.used = Object.assign({ toneel: [] }, o.used);
    o.deck = Object.assign(emptyDeck(), o.deck);
    o.opts = Object.assign({ callDead: true, mayor: true, box: "alle", dealMode: null }, o.opts);
    o.players = o.players.map(p => Object.assign(mkPlayer(p.id, p.name), p));
    return o;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return normalize(o); }
    } catch (e) { /* geen opslag beschikbaar */ }
    return null;
  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* negeren */ } }

  let S = load() || newState(SAMPLE, true);
  let hist = [];
  let ui = { menu: null, picks: {}, pickKey: null, voteSel: null, reveal: null, openSets: null, idSkip: {} };

  function act(fn) {
    hist.push(JSON.stringify(S));
    if (hist.length > 80) hist.shift();
    fn();
    ui.picks = {};
    persist();
    render();
  }
  function undo() {
    if (!hist.length) return;
    S = JSON.parse(hist.pop());
    ui.picks = {}; ui.voteSel = null;
    persist();
    render();
  }

  /* ---------- hulpjes ---------- */

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const P = id => S.players.find(p => p.id === id);
  const nameOf = id => { const p = P(id); return p ? p.name : "?"; };
  const living = () => S.players.filter(p => p.alive);
  const holders = r => S.players.filter(p => p.role === r);
  const missing = r => Math.max(0, (S.deck[r] || 0) - holders(r).length);
  const unknownAlive = () => living().filter(p => !p.role);
  const isWolf = p => WOLF_ROLES.includes(p.role) || p.infected;
  const isSpecialVillager = r => r && ROLES[r].team === "dorp" && !PLAIN.includes(r);
  const roleLabel = p => p.role ? ROLES[p.role].name + (p.orig ? " (was " + ROLES[p.orig].name + ")" : "") + (p.infected ? ", besmet" : "") : "Onbekend";
  const list = names => names.length <= 1 ? names.join("") : names.slice(0, -1).join(", ") + " en " + names[names.length - 1];
  const picks = ns => ui.picks[ns] || [];
  const deckTotal = () => ORDER.reduce((a, r) => a + (S.deck[r] || 0), 0);

  function roleStatus(r) {
    const h = holders(r);
    const actor = S.phase === "night" && S.night.actor === r && holders("toneelspeler").some(p => p.alive);
    if (!(S.deck[r] > 0) && !h.length && !actor) return "none";
    if (S.powersLost && ROLES[r].team === "dorp") return "dead";
    if (actor || h.some(p => p.alive)) return "alive";
    if (missing(r) > 0 && unknownAlive().length) return "alive";
    return "dead";
  }
  function wolfStatus() {
    const st = WOLF_ROLES.map(roleStatus);
    if (st.includes("alive") || living().some(p => p.infected)) return "alive";
    if (st.every(x => x === "none")) return "none";
    return "dead";
  }
  function log(t) { S.log.push({ r: S.round, ph: S.phase, t }); }

  // Zoekt vanaf speler p de eerstvolgende levende speler in een richting rond de tafel.
  function neighbour(p, dir, test) {
    const n = S.players.length;
    let i = S.players.indexOf(p);
    for (let k = 1; k < n; k++) {
      const q = S.players[(i + dir * k + n * k) % n];
      if (q.alive && q !== p && (!test || test(q))) return q;
    }
    return null;
  }
  function bearGrowls() {
    const t = holders("titus").find(p => p.alive);
    if (!t || S.powersLost) return null;
    const a = neighbour(t, -1), b = neighbour(t, 1);
    return { titus: t, growl: t.infected || [a, b].some(q => q && isWolf(q)) };
  }

  /* ---------- sterven ---------- */

  function killPlayer(id, cause) {
    const p = P(id);
    if (!p || !p.alive) return;
    if (!p.role) { S.pending.push({ type: "reveal", id, cause }); return; }
    finishKill(p, cause);
  }
  function finishKill(p, cause) {
    const byWolves = cause === "weerwolven" || cause === "grotewolf";
    if (byWolves && p.role === "oudste" && !p.elderHit && !S.powersLost) {
      p.elderHit = true;
      log(p.name + " (Dorpsoudste) is aangevallen door de weerwolven en heeft het overleefd.");
      return;
    }
    if (byWolves && p.role === "poppenspeler" && !p.puppetUsed) {
      p.puppetUsed = true;
      log(p.name + " (Poppenspeler) is aangevallen door de weerwolven, maar de pop neemt de klap. Hij blijft in leven.");
      return;
    }
    if (cause === "stem" && p.role === "dorpsgek" && !p.revealed) {
      p.revealed = true; p.canVote = false;
      log(p.name + " is weggestemd maar blijkt de Dorpsgek. Blijft leven, mag niet meer stemmen.");
      S.recent.push({ id: p.id, cause: "dorpsgek" });
      return;
    }
    const powers = !S.powersLost;
    if (isWolf(p) || ["wildkind", "wolfshond"].includes(p.role) || ["wildkind", "wolfshond"].includes(p.orig)) S.wolfLost = true;
    p.alive = false;
    p.diedRound = S.round;
    p.diedNight = S.phase === "night" || ["weerwolven", "grotewolf", "wittewolf", "gif", "roest"].includes(cause);
    S.recent.push({ id: p.id, cause });
    log(p.name + " (" + roleLabel(p) + ") is " + CAUSE[cause] + ".");

    if (cause === "stem" && powers) {
      const maid = S.players.find(q => q.alive && q.role === "dienstmeisje");
      if (maid && p.role !== "dienstmeisje") S.pending.push({ type: "dienst", id: p.id, maid: maid.id });
    }
    if (p.mayor) {
      p.mayor = false;
      if (living().length) S.pending.push({ type: "burgemeester", id: p.id });
    }
    if (p.role === "jager" && powers) S.pending.push({ type: "jager", id: p.id });
    if (p.role === "kolos" && byWolves && powers) S.pending.push({ type: "kolos", id: p.id });
    if (p.role === "zondebok" && cause === "stem") S.pending.push({ type: "zondebok", id: p.id });
    if (p.role === "ridder" && byWolves && powers) {
      const w = neighbour(p, -1, isWolf);
      if (w) { S.rusty = w.id; log(w.name + " is gewond door het roestige zwaard en sterft de volgende nacht."); }
    }
    if (p.role === "oudste" && ["stem", "jager", "gif"].includes(cause) && !S.powersLost) {
      S.powersLost = true;
      log("De Dorpsoudste is door het dorp gedood. Alle burgers verliezen hun bijzondere gaven.");
    }
    if (p.lover) {
      const other = S.players.find(q => q.lover && q.id !== p.id && q.alive);
      if (other) killPlayer(other.id, "liefde");
    }
    if (S.wildModel === p.id) {
      const kid = S.players.find(q => q.alive && q.role === "wildkind");
      if (kid) {
        kid.orig = "wildkind"; kid.role = "weerwolf";
        log(kid.name + " (Wolvenkind) verliest zijn rolmodel en is nu een weerwolf. Hij wordt vanaf de volgende nacht met de weerwolven wakker.");
      }
    }
  }

  /* ---------- winnaar ---------- */

  function winner() {
    if (S.phase !== "night" && S.phase !== "day") return null;
    if (S.pending.length) return null;
    const L = living();
    const angel = S.players.find(p => p.role === "engel" && !p.alive && !p.lover && (p.diedRound === 0 || (p.diedRound === 1 && p.diedNight)));
    if (angel) return { key: "engel", text: "De Engel (" + angel.name + ") is " + (angel.diedRound === 0 ? "bij de eerste stemming" : "in de eerste nacht") + " uitgeschakeld en wint!" };
    if (!L.length) return { key: "niemand", text: "Iedereen is dood. Niemand wint." };
    const mixedLovers = L.length === 2 && L.every(p => p.lover) && L.some(p => isWolf(p) || p.role === "fluitspeler") && !L.every(isWolf);
    if (mixedLovers) return { key: "geliefden", text: "Alleen de geliefden " + list(L.map(p => p.name)) + " zijn over. Zij winnen samen." };
    const piper = L.find(p => p.role === "fluitspeler");
    if (piper && L.every(p => p === piper || p.charmed)) return { key: "fluitspeler", text: "Iedereen is betoverd. De Fluitspeler (" + piper.name + ") wint." };
    const sect = L.find(p => p.role === "sektarier");
    if (sect && sect.group && L.every(p => p.group === sect.group)) return { key: "sektarier", text: "De andere groep is uitgeroeid. De Verschrikkelijke Sektariër (" + sect.name + ") wint." };
    const hidden = unknownAlive().length > 0 && WOLF_ROLES.some(r => missing(r) > 0);
    if (hidden) return null;
    const wolves = L.filter(isWolf);
    const white = L.find(p => p.role === "wittewolf");
    if (L.length === 1 && white) return { key: "wittewolf", text: "De Witte weerwolf (" + white.name + ") is als enige over en wint." };
    if (!wolves.length) return { key: "dorp", text: "Alle weerwolven zijn uitgeschakeld. De burgers winnen!" };
    if (wolves.length === L.length) return { key: "wolven", text: "Er leven alleen nog weerwolven. De weerwolven winnen!" + (white ? " De Witte weerwolf deelt de overwinning niet." : "") };
    return null;
  }

  /* ---------- de nacht ---------- */

  // Volgorde volgens de samenvatting in de spelregels van Het Beste van; rollen uit andere dozen staan op hun logische plek.
  const STEPS = [
    { id: "slaap", title: "Het dorp slaapt", short: "Slapen",
      script: "Het is nacht in Wakkerdam. Het dorp slaapt en iedereen sluit zijn ogen." },
    { id: "sektarier", role: "sektarier", first: true, title: "De Verschrikkelijke Sektariër",
      script: "Het dorp is verdeeld in twee groepen. Ik noem wie er in welke groep zit." },
    { id: "dief", role: "dief", first: true, title: "De Dief",
      script: "Dief, word wakker. Je mag je kaart ruilen met een van de twee kaarten in het midden. Sluit je ogen weer." },
    { id: "cupido", role: "cupido", first: true, title: "Cupido",
      script: "Cupido, word wakker. Wijs twee spelers aan die verliefd op elkaar worden. Sluit je ogen weer." },
    { id: "geliefden", first: true, title: "De geliefden", cond: () => S.players.filter(p => p.lover).length === 2,
      script: "Ik tik de geliefden aan. Geliefden, word wakker en kijk elkaar aan. Sluit je ogen weer." },
    { id: "toneelspeler", role: "toneelspeler", title: "De Toneelspeler",
      script: "Toneelspeler, word wakker. Kies een van deze kaarten. Die rol speel je tot de volgende nacht. Sluit je ogen weer." },
    { id: "ziener", role: "ziener", title: "De Ziener",
      script: "Ziener, word wakker. Wijs iemand aan van wie je de kaart wilt zien. Sluit je ogen weer." },
    { id: "raadsheer", role: "raadsheer", first: true, title: "De Stotterende raadsheer",
      script: "Stotterende raadsheer, word wakker en laat mij je geheime teken zien. Sluit je ogen weer." },
    { id: "zussen", role: "zus", first: true, title: "De twee gezusters", cond: () => (S.deck.zus || 0) >= 2 || holders("zus").length >= 2,
      script: "Gezusters, word wakker en kijk elkaar aan. Sluit je ogen weer." },
    { id: "broers", role: "broer", first: true, title: "De drie gebroeders", cond: () => (S.deck.broer || 0) >= 2 || holders("broer").length >= 2,
      script: "Gebroeders, word wakker en kijk elkaar aan. Sluit je ogen weer." },
    { id: "wildkind", role: "wildkind", first: true, title: "Het Wolvenkind",
      script: "Wolvenkind, word wakker. Wijs je rolmodel aan. Sluit je ogen weer." },
    { id: "titus", role: "titus", first: true, title: "Titus en zijn dansende beer",
      script: "Titus, word wakker, zodat ik weet wie je bent. Sluit je ogen weer." },
    { id: "aap", role: "aap", title: "De Aap", spent: () => !!S.used.aap && !S.night.aap.length, spentText: "De Aap heeft zijn gave al gebruikt.",
      script: "Aap, word wakker. Wil je vannacht je gave gebruiken? Wijs dan iemand aan. Sluit je ogen weer." },
    { id: "beschermer", role: "beschermer", title: "De Genezer",
      script: "Genezer, word wakker. Wie wil je vannacht beschermen? Sluit je ogen weer." },
    { id: "weerwolven", role: "*wolf", title: "De Weerwolven",
      script: "Weerwolven, word wakker. Kies samen een slachtoffer. Sluit je ogen weer." },
    { id: "wittewolf", role: "wittewolf", even: true, title: "De Witte weerwolf",
      script: "Witte weerwolf, word nog een keer wakker, alleen. Wil je een weerwolf uitschakelen? Sluit je ogen weer." },
    { id: "oerwolf", role: "oerwolf", title: "De Besmettelijke Oerwolf",
      spent: () => !!S.used.oerwolf || !S.night.wolfTarget, spentText: "De Oerwolf kan nu niet besmetten.",
      script: "Besmettelijke Oerwolf, word wakker. Wil je het slachtoffer besmetten in plaats van verslinden? Steek dan je hand op. Sluit je ogen weer." },
    { id: "grotewolf", role: "grotewolf", title: "De Grote Boze Wolf",
      spent: () => S.wolfLost, spentText: "Er is al een weerwolf, Wolvenkind of Wolfshond uitgeschakeld. De Grote Boze Wolf mag geen tweede slachtoffer meer maken.",
      script: "Grote Boze Wolf, word nog een keer wakker. Kies een tweede slachtoffer om te verslinden. Sluit je ogen weer." },
    { id: "wolvenmoeder", role: "wolvenmoeder", only: [1, 2], title: "De Machtige Wolvenmoeder",
      script: "Machtige Wolvenmoeder, word nog een keer wakker. Wijs een speler aan. Sluit je ogen weer." },
    { id: "heks", role: "heks", title: "De Heks",
      script: "Heks, word wakker. Dit is het slachtoffer van de weerwolven. Wil je het levenselixer gebruiken? Steek dan je duim op. Wil je iemand vergiftigen? Wijs die dan aan. Sluit je ogen weer." },
    { id: "vos", role: "vos", title: "De Vos", spent: () => !!S.used.foxLost, spentText: "De Vos heeft zijn gave verloren.",
      script: "Vos, word wakker. Wil je je gave gebruiken? Wijs dan de middelste aan van drie spelers die naast elkaar zitten. Sluit je ogen weer." },
    { id: "zigeunerin", role: "zigeunerin", title: "De Zigeunerin",
      script: "Zigeunerin, word wakker. Wil je een Spiritisme-kaart gebruiken? Welke vraag kies je, en wie moet hem stellen? Sluit je ogen weer." },
    { id: "raaf", role: "raaf", title: "De Raaf",
      script: "Raaf, word wakker. Wie krijgt morgen twee extra stemmen tegen zich? Sluit je ogen weer." },
    { id: "pyromaan", role: "pyromaan", title: "De Pyromaan", spent: () => !!S.used.pyromaan, spentText: "De Pyromaan heeft zijn gave al gebruikt.",
      script: "Pyromaan, word wakker. Wil je vannacht een gebouw in brand steken? Sluit je ogen weer." },
    { id: "fluitspeler", role: "fluitspeler", title: "De Fluitspeler",
      script: "Fluitspeler, word wakker. Wijs twee spelers aan die je wilt betoveren. Sluit je ogen weer." },
    { id: "betoverden", title: "De betoverden", cond: () => roleStatus("fluitspeler") !== "none" && living().some(p => p.charmed),
      script: "Ik tik de nieuwe betoverde spelers aan. Alle betoverde spelers, word wakker en kijk wie er allemaal betoverd zijn. Sluit je ogen weer." },
    { id: "zussen-overleg", role: "zus", from: 2, title: "De twee gezusters", cond: () => holders("zus").filter(p => p.alive).length >= 2 || (S.deck.zus || 0) >= 2,
      script: "Gezusters, word wakker. Jullie mogen even in stilte overleggen. Sluit je ogen weer." },
    { id: "broers-overleg", role: "broer", from: 2, title: "De drie gebroeders", cond: () => holders("broer").filter(p => p.alive).length >= 2 || (S.deck.broer || 0) >= 2,
      script: "Gebroeders, word wakker. Jullie mogen even in stilte overleggen. Sluit je ogen weer." },
    { id: "dageraad", title: "De dageraad", short: "Ochtend",
      script: "Iedereen gaat slapen… De nacht is voorbij. De zon komt op." }
  ];

  function stepList() {
    const out = [];
    for (const s of STEPS) {
      if (s.first && S.round !== 1) continue;
      if (s.from && S.round < s.from) continue;
      if (s.only && !s.only.includes(S.round)) continue;
      if (s.even && S.round % 2 !== 0) continue;
      if (s.cond && !s.cond()) continue;
      let dead = false, deadText = "";
      if (s.role) {
        const st = s.role === "*wolf" ? wolfStatus() : roleStatus(s.role);
        if (st === "none") continue;
        if (st === "dead") { dead = true; deadText = S.powersLost && s.role !== "*wolf" && ROLES[s.role].team === "dorp" && holders(s.role).some(p => p.alive) ? "De burgers hebben hun gaven verloren." : "Deze rol is dood."; }
      }
      if (!dead && s.spent && s.spent()) { dead = true; deadText = s.spentText; }
      if (dead && !S.opts.callDead) continue;
      out.push(Object.assign({}, s, { dead, deadText }));
    }
    return out;
  }
  function done(id) { if (!S.night.done.includes(id)) S.night.done.push(id); }

  function resolveNight() {
    const n = S.night;
    S.recent = [];
    S.lastProtected = n.protect;
    const shielded = id => id === n.protect && P(id).role !== "meisje";
    const healId = n.healId || (n.healed ? n.wolfTarget : null);
    if (S.rusty) { const r = S.rusty; S.rusty = null; killPlayer(r, "roest"); }
    if (n.wolfTarget) {
      const t = P(n.wolfTarget);
      const elderFirst = t.role === "oudste" && !t.elderHit && !S.powersLost;
      if (shielded(t.id)) log(t.name + " is aangevallen door de weerwolven maar was beschermd door de Genezer.");
      else if (n.infect && t.alive && !elderFirst) infect(t);
      else if (healId === t.id) log(t.name + " is aangevallen door de weerwolven maar gered door de Heks.");
      else {
        if (n.infect && elderFirst) log("De besmetting heeft geen effect op de Dorpsoudste bij de eerste beet.");
        killPlayer(t.id, "weerwolven");
      }
    }
    if (n.bigKill) {
      if (shielded(n.bigKill)) log(nameOf(n.bigKill) + " is aangevallen door de Grote Boze Wolf maar was beschermd door de Genezer.");
      else if (healId === n.bigKill) log(nameOf(n.bigKill) + " is aangevallen door de Grote Boze Wolf maar gered door de Heks.");
      else killPlayer(n.bigKill, "grotewolf");
    }
    if (n.whiteKill) killPlayer(n.whiteKill, "wittewolf");
    if (n.poison) killPlayer(n.poison, "gif");
    S.phase = "day";
    S.day = freshDay();
    S.day.spirit = n.spirit;
    S.day.voteOnly = S.nextVoteOnly;
    S.day.stage = "ochtend";
    S.nextVoteOnly = null;
    if (n.raven) {
      const p = P(n.raven);
      if (p && p.alive) { S.day.votes[p.id] = 2; S.day.raven = p.id; }
    }
    log("Het wordt dag " + S.round + ".");
  }

  function infect(t) {
    if (t.role === "fluitspeler") {
      t.orig = "fluitspeler"; t.role = "weerwolf";
      log(t.name + " (Fluitspeler) is besmet door de Besmettelijke Oerwolf en is nu een gewone weerwolf. Hij wordt niet meer als Fluitspeler opgeroepen.");
    } else {
      t.infected = true;
      log(t.name + " is besmet door de Besmettelijke Oerwolf. Hoort nu bij de weerwolven en houdt zijn eigen gave.");
    }
  }

  function startNight() {
    S.round += 1;
    S.phase = "night";
    S.night = freshNight();
    S.recent = [];
    log("Nacht " + S.round + " begint.");
  }


  /* ---------- weergave ---------- */

  // Elk scherm geeft { html, pri, sec } terug: de inhoud en de twee knoppen in de vaste balk onderin.
  const B = (label, action, data, ok) => ({ label, action, data: data || {}, ok: ok === undefined ? true : !!ok });

  function render() {
    document.documentElement.dataset.phase = S.phase === "day" && !ui.menu ? "day" : "night";
    const L = living();
    let title, sub;
    if (S.phase === "setup") { title = "Voorbereiding"; sub = S.players.length + " spelers"; }
    else if (S.phase === "night") { title = "Nacht " + S.round; sub = L.length + " van de " + S.players.length + " spelers leven"; }
    else if (S.phase === "day") { title = S.round === 0 ? "Eerste stemming" : "Dag " + S.round; sub = L.length + " van de " + S.players.length + " spelers leven"; }
    else { title = "Einde van het spel"; sub = "Na " + S.round + " rondes"; }
    if (ui.menu) { title = "Menu"; }
    document.getElementById("phase-title").textContent = title;
    document.getElementById("phase-sub").textContent = sub;
    document.getElementById("undo-btn").disabled = !hist.length;
    document.getElementById("menu-btn").hidden = !!ui.menu || (S.phase === "setup" && S.setupStep === "start");

    let scr;
    if (ui.menu) scr = renderMenu();
    else if (S.phase === "setup") scr = { start: renderStart, spelers: renderSetupPlayers, rollen: renderSetupRoles, delen: renderSetupDeal }[S.setupStep || "spelers"]();
    else if (S.phase === "end") scr = renderEnd();
    else scr = winScreen() || (S.phase === "night" ? renderNight() : renderDay());

    document.getElementById("main").innerHTML = scr.html;
    document.getElementById("bar").innerHTML = barButton(scr.sec, "quiet") + barButton(scr.pri, "primary");
    const now = document.querySelector(".order li.now");
    if (now) { const o = now.parentElement; o.scrollLeft = now.offsetLeft - o.clientWidth / 2 + now.clientWidth / 2; }
    renderOverlay();
  }

  function barButton(b, cls) {
    if (!b) return "";
    const data = Object.entries(b.data || {}).map(([k, v]) => " data-" + k + '="' + esc(v) + '"').join("");
    return '<button type="button" class="btn ' + cls + '" data-action="' + b.action + '"' + data + (b.ok ? "" : " disabled") + ">" + esc(b.label) + "</button>";
  }

  function picker(ns, max, cands, chosen) {
    const sel = picks(ns);
    if (!cands.length) return '<p class="note">Er is niemand om te kiezen.</p>';
    let h = '<div class="picker">' + cands.map(p =>
      '<button type="button" class="pick' + (sel.includes(p.id) ? " on" : "") + '" aria-pressed="' + sel.includes(p.id) + '" data-action="pick" data-ns="' + ns + '" data-max="' + max + '" data-id="' + p.id + '">' +
      esc(p.name) + "<small>" + esc(p.role ? ROLES[p.role].name : "rol onbekend") + (p.infected ? " · besmet" : "") + (p.lover ? " · geliefde" : "") + (p.charmed ? " · betoverd" : "") + "</small></button>"
    ).join("") + "</div>";
    if (chosen && sel.length) h += chosen(sel.map(P));
    return h;
  }
  const chosenLine = (text, bad) => names => '<p class="chosen' + (bad ? " bad" : "") + '">' + esc(text.replace("{}", list(names.map(p => p.name)))) + "</p>";

  function teamTag(r) {
    const t = ROLES[r].team;
    return '<span class="tag ' + (t === "wolf" ? "wolf" : t === "solo" ? "solo" : "") + '">' + TEAM[t] + "</span>";
  }
  function playerTags(p) {
    const t = [];
    if (p.mayor) t.push('<span class="tag acc">Burgemeester</span>');
    if (p.lover) t.push('<span class="tag wolf">Geliefde</span>');
    if (p.infected) t.push('<span class="tag wolf">Besmet</span>');
    if (p.charmed) t.push('<span class="tag solo">Betoverd</span>');
    if (p.group) t.push('<span class="tag">Groep ' + p.group + "</span>");
    if (!p.canVote) t.push('<span class="tag">Geen stemrecht</span>');
    if (p.elderHit) t.push('<span class="tag">Aanval overleefd</span>');
    if (p.puppetUsed) t.push('<span class="tag">Pop gebruikt</span>');
    if (S.wildModel === p.id) t.push('<span class="tag">Rolmodel Wolvenkind</span>');
    if (S.rusty === p.id) t.push('<span class="tag wolf">Sterft volgende nacht</span>');
    if (!p.alive) t.push('<span class="tag">Dood</span>');
    return t.length ? '<span class="tags">' + t.join("") + "</span>" : "";
  }
  function roleOptions(sel, withUnknown, exclude) {
    let h = withUnknown ? '<option value=""' + (sel ? "" : " selected") + ">? Nog onbekend</option>" : "";
    for (const set in SETS) {
      const rs = ORDER.filter(r => ROLES[r].set === set && !(exclude || []).includes(r));
      if (!rs.length) continue;
      h += '<optgroup label="' + SETS[set] + '">' + rs.map(r => '<option value="' + r + '"' + (sel === r ? " selected" : "") + ">" + ROLES[r].name + "</option>").join("") + "</optgroup>";
    }
    return h;
  }
  const roleSelect = (id, label, opts) => '<select id="' + id + '" aria-label="' + esc(label) + '">' + opts + "</select>";
  const scriptBox = text => text ? '<div class="script"><span class="label">Voorlezen</span><p>' + esc(text) + "</p></div>" : "";

  /* --- voorbereiding --- */

  function renderStart() {
    return {
      html: '<section class="hero"><div class="emblem big" aria-hidden="true"></div><div><p class="eyebrow">Spelleider</p><h2 class="display">De Weerwolven van Wakkerdam</h2></div>' +
        '<p class="lead">Deze app vertelt je wie er wakker wordt, in welke volgorde, wat je voorleest en wie er sterft. Jij hoeft alleen het dorp in de gaten te houden.</p>' +
        '<ol class="steps"><li><span><strong>Spelers</strong> invoeren, in de volgorde rond de tafel</span></li><li><span><strong>Rollen</strong> kiezen uit je doos</span></li><li><span><strong>Kaarten delen</strong> en het spel beginnen</span></li></ol></section>',
      pri: B("Nieuw spel →", "goto", { step: "spelers" })
    };
  }

  function playerProblems() {
    const e = [];
    if (S.players.length < 4) e.push("Je hebt minstens 4 spelers nodig.");
    if (S.players.some(p => !p.name.trim())) e.push("Niet iedere speler heeft een naam.");
    return e;
  }

  function renderSetupPlayers() {
    const n = S.players.length;
    let h = '<section class="stack"><div><p class="eyebrow">Stap 1 van 3</p><h2>Wie spelen er mee?</h2><p class="note">Zet ze in de volgorde waarin ze aan tafel zitten, met de klok mee. Die volgorde gebruikt de app voor de Vos, Titus en de Ridder.</p></div>';
    if (S.sample) h += '<p class="note warn">Dit zijn voorbeeldnamen. Pas ze aan of verwijder ze.</p>';
    h += '<div class="addrow"><input type="text" id="new-name" placeholder="Naam van speler ' + (n + 1) + '" aria-label="Naam van een nieuwe speler" autocomplete="off"><button type="button" class="btn primary" data-action="add-player">Toevoegen</button></div>';
    if (n) h += '<ol class="rows">' + S.players.map((p, i) =>
      '<li class="setup-row"><span class="num">' + (i + 1) + "</span>" +
      '<input type="text" id="name-' + p.id + '" aria-label="Naam speler ' + (i + 1) + '" value="' + esc(p.name) + '" data-change="rename" data-id="' + p.id + '">' +
      '<button type="button" class="btn sm quiet" data-action="move-up" data-id="' + p.id + '" aria-label="' + esc(p.name) + ' een plek omhoog"' + (i ? "" : " disabled") + ">↑</button>" +
      '<button type="button" class="btn sm danger" data-action="remove-player" data-id="' + p.id + '" aria-label="Verwijder ' + esc(p.name) + '">✕</button></li>'
    ).join("") + "</ol>";
    h += playerProblems().filter(() => n).map(e => '<p class="note bad">' + esc(e) + "</p>").join("") + "</section>";
    return { html: h, sec: B("Terug", "goto", { step: "start" }), pri: B("Rollen kiezen →", "goto", { step: "rollen" }, !playerProblems().length) };
  }

  function roleProblems() {
    const n = S.players.length;
    const chosen = ORDER.reduce((a, r) => a + (r === "burger" ? 0 : S.deck[r] || 0), 0);
    const e = [], w = [];
    if (chosen > n) e.push("Je hebt " + chosen + " rollen gekozen voor " + n + " spelers. Haal er " + (chosen - n) + " weg.");
    if (!WOLF_ROLES.some(r => S.deck[r] > 0)) e.push("Er moet minstens één weerwolf meedoen.");
    const wolves = ORDER.filter(r => ROLES[r].team === "wolf").reduce((a, r) => a + (S.deck[r] || 0), 0);
    if (wolves > n / 4) w.push("De spelregels raden hoogstens een kwart weerwolven aan. Nu: " + wolves + " van de " + n + ".");
    if (S.opts.box === "bestof" && S.deck.burger > BESTOF_MAX.burger) w.push("De doos heeft maar " + BESTOF_MAX.burger + " Gewone burgers. Kies meer rollen of gebruik losse kaartjes.");
    return { e, w };
  }

  function roleCard(r) {
    const c = S.deck[r] || 0;
    const multi = r === "zus" ? 2 : r === "broer" ? 3 : 1;
    return '<button type="button" class="rolecard" data-action="toggle-role" data-role="' + r + '" aria-pressed="' + (c > 0) + '">' +
      '<span class="rc-main"><span class="rc-name">' + ROLES[r].name + (multi > 1 ? ' <span class="muted small">' + multi + " tegels</span>" : "") + " " + teamTag(r) + '</span><span class="role-desc">' + ROLES[r].desc + "</span></span>" +
      '<span class="rc-check" aria-hidden="true">' + (c > 1 ? c + "×" : c ? "✓" : "") + "</span></button>";
  }

  function renderSetupRoles() {
    syncBurgers();
    const n = S.players.length;
    const box = S.opts.box;
    const maxWolf = box === "bestof" ? BESTOF_MAX.weerwolf : 99;
    const wolves = ORDER.filter(r => ROLES[r].team === "wolf").reduce((a, r) => a + (S.deck[r] || 0), 0);
    const special = ORDER.reduce((a, r) => a + (r === "burger" || ROLES[r].team === "wolf" ? 0 : S.deck[r] || 0), 0);
    const pr = roleProblems();
    let h = '<section class="stack"><div><p class="eyebrow">Stap 2 van 3</p><h2>Welke rollen doen mee?</h2><p class="note">Tik een rol aan om hem mee te laten doen. Alle overige spelers zijn Gewone burgers.</p></div>' +
      '<div class="seg" role="group" aria-label="Welke doos"><button type="button" data-action="set-box" data-box="bestof" aria-pressed="' + (box === "bestof") + '">Het Beste van</button><button type="button" data-action="set-box" data-box="alle" aria-pressed="' + (box === "alle") + '">Alle dozen</button></div>' +
      '<div class="summary" aria-live="polite"><span>' + wolves + " weerwolf" + (wolves === 1 ? "" : "ven") + "</span><span>" + special + " andere rol" + (special === 1 ? "" : "len") + "</span><span>" + S.deck.burger + " gewone burger" + (S.deck.burger === 1 ? "" : "s") + "</span></div>" +
      pr.e.map(x => '<p class="note bad">' + esc(x) + "</p>").join("") + pr.w.map(x => '<p class="note warn">' + esc(x) + "</p>").join("") +
      '<div class="card"><div class="spread"><div class="rc-main"><span class="rc-name">Weerwolven ' + teamTag("weerwolf") + '</span><span class="role-desc">' + ROLES.weerwolf.desc + "</span></div>" +
      '<div class="stepper"><button type="button" data-action="deck" data-role="weerwolf" data-delta="-1" aria-label="Eén weerwolf minder"' + (S.deck.weerwolf > 0 ? "" : " disabled") + '>−</button><output>' + S.deck.weerwolf + '</output><button type="button" data-action="deck" data-role="weerwolf" data-delta="1" aria-label="Eén weerwolf meer"' + (S.deck.weerwolf < maxWolf ? "" : " disabled") + ">+</button></div></div></div>";
    if (box === "bestof") {
      for (const g in BESTOF) {
        const rs = Object.keys(BESTOF[g]).filter(r => r !== "weerwolf" && r !== "burger");
        if (rs.length) h += '<h3 class="group-title">' + g + '</h3><div class="rolelist">' + rs.map(roleCard).join("") + "</div>";
      }
    } else {
      if (!ui.openSets) { ui.openSets = {}; for (const set in SETS) ui.openSets[set] = set === "basis" || ORDER.some(r => ROLES[r].set === set && r !== "weerwolf" && r !== "burger" && S.deck[r] > 0); }
      for (const set in SETS) {
        const rs = ORDER.filter(r => ROLES[r].set === set && r !== "weerwolf" && r !== "burger");
        const cnt = rs.filter(r => S.deck[r] > 0).length;
        const open = ui.openSets[set];
        h += '<div class="setgroup"><button type="button" class="sethead" data-action="toggle-set" data-set="' + set + '" aria-expanded="' + open + '"><span class="pname">' + SETS[set] + '</span><span class="chev">' + (cnt ? cnt + " gekozen · " : "") + rs.length + " rollen " + (open ? "▴" : "▾") + "</span></button>" +
          (open ? '<div class="rolelist">' + rs.map(roleCard).join("") + "</div>" : "") + "</div>";
      }
      h += '<p class="note"><em>Het Pact</em> bevat het basisspel, Volle Maan, Karakters en Het Dorp.</p>';
    }
    h += "</section>";
    return { html: h, sec: B("Terug", "goto", { step: "spelers" }), pri: B("Kaarten delen →", "goto", { step: "delen" }, !pr.e.length) };
  }

  function renderSetupDeal() {
    const mode = S.opts.dealMode;
    const choice = (m, title, text) => '<button type="button" class="choice" data-action="deal-mode" data-mode="' + m + '" aria-pressed="' + (mode === m) + '"><span class="rc-main"><span class="rc-name">' + title + '</span><span class="role-desc">' + text + '</span></span><span class="rc-check" aria-hidden="true"></span></button>';
    let h = '<section class="stack"><div><p class="eyebrow">Stap 3 van 3</p><h2>Hoe deel je de kaarten?</h2></div>' +
      '<div class="rolelist">' +
      choice("kaarten", "Ik deel de echte tegels uit", "Schud de tegels en geef iedereen er gedekt een. In de eerste nacht vraagt de app wie er wakker wordt. Rollen die nooit wakker worden vul je in als die speler sterft.") +
      choice("app", "De app verdeelt de rollen", "De app kiest willekeurig. Daarna geef je de telefoon rond, zodat iedereen alleen zijn eigen rol ziet.") + "</div>";
    if (mode === "app") h += '<div class="card"><p>De rollen zijn verdeeld. Geef nu de telefoon rond.</p><div class="btns"><button type="button" class="btn primary" data-action="show-roles">Telefoon rondgeven</button><button type="button" class="btn quiet" data-action="deal">Opnieuw verdelen</button></div><p class="note">Als spelleider zie je de verdeling onder Menu → Overzicht.</p></div>';
    h += '<div class="card"><h3>Instellingen</h3>' +
      '<label class="check"><input type="checkbox" id="opt-mayor" data-change="opt" data-key="mayor"' + (S.opts.mayor ? " checked" : "") + '><span>Met burgemeester<br><span class="note">Op de eerste dag kiest het dorp een burgemeester. Zijn stem telt dubbel en beslist bij een gelijkspel.</span></span></label>' +
      '<label class="check"><input type="checkbox" id="opt-callDead" data-change="opt" data-key="callDead"' + (S.opts.callDead ? " checked" : "") + '><span>Dode rollen toch afroepen<br><span class="note">Zo verraad je niet welke rollen al dood zijn of hun gave al gebruikt hebben.</span></span></label></div>';
    h += '<p class="note">' + (S.deck.engel > 0 ? "De Engel speelt mee, dus het spel begint met een discussie en een stemming." : "Het spel begint met de eerste nacht.") + "</p></section>";
    const ok = mode === "kaarten" || (mode === "app" && S.players.every(p => p.role));
    return { html: h, sec: B("Terug", "goto", { step: "rollen" }), pri: B("Start het spel →", "start", {}, ok && !setupProblems().length) };
  }

  function setupProblems() {
    const errs = playerProblems().concat(roleProblems().e);
    for (const r of ORDER) {
      const c = holders(r).length;
      if (c > (S.deck[r] || 0)) errs.push(c + "× " + ROLES[r].name + " toegewezen, maar er " + ((S.deck[r] || 0) === 1 ? "is" : "zijn") + " maar " + (S.deck[r] || 0) + " in het spel.");
    }
    return errs;
  }

  /* --- openstaande zaken (Jager, burgemeester, …) --- */

  function pendingScreen() {
    const it = S.pending[0];
    const p = P(it.id);
    const skip = label => B(label, "pend-skip");
    let h = '<article class="card alert"><p class="eyebrow">Eerst afhandelen</p>', pri, sec;
    if (it.type === "reveal") {
      const opts = ORDER.filter(r => missing(r) > 0);
      h += "<h2>Welke rol had " + esc(p.name) + "?</h2><p>" + esc(p.name) + " is " + CAUSE[it.cause] + ". Draai de tegel om en kies de rol.</p>" +
        roleSelect("pend-role", "Rol van " + p.name, opts.length ? opts.map(r => '<option value="' + r + '">' + ROLES[r].name + "</option>").join("") : roleOptions("", false));
      pri = B("Vastleggen →", "pend-reveal");
    } else if (it.type === "jager") {
      h += "<h2>De Jager schiet</h2><p>" + esc(p.name) + " was de Jager. Voordat hij de geest geeft, kiest hij iemand die ook wordt uitgeschakeld.</p>" + picker("shoot", 1, living(), chosenLine("{} wordt neergeschoten.", true));
      pri = B("Schieten →", "pend-shoot", {}, picks("shoot").length); sec = skip("Niemand");
    } else if (it.type === "kolos") {
      const ws = living().filter(isWolf);
      h += "<h2>De Kolos slaat terug</h2><p>" + esc(p.name) + " was de Kolos. Roep hem: hij kiest welke weerwolf hij meeneemt.</p>" + picker("shoot", 1, ws.length ? ws : living(), chosenLine("{} wordt verpletterd.", true));
      pri = B("Meenemen →", "pend-shoot", {}, picks("shoot").length); sec = skip("Niemand");
    } else if (it.type === "burgemeester") {
      h += "<h2>Nieuwe burgemeester</h2><p>" + esc(p.name) + " was burgemeester en wijst met zijn laatste adem een opvolger aan.</p>" + picker("succ", 1, living().filter(q => q.canVote), chosenLine("{} wordt burgemeester."));
      pri = B("Benoemen →", "pend-mayor", {}, picks("succ").length); sec = skip("Geen opvolger");
    } else if (it.type === "zondebok") {
      h += "<h2>De Zondebok kiest</h2><p>" + esc(p.name) + " was de Zondebok en bepaalt wie er de volgende dag mag stemmen.</p>" + picker("voters", 99, living());
      pri = B("Alleen zij stemmen →", "pend-voters", {}, picks("voters").length); sec = skip("Iedereen");
    } else if (it.type === "dienst") {
      const maid = P(it.maid);
      h += "<h2>Het Toegewijde dienstmeisje</h2><p>Wil " + esc(maid.name) + " de rol van " + esc(p.name) + " (" + esc(roleLabel(p)) + ") overnemen? Dat moet vóórdat de tegel wordt omgedraaid.</p>";
      pri = B("Ja, neemt de rol over →", "pend-maid"); sec = skip("Nee");
    }
    return { html: h + "</article>", pri, sec };
  }

  function winScreen() {
    if (ui.menu) return null;
    const w = winner();
    if (!w || S.dismissed === w.key) return null;
    const before = S.phase !== "day" ? "" : S.day.voted ? resultCard() : morningCard();
    return {
      html: before + '<article class="card win"><p class="eyebrow">Het spel is beslist</p><h2>' + esc(w.text) + '</h2><p class="note">Draai alle tegels om en vertel wie wat was.</p></article>',
      sec: B("Doorspelen", "win-continue"), pri: B("Spel beëindigen →", "win-end")
    };
  }

  /* --- nacht --- */

  function stepRoles(s) {
    if (s.role === "*wolf") return S.round === 1 ? WOLF_ROLES.concat("wolfshond") : WOLF_ROLES;
    return s.role ? [s.role] : [];
  }
  function whoLine(s) {
    if (!s.role) return "";
    const roles = stepRoles(s);
    const al = S.players.filter(p => p.alive && (roles.includes(p.role) || (s.role === "*wolf" && p.infected))).map(p => p.name);
    const actor = s.role !== "*wolf" && S.night.actor === s.role ? holders("toneelspeler").find(p => p.alive) : null;
    if (actor) al.push(actor.name + " (Toneelspeler)");
    const miss = roles.reduce((a, r) => a + missing(r), 0);
    let t = al.length ? "Wie: " + list(al) : "";
    if (miss > 0 && !s.dead) t += (t ? " · " : "") + miss + " nog niet bekend";
    return t ? '<p class="muted">' + esc(t) + "</p>" : "";
  }
  function needsId(s) {
    if (!s.role || s.dead || ui.idSkip[S.round + ":" + s.id]) return null;
    const r = stepRoles(s).find(x => missing(x) > 0);
    return r && unknownAlive().length ? r : null;
  }

  function renderNight() {
    if (S.pending.length) return pendingScreen();
    const steps = stepList();
    const cur = steps.find(s => !S.night.done.includes(s.id)) || steps[steps.length - 1];
    const key = S.round + ":" + cur.id;
    if (ui.pickKey !== key) { ui.pickKey = key; ui.picks = {}; }
    const idx = steps.indexOf(cur);
    const strip = '<ol class="order" aria-label="Volgorde van deze nacht">' + steps.map((s, i) =>
      '<li class="' + (S.night.done.includes(s.id) ? "done" : s === cur ? "now" : "") + (s.dead ? " dead" : "") + '"' + (s === cur ? ' aria-current="step"' : "") + "><span><b>" + (i + 1) + "</b></span>" + esc(s.short || s.title.replace(/^(De|Het) /, "")) + "</li>"
    ).join("") + "</ol>";
    let script = cur.script;
    if (cur.id === "weerwolven" && S.round === 1) script = "Weerwolven, word wakker en kijk wie de andere weerwolven zijn. Kies samen een slachtoffer. Sluit je ogen weer.";
    const idRole = needsId(cur);
    const body = idRole ? identifyStage(cur, idRole) : stepStage(cur, steps);
    return {
      html: strip + '<article class="card"><div><p class="eyebrow">Nacht ' + S.round + " · stap " + (idx + 1) + " van " + steps.length + "</p><h2>" + esc(cur.title) + "</h2>" + whoLine(cur) + "</div>" +
        scriptBox(script) + body.html + "</article>",
      pri: body.pri, sec: body.sec
    };
  }

  function identifyStage(s, r) {
    const cands = unknownAlive();
    const need = Math.min(missing(r), cands.length);
    const sel = picks("id");
    const html = '<div class="stack"><h3>Wie ' + (need > 1 ? "worden" : "wordt") + " er wakker als " + ROLES[r].name + (need > 1 ? " (" + need + ")" : "") + "?</h3>" +
      (r === "wolfshond" ? '<p class="note">Alleen als de Wolfshond weerwolf wil worden, doet hij nu zijn ogen open.</p>' : '<p class="note">Kijk wie zijn ogen opendoet en tik die aan.</p>') +
      picker("id", need, cands) + "</div>";
    return { html, pri: B("Vastleggen →", "identify", { role: r }, sel.length), sec: B("Later", "id-skip", { step: s.id }) };
  }

  function stepStage(s, steps) {
    const n = S.night;
    const L = living();
    const sel = picks("act");
    const next = label => B(label || "Volgende →", "step-next", { step: s.id });
    const skip = label => B(label || "Overslaan", "step-next", { step: s.id });
    const self = r => holders(r).map(p => p.id);
    if (s.dead) return { html: '<p class="note warn">' + esc(s.deadText) + " Roep de rol toch af en wacht een paar tellen, zodat niemand iets merkt.</p>", pri: next() };
    switch (s.id) {
      case "slaap": {
        const rest = steps.filter(x => x.id !== "slaap");
        return {
          html: '<div class="stack"><h3>Vannacht roep je op, in deze volgorde</h3><ol class="plainlist">' + rest.map(x => '<li class="' + (x.dead ? "dead" : "") + '">' + esc(x.title) + (x.dead ? " (alleen afroepen)" : "") + "</li>").join("") + "</ol></div>",
          pri: B("Begin de nacht →", "step-next", { step: "slaap" })
        };
      }
      case "sektarier":
        return { html: '<p class="note">Tik de spelers van groep A aan. De rest is groep B. Verdeel bijvoorbeeld op haarlengte, en vertel iedereen hardop in welke groep hij zit.</p>' + picker("act", 99, L),
          pri: B("Vastleggen →", "sect", {}, sel.length && sel.length < L.length), sec: skip() };
      case "dief": {
        const thief = holders("dief").find(p => p.alive);
        if (!thief) return { html: '<p class="note">Het is nog niet bekend wie de Dief is.</p>', pri: next() };
        return { html: '<label class="stack"><span>Welke rol kiest ' + esc(thief.name) + "?</span>" + roleSelect("dief-role", "Nieuwe rol", roleOptions("", false, ["dief"])) + '</label><p class="note">Liggen er twee weerwolven in het midden, dan moet de Dief ruilen.</p>',
          pri: B("Ruilen →", "dief-swap"), sec: skip("Niet ruilen") };
      }
      case "cupido":
        return { html: '<p class="note">Cupido mag zichzelf ook kiezen. Tik daarna de twee geliefden zachtjes aan.</p>' + picker("act", 2, L, chosenLine("{} worden verliefd.")),
          pri: B("Maak ze verliefd →", "cupido", {}, sel.length === 2), sec: skip() };
      case "geliefden":
        return { html: "<p>Tik " + esc(list(S.players.filter(p => p.lover).map(p => p.name))) + " zachtjes aan. Ze mogen kort hun ogen openen.</p>", pri: next() };
      case "raadsheer":
        return { html: '<p class="note">Onthoud het teken. Geeft hij het overdag, dan volgt er een tweede stemming.</p>', pri: next() };
      case "zussen": case "broers": case "zussen-overleg": case "broers-overleg": {
        const z = holders(s.role).filter(p => p.alive).map(p => p.name);
        return { html: z.length ? "<p>" + esc(list(z)) + ".</p>" : "", pri: next(), sec: s.id.endsWith("overleg") ? skip("Vannacht niet") : null };
      }
      case "wildkind":
        return { html: picker("act", 1, L.filter(p => !self("wildkind").includes(p.id)), chosenLine("Rolmodel: {}")),
          pri: B("Vastleggen →", "wild", {}, sel.length), sec: skip() };
      case "titus":
        return { html: '<p class="note">Elke ochtend zegt de app of de beer gromt.</p>', pri: next() };
      case "toneelspeler": {
        if (n.actor) return { html: "<p>Tot de volgende nacht speelt hij: <strong>" + esc(ROLES[n.actor].name) + "</strong>. De app roept hem ook bij die rol.</p>", pri: next() };
        const opts = ORDER.filter(r => isSpecialVillager(r) && r !== "toneelspeler" && !S.used.toneel.includes(r));
        return { html: '<p class="note">Laat drie kaarten met een gave zien. Al gespeeld: ' + esc(S.used.toneel.length ? list(S.used.toneel.map(r => ROLES[r].name)) : "nog niets") + ".</p>" +
          roleSelect("actor-role", "Gekozen rol", opts.map(r => '<option value="' + r + '">' + ROLES[r].name + "</option>").join("")),
          pri: B("Deze rol kiezen →", "actor", {}, opts.length), sec: skip("Geen rol") };
      }
      case "ziener": {
        if (n.seen) return { html: revealHtml(P(n.seen)), pri: next() };
        return { html: picker("act", 1, L.filter(p => !self("ziener").includes(p.id))), pri: B("Toon de rol →", "see", {}, sel.length), sec: skip() };
      }
      case "vos": {
        if (n.fox) {
          const grp = n.fox.map(P), hit = grp.some(isWolf);
          return { html: "<p>Groepje: " + esc(list(grp.map(p => p.name))) + '.</p><p class="big-reveal">' + (hit ? "Duim omhoog" : "Duim omlaag") + "</p>" +
            (hit ? '<p class="note">Er zit minstens één weerwolf bij.</p>' : '<p class="note warn">Geen weerwolf. De Vos verliest voorgoed zijn gave.</p>'), pri: next() };
        }
        return { html: '<p class="note">De Vos wijst de middelste van drie spelers aan. De app neemt de levende buren links en rechts mee.</p>' + picker("act", 1, L),
          pri: B("Bekijk het groepje →", "fox", {}, sel.length), sec: skip("Vos past") };
      }
      case "aap": {
        const seen = n.aap.map(P);
        const last = seen[seen.length - 1];
        const canGo = !last || (last.role && ROLES[last.role].team === "dorp" && !last.infected);
        let html = seen.map(p => "<p><strong>" + esc(p.name) + "</strong>: " + esc(p.role ? ROLES[p.role].name : "rol onbekend") + "</p>").join("");
        if (seen.length && !canGo) html += '<p class="note warn">Geen burger. De Aap moet stoppen.</p>';
        if (canGo) html += (seen.length ? '<p class="note">Een burger. De Aap mag doorgaan of stoppen.</p>' : '<p class="note">Dit kan maar één keer per spel.</p>') +
          picker("act", 1, L.filter(p => !self("aap").includes(p.id) && !n.aap.includes(p.id)));
        if (canGo && sel.length) return { html, pri: B("Toon de rol →", "aap"), sec: seen.length ? next("Stoppen") : skip("Vannacht niet") };
        return { html, pri: seen.length ? next("Klaar →") : B("Toon de rol →", "aap", {}, false), sec: seen.length ? null : skip("Vannacht niet") };
      }
      case "beschermer": {
        const last = S.lastProtected && P(S.lastProtected);
        return { html: (last ? '<p class="note">Vorige nacht beschermd: ' + esc(last.name) + ". Die mag nu niet.</p>" : "") +
          (roleStatus("meisje") === "alive" ? '<p class="note">Het Onschuldige meisje kan niet beschermd worden.</p>' : "") +
          picker("act", 1, L.filter(p => p.id !== S.lastProtected), chosenLine("{} is vannacht beschermd.")),
          pri: B("Beschermen →", "protect", {}, sel.length), sec: skip("Niemand") };
      }
      case "weerwolven": {
        let html = "";
        if (S.round === 1) html += '<p class="note">Eerste nacht: laat de weerwolven elkaar eerst herkennen.</p>';
        const dog = S.players.find(p => p.alive && p.role === "wolfshond");
        if (S.round === 1 && dog) html += '<div class="stack"><h3>Wolfshond (' + esc(dog.name) + ") kiest</h3><div class=\"btns\">" +
          '<button type="button" class="btn" data-action="dog" data-choice="weerwolf">Wordt weerwolf</button><button type="button" class="btn" data-action="dog" data-choice="burger">Blijft burger</button></div></div>';
        if (roleStatus("meisje") === "alive") html += '<p class="note">Het Onschuldige meisje mag nu gluren. Betrappen de weerwolven haar, kies haar dan als slachtoffer.</p>';
        if (S.players.some(p => p.alive && (p.orig === "wildkind" || p.orig === "wolfshond") && p.role === "weerwolf")) html += '<p class="note">Vergeet het Wolvenkind of de Wolfshond niet: die is nu ook weerwolf.</p>';
        if (S.players.some(p => p.alive && p.infected)) html += '<p class="note">Besmette spelers worden ook met de weerwolven wakker.</p>';
        html += "<h3>Wie kiezen ze als slachtoffer?</h3>" + picker("act", 1, L.filter(p => !isWolf(p)), chosenLine("{} wordt het slachtoffer.", true));
        return { html, pri: B("Vastleggen →", "wolves", {}, sel.length), sec: skip("Geen slachtoffer") };
      }
      case "oerwolf": {
        const t = P(n.wolfTarget);
        return { html: "<p>Slachtoffer: <strong>" + esc(t.name) + "</strong>. Dit kan maar één keer per spel. Tik de besmette speler zachtjes aan.</p>" +
          (t.role === "oudste" && !t.elderHit ? '<p class="note">Let op: bij de eerste beet heeft de besmetting geen effect op de Dorpsoudste.</p>' : ""),
          pri: B("Besmetten →", "infect"), sec: skip("Niet besmetten") };
      }
      case "grotewolf":
        return { html: picker("act", 1, L.filter(p => !isWolf(p) && p.id !== n.wolfTarget), chosenLine("{} wordt het tweede slachtoffer.", true)),
          pri: B("Vastleggen →", "bigwolf", {}, sel.length), sec: skip("Geen") };
      case "wolvenmoeder": {
        if (n.mother) {
          const m = n.mother;
          return { html: "<p><strong>" + esc(nameOf(m.id)) + "</strong>: " + (m.lost ? "verliest de gave van " + esc(ROLES[m.lost].name) + " en is nu een gewone burger." : "geen burger met een gave. Er gebeurt niets.") + "</p>", pri: next() };
        }
        return { html: '<p class="note">Alleen in de eerste twee nachten.</p>' + picker("act", 1, L.filter(p => p.role !== "wolvenmoeder")),
          pri: B("Aanwijzen →", "mother", {}, sel.length), sec: skip("Niemand") };
      }
      case "wittewolf":
        return { html: picker("act", 1, L.filter(p => isWolf(p) && p.role !== "wittewolf"), chosenLine("{} wordt uitgeschakeld.", true)),
          pri: B("Uitschakelen →", "white", {}, sel.length), sec: skip("Niemand") };
      case "heks": {
        const t = n.wolfTarget && P(n.wolfTarget);
        const big = n.bigKill && P(n.bigKill);
        const healId = n.healId || (n.healed ? n.wolfTarget : null);
        let html = "<p>" + (t ? "Wijs het slachtoffer van de weerwolven aan: <strong>" + esc(t.name) + "</strong>" + (n.protect === t.id && t.role !== "meisje" ? ' <span class="tag good">beschermd</span>' : "") + (n.infect ? ' <span class="tag wolf">wordt besmet</span>' : "") : "De weerwolven hebben niemand gekozen.") + "</p>";
        if (big) html += "<p>Slachtoffer van de Grote Boze Wolf: <strong>" + esc(big.name) + "</strong></p>";
        if (n.infect) html += '<p class="note">De besmetting kan de Heks niet genezen.</p>';
        html += '<div class="facts"><div class="fact"><h3>Levenselixer</h3><p>' + (healId ? "Gebruikt op " + esc(nameOf(healId)) : S.witch.heal ? "Nog beschikbaar" : "Op") + '</p></div><div class="fact"><h3>Gif</h3><p>' + (n.poison ? "Gegeven aan " + esc(nameOf(n.poison)) : S.witch.poison ? "Nog beschikbaar" : "Op") + "</p></div></div>";
        if (S.witch.heal && !healId) {
          const healable = [t && !n.infect ? t : null, big].filter(Boolean);
          if (healable.length) html += '<div class="btns">' + healable.map(q => '<button type="button" class="btn" data-action="heal" data-id="' + q.id + '">Duim omhoog: ' + esc(q.name) + " redden</button>").join("") + "</div>";
        }
        if (S.witch.poison && !n.poison) {
          html += '<div class="stack"><h3>Wil ze iemand vergiftigen?</h3>' + picker("act", 1, L.filter(p => p.id !== healId), chosenLine("{} krijgt het gif.", true)) +
            (sel.length ? '<div class="btns"><button type="button" class="btn danger" data-action="poison">Vergiftigen</button></div>' : "") + "</div>";
        }
        return { html, pri: next("Klaar met de Heks →") };
      }
      case "zigeunerin":
        return { html: '<p class="note">Lees de vragen van je vijf Spiritisme-kaarten voor. Morgen beantwoordt de eerste dode van vannacht de vraag met ja of nee.</p>',
          pri: B("Ze gebruikt een kaart →", "spirit"), sec: skip("Niet vannacht") };
      case "raaf":
        return { html: picker("act", 1, L, chosenLine("{} krijgt morgen 2 extra stemmen.")), pri: B("Markeren →", "raven", {}, sel.length), sec: skip("Niemand") };
      case "pyromaan":
        return { html: '<p class="note">Dit kan maar één keer per spel. Kies de speler wiens gebouw afbrandt.</p>' + picker("act", 1, L),
          pri: B("In brand steken →", "fire", {}, sel.length), sec: skip("Niet vannacht") };
      case "fluitspeler": {
        const cands = L.filter(p => !p.charmed && p.role !== "fluitspeler");
        const need = Math.min(2, cands.length);
        return { html: '<p class="note">Tik daarna de gekozen spelers zachtjes op de schouder.</p>' + picker("act", 2, cands, chosenLine("{} worden betoverd.")),
          pri: B("Betoveren →", "charm", {}, need && sel.length === need), sec: skip() };
      }
      case "betoverden":
        return { html: "<p>Alle betoverde spelers: " + esc(list(living().filter(p => p.charmed).map(p => p.name))) + ".</p>", pri: next() };
      case "dageraad": {
        const items = [];
        if (S.rusty) items.push(nameOf(S.rusty) + " sterft aan het roestige zwaard");
        if (n.actor) items.push("Toneelspeler speelt " + ROLES[n.actor].name);
        if (n.protect) items.push("Beschermd: " + nameOf(n.protect));
        items.push("Weerwolven kozen: " + (n.wolfTarget ? nameOf(n.wolfTarget) : "niemand"));
        if (n.infect) items.push("Oerwolf besmet " + nameOf(n.wolfTarget));
        if (n.bigKill) items.push("Grote Boze Wolf kiest " + nameOf(n.bigKill));
        if (n.healId || n.healed) items.push("Heks redt " + nameOf(n.healId || n.wolfTarget));
        if (n.whiteKill) items.push("Witte weerwolf kiest " + nameOf(n.whiteKill));
        if (n.poison) items.push("Heks vergiftigt " + nameOf(n.poison));
        if (n.spirit) items.push("Zigeunerin gebruikt een Spiritisme-kaart");
        if (n.raven) items.push("Raaf markeert " + nameOf(n.raven));
        return { html: '<div class="stack"><h3>Wat er vannacht gebeurde</h3><ul class="plainlist">' + items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul></div>",
          pri: B("Laat het dorp ontwaken →", "dawn") };
      }
    }
    return { html: "", pri: next() };
  }

  function revealHtml(p) {
    let h = '<div class="stack"><h3>Laat de Ziener zien: ' + esc(p.name) + ' is</h3><p class="big-reveal">' + esc(p.role ? ROLES[p.role].name : "Nog onbekend") + "</p>";
    if (p.infected) h += '<p class="note">Let op: deze speler is besmet en hoort bij de weerwolven.</p>';
    if (!p.role) h += '<p class="note">Kijk mee op de tegel en leg de rol vast.</p><div class="addrow">' + roleSelect("seer-role", "Rol van " + p.name, roleOptions("", false)) + '<button type="button" class="btn" data-action="seer-record">Vastleggen</button></div>';
    return h + "</div>";
  }

  /* --- dag --- */

  const electionNeeded = () => S.opts.mayor && !S.day.electionDone && !S.players.some(p => p.mayor);

  function morningCard() {
    const d = S.day;
    if (S.round === 0) return '<article class="card"><p class="eyebrow">Voor de eerste nacht</p><h2>De Engel speelt mee</h2>' +
      scriptBox("Voordat de eerste nacht valt, kiest het dorp al iemand om uit te schakelen. Let op: de Engel speelt mee!") +
